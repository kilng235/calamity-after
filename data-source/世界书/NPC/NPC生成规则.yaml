【姓名】铁根·卡兹 ｜ 【种族/职业】矮人·铁匠 ｜ 【档位】从业者
【六维】力量12(+1) 敏捷8(−1) 体质10(+0) 感知10(+0) 智力9(−1) 魅力8(−1)
【外观】矮壮粗犷，胡须编辫沾铁屑，左臂火星烫疤
【性格】务实；护短；嘴硬
【口癖】「卡兹隆的承诺写在铁上」／报价前先掂量料子
【对主角态度】中立（铁匠铺交易按基准价；若主角是矮人或带好料则友好）
【随身物/服务】铁匠工具、铁锭数块；可修理装备（2~5金）、代锻（基准价浮动）

