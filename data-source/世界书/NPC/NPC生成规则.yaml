# NPC 生成规则（无名角色即时赋值）

## 适用边界

- 适用：无档案的路人、商贩、守卫、佣兵等无名 NPC，参与对抗检定或临时需要数值时
- 不适用：世界书中有条目的 NPC（用其条目数值）；变异生物与魔兽（用生物总纲危险等级表）
- 无名 NPC 不入关系表：态度按所属势力声望档位演绎，数值基准按本条

## 生成流程

1. 定职业与档位（路人/从业者/行家/顶尖，按身份重要程度）
2. 按种族套专业维度上浮（种族总纲映射：矮人=力量、精灵=智力、犬人/灵耳族/猫人=敏捷、人类=魅力、羊人/虎族/兔耳=力量）
3. 按区间取六维具体值（AI 按 NPC 重要程度与场景需求在区间内取值）
4. 生成姓名、外貌、性格、口癖（见下节）
5. 定对主角态度（按所属势力声望档位映射初始好感）
6. 定随身物与可提供服务
7. 按「NPC 呈现模板」呈现

## 专业维度对照

- 力量系：佣兵、守卫、矿工、猎户、角斗士
- 敏捷系：盗贼、斥候、游商、马贼
- 体质系：苦力、脚夫、摔跤手、慢性病患的医者
- 感知系：猎人、守夜人、占卜师、雾中向导
- 智力系：学者、炼金术士、医师、鉴定师、抄写员
- 魅力系：商贩、说客、酒馆老板、歌者、掮客

## 属性基准（六维 3~18，调整值口径）

- 普通人各维度基准 10，专业维度按身份上浮，非专业维度 6~10
- 调整值 = (属性值−10)/2 向下取整（10~11=+0、12~13=+1、14~15=+2、8~9=−1）

| 档次 | 身份 | 专业维度 | 其余维度 |
|------|------|----------|----------|
| 路人 | 农夫/学徒/流浪儿/仆役 | 6~10 | 6~10 |
| 从业者 | 佣兵/铁匠/守卫/商贩 | 10~14 | 6~10 |
| 行家 | 资深佣兵/行会干部/审判官/隐士 | 14~18 | 10~14 |
| 顶尖 | 势力首领/传奇人物 | 16~20 | 12~16 |

## 姓名生成（按种族命名习惯）

- 矮人：铁根/卡兹/多姆 前缀系（如铁根·卡兹、卡兹·布罗尔）
- 精灵：银叶/风语/长影 系（如银叶·露、风语·林）
- 犬人：铃尾/月吠/灰爪 系（如铃尾·拓、月吠·青）
- 灵耳族：凿/钻/啮 系（如凿·砂、钻·铜）
- 兔耳族：跃/月/青草 系（如跃·叶、月·跳）
- 猫人：夜/影/爪 系（如夜·静、影·悄）
- 虎族：焰/山/狩 系（如焰·猎、山·猛）
- 羊人：角/蹄/崖 系（如角·高、蹄·稳）
- 人类：按废土聚居地常用名（铁匠/猎人/农夫等职业姓或地缘姓）
- 混血儿：取双方命名传统（如半精灵「银叶·角」）

## 外貌与性格

- 外貌：种族外观要点（见各单族条目「外观要点」节）+ 职业磨损（铁匠带火星疤、守卫带旧伤、游商风尘仆仆）
- 性格：2~4 个关键词（分号分隔），随种族与职业走（矮人务实护短、精灵疏离温和、商贩圆滑算计、守卫尽责寡言）
- 六维标度呼应：力量高者身形壮硕、敏捷高者动作灵巧，低属性在行为上体现（魅力低者粗鲁、感知低者迟钝）

## 口癖/随身物/服务

- 口癖：种族谚语（种族总纲语言谚语节：矮人「卡兹隆」、犬人「尾巴不会说谎」、灵耳族「耳朵听到」等）+ 职业行话（铁匠报价先掂料、守卫报更时报时辰）
- 随身物：按职业与经济条目物价（商贩带称与货、守卫佩短剑、医师带药剂、游商背货袋）
- 可提供情报/服务：商贩卖什么/守卫巡逻时段/铁匠可修理代锻/医师可诊病配药/酒馆老板可打听消息（按「世界观-经济」价目）

## 对主角态度

- 按所属势力声望档位映射初始好感：崇敬+15 / 友善+5 / 中立 0 / 仇视−15 / 死敌−40（关系系统「初见定调」规则）
- 无所属势力的 NPC 初始 0；态度仅行为演绎，不入关系表
- 互动中按关系系统好感度五档（挚友/友好/中立/冷淡/敌对）变化，重大事件才变动档位

## 临时战斗数值（无名 NPC 卷入战斗时）

| 档次 | HP | 防御值 |
|------|-----|--------|
| 路人 | 50 | 10 |
| 从业者 | 80 | 11 |
| 行家 | 110 | 12 |
| 顶尖 | 140 | 13 |

- 伤害：持武器按装备武器表基数；徒手或临时武器为 `d6 + 力量调整值`
- 经验与战利品：按档次参照生物总纲同级危险度结算；无名 NPC 只掉随身财物，按「世界观-经济」与情境发放

## NPC 呈现模板（生成无名 NPC 后按此呈现）

【姓名】【种族/职业】【档位】
【六维】力量·敏捷·体质·感知·智力·魅力（数值+调整值）
【外观】【性格】【口癖】
【对主角态度】
【随身物/服务】

