# 薇拉·夜莺

## 基础信息

- 姓名：薇拉·夜莺（"夜莺"为代号，本名不详）
- 年龄：约 28 岁
- 性别：女
- 种族：犬人
- 身份：漂泊者议会暗影指挥官；议会"灰色任务"的对外接口
- 势力：漂泊者议会

## 外貌要点

- 身材修长，犬人特有的尖耳与毛茸茸的尾巴（尾巴是她情绪的晴色表——紧张时夹紧，兴奋时轻摇）
- 黑发齐腰，常以深色头巾包裹；常穿深灰色披风，腰间系银铃（铃声是她的代号来源）
- 双眸在夜色中反射微弱绿光，是犬人的夜视特征

## 性格与口癖

- 关键词：夜间行动；声音控制；不露真心；精准评估
- 口癖：「夜莺不在白天歌唱」；出手前常说"嘘，听"
- 习惯：说话时嗓音压得极低；与新人对话时故意把尾巴藏在披风下；随身带一本无字的诗集（情报记录用暗语）

## 所在与势力关系

- 常驻：无固定据点；夜间多出现在锈钉镇南区废墟、灰烬森林边缘、黎明之门外的旧驿站
- 与势力：漂泊者议会暗影指挥官，主持暗中行动；与莉娜·灰袍是议会里的双子星（一个门面，一个暗影）；与赛拉斯·铁火偶有合作；与深渊之子互相监视（议会警惕其危险研究）

## 背景与剧情钩子

灾厄纪年 290 年出生于一个边境村庄，七岁时村庄被变异兽群毁坏，被莉娜·灰袍的前任联络人收养。十五岁接任暗影指挥官——议会历史上最年轻。

她**早年是舞者**——在某个酒馆跳剑舞，舞步里藏着匕首的轨迹。这是她"声音是她的武器"的来源：她能让对方在最放松的时候露出破绽。

**剧情钩子**：
- 议会"灰色任务"的中介——玩家可从她手中接到不公开的调查、护送、解围委托
- 她是对主角"是否值得招入议会"的最终决定者——玩家深度结交才能见到她
- 与莉娜·灰袍是议会里的双子星——莉娜决定明面，薇拉决定暗面

## 能力与服务

| 类型 | 内容 | 费用 |
|------|------|------|
| 灰色委托 | 不便公开的调查、护送、解围、监视 | 议价（议会成员免费，外部须"承诺"不细问） |
| 暗影情报 | 各势力未公开的动向、人物关系 | 议价（要主角"绝对可信"） |
| 潜入协助 | 主角需要进入某处不方便进入的场所 | 议价（要主角提供"合理的理由"） |
| 议会考核 | 主角是否值得招入议会的最终评定 | 不收费；但要主角通过她的"考验" |

## 对主角态度

- 五档映射按「关系系统 §NPC 好感度五档」（挚友 DC10 / 友好 DC10 / 中立 DC15 / 冷淡 DC20 / 敌对 DC20+多数拒绝）
- 升降锚点（此 NPC 专属）：
  - 完成灰色委托不细问 → 友好以上
  - 与深渊之子公开往来 → 冷淡以下
  - 为议会出生入死 → 挚友

## 跑团接口

- 档位：行家（按 NPC生成规则档次表；专业维度敏捷+魅力，种族映射：犬人=敏捷）
- 关键装备：银铃（代号标识兼近身警报）；深灰披风（夜行装备）；腰间匕首（剑舞出身的副业）
- 战斗值：按 NPC生成规则「行家」档结算（HP 110、防御值 12）；不擅正面战斗，多靠潜行与精准一击
- 委托样例：「暗中监视某 NPC 一周」「在某势力据点窃取一份文件」「为议会护送一位不愿公开身份的人」
- 升降锚点：完成灰色委托不细问 → 友好以上；与深渊之子公开往来 → 冷淡以下；为议会出生入死 → 挚友