# 伊莎·圣焰

## 基础信息

- 姓名：伊莎·圣焰（"圣焰"为名号，本姓不详）
- 年龄：约 30 岁
- 性别：女
- 种族：人类（**有半精灵血统争议，隐藏中**）
- 身份：圣火骑士团审判官
- 势力：圣火骑士团

## 外貌要点

- 中等身材，气质冷峻；黑发齐肩剪得一丝不苟，常年束在脑后
- 双瞳颜色偏灰绿（半精灵血统的体征，被她用染色眼药掩饰）
- 服饰：审判官专属黑底红边长袍，配圣火徽章；随身一本审讯日志，从不离身

## 性格与口癖

- 关键词：冷静；不徇私；秘密重压；公正但无情
- 口癖：「真相只有一个，证词可以有很多」；结案常说「记录在案」
- 习惯：审讯时不与被告目光相接；记录从不用速记，全凭记忆——这是她"公正无私"的招牌

## 所在与势力关系

- 常驻：黎明之门审判庭；偶尔外出调查异端案件
- 与势力：圣火骑士团审判官，独立于大团长与副团长之外的第三方；与索恩·灰烬拳立场相近但嫌他"不够理性"；与马库斯·圣火保持职业距离；**与旧日遗民凯尔·拾灰者存在潜在冲突**（其发掘被视为潜在异端）

## 背景与剧情钩子

父亲是人类骑士团成员，母亲是灾厄前穿越裂隙而来的精灵——她自己八岁时母亲被骑士团处决，她在审判庭记录里第一次读到母亲的名字。她接任审判官是为了**从内部改革这一制度**，但她的血统一旦公开，她自己就是被告。

她从未向任何人透露过血统，包括马库斯与索恩。

**剧情钩子**：
- 调查禁忌遗物时可成为"被怀疑方"——让玩家抉择站边：检举她、掩护她、还是保持中立
- 她审判的对象可能与凯尔/旧日遗民相关——一旦凯尔被传讯，玩家可作为关键证人
- 她的血统是长线秘密；当玩家深度介入骑士团事务后，可能从某些细节嗅到端倪

## 能力与服务

| 类型 | 内容 | 费用 |
|------|------|------|
| 调查 | 异端案件、禁忌遗物、伪造身份 | 议价（按案件复杂度 50~500 金） |
| 审讯协助 | 为某方在审判庭上的辩护准备 | 议价（要主角"证明立场"） |
| 秘密情报 | 骑士团内部未公开的案件 | 只对"绝对可信的人"开放 |
| 公正审判 | 在骑士团审判庭上为某方作证 | 不收费；要主角提供"绝对可信"的证据 |

## 对主角态度

- 五档映射按「关系系统 §NPC 好感度五档」（挚友 DC10 / 友好 DC10 / 中立 DC15 / 冷淡 DC20 / 敌对 DC20+多数拒绝）
- 升降锚点（此 NPC 专属）：
  - 提供绝对可信的证据 → 友好以上
  - 隐瞒重大秘密被发现 → 冷淡以下
  - 为她保守血统秘密 → 挚友

## 跑团接口

- 档位：行家（按 NPC生成规则档次表；专业维度智力，种族映射：人类=魅力——但审判官按身份上浮至智力）
- 关键装备：审讯日志（记录骑士团内所有异端审判，藏着她自己的秘密）；黑底红边长袍（审判官标识）
- 战斗值：按 NPC生成规则「行家」档结算（HP 110、防御值 12）；不擅战斗，多由审判庭护卫代劳
- 委托样例：「为某件遗物是否属于禁忌做鉴定」「为骑士团审判庭上的某方证人准备证据」「调查某 NPC 隐藏的身份」
- 升降锚点：提供绝对可信的证据 → 友好以上；隐瞒重大秘密被发现 → 冷淡以下；为她保守血统秘密 → 挚友