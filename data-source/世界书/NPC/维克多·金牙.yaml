# 维克多·金牙

## 基础信息

- 姓名：维克多·金牙
- 年龄：约 48 岁
- 性别：男
- 种族：人类
- 身份：自由佣兵联盟会长；锈钉镇事实上的"市政管理者"
- 势力：自由佣兵联盟

## 外貌要点

- 中等身材、保养得当；左上一颗门牙是纯金打制，说话间金光闪烁
- 棕发油光水滑，常梳向脑后；左手无名指戴一枚黑铁戒指（联盟会长信物）
- 服饰：合身的深棕色皮甲外套，内衬白绸衬衫——佣兵圈里少见的"讲究人"

## 性格与口癖

- 关键词：精明；左右逢源；唯利是图但守信；笑里藏刀
- 口癖：「金币不咬人，咬人的是没钱」；报价时用手指数，金牙一闪一闪
- 习惯：每谈一桩生意必先敬对方一杯；从不先亮底牌，等对方先出价

## 所在与势力关系

- 常驻：锈钉镇佣兵公会二楼（办公区）；偶尔巡街时在主街尽头的茶亭歇脚
- 与势力：自由佣兵联盟在佣兵镇最高代表；与赛拉斯·铁火"默契抽佣"；与圣火骑士团保持暧昧（不结盟但互不侵犯）；与莫拉·血币暗中往来

## 背景与剧情钩子

二十年前是走南闯北的掮客，靠倒卖情报与稀缺物资赚得第一桶金。灾厄纪年 280 年通过一系列交易与谈判，把镇上散乱的佣兵团整合成"自由佣兵联盟"，自任会长。镇上大半生意——从装备回收、任务中介、纠纷调解——都要过他的手。

他的金牙是年轻时与一位矮人牙医的赌约：赌他能在一年内把负债翻三倍，他做到了，从此镶了这颗金牙。

**剧情钩子**：
- 主角加入佣兵联盟需他亲笔签发"联盟登记证"——这是新手主线必经流程
- 他手里压着几张"灰色委托"（涉及与黑市商人莫拉·血币的往来），可作为长线支线
- 他与老维特失踪案有间接牵连——老维特曾是他的情报提供人

## 能力与服务

| 类型 | 内容 | 费用 |
|------|------|------|
| 联盟登记 | 新佣兵入盟登记、领取登记证 | 5 金（年费） |
| 任务发布 | 公开与灰色任务的中介 | 佣金的 15% 抽成 |
| 仲裁 | 佣兵之间、佣兵与雇主之间的争议 | 10~100 金（按争议金额） |
| 特殊物资 | 稀有装备与材料的内部渠道 | 基准价 +20~50%（含抽佣） |

## 对主角态度

- 五档映射按「关系系统 §NPC 好感度五档」（挚友 DC10 / 友好 DC10 / 中立 DC15 / 冷淡 DC20 / 敌对 DC20+多数拒绝）
- 升降锚点（此 NPC 专属）：
  - 完成灰色委托且不细问 → 友好以上
  - 泄露联盟内部信息 → 冷淡以下
  - 连续三次交付优异 → 挚友

## 跑团接口

- 档位：行家（按 NPC生成规则档次表；专业维度魅力，种族映射：人类=魅力）
- 关键装备：黑铁戒指（联盟会长信物）；腰间短剑装饰多于实战
- 战斗值：按 NPC生成规则「行家」档结算（HP 110、防御值 12）
- 委托样例：「接下老维特失踪旧单的新版本」「为镇外某商人护送货物到灰烬森林边缘」
- 升降锚点：完成灰色委托且不细问 → 友好以上；泄露联盟内部信息 → 冷淡以下；连续三次交付优异 → 挚友