# 杜兰·碎星

## 基础信息

- 姓名：杜兰·碎星（"碎星"为号，纪念其第一次把星铁打碎炼成合金的壮举）
- 年龄：约 50 岁
- 性别：男
- 种族：犬人
- 身份：流浪炼金术士；唯一可加工禁术材料（灾厄金属）的铁匠
- 势力：无（独立流浪者）；与旧日遗民有旧识但已反目

## 外貌要点

- 中等身材的犬人，毛色棕褐；尖耳常被一顶宽檐皮帽遮住，尾巴常年盘在腰间以免碰到药剂瓶
- 双眼布满血丝（常年熬夜炼金所致）；右手食指缺了一截（某次灾厄金属爆炸的代价）
- 服饰：炼金围裙（口袋比艾拉的还多）；背后一只沉重的木箱，里面是移动炼金炉

## 性格与口癖

- 关键词：唯利是图；守诺；知识狂热；旧怨未解
- 口癖：「碎星不打水漂」；与凯尔相遇时眼神复杂，常说"我们早就不是一路人了"
- 习惯：每到一城必先找黑市；报价时把材料成本写在纸上让对方看；每炼成一剂必亲自试

## 所在与势力关系

- 常驻：无固定据点；常出现在佣兵镇锈钉的废墟区、北方山脉的废弃矿井、深渊裂隙边缘的隐秘营地
- 与势力：独立流浪者，与任何势力不结盟；与凯尔·拾灰者是旧识反目（师徒或兄弟——灾厄金属加工权的方法论分歧）；与莫拉·血币有生意往来；与塞壬·渊语互相警惕（双方都研究灾厄金属但方向不同）

## 背景与剧情钩子

三十年前是凯尔·拾灰者的炼金学徒——灾厄纪年 270 年因"是否该加工灾厄金属"与凯尔彻底决裂。凯尔走实用路线（保留知识、拒绝禁术），杜兰走禁术路线（既然灾厄金属已经存在，不如研究透彻）。

他流浪三十年，走遍所有能找到灾厄金属的地方——但他守一条底线：**绝不把灾厄金属武器卖给会伤害平民的人**。这条底线是他和凯尔唯一还没彻底撕破脸的理由。

**剧情钩子**：
- 灾厄金属加工权（另一通道，与凯尔并列）
- 稀有炼金配方（灾厄金属、禁忌药剂、稀有材料）
- 与凯尔·拾灰者的师徒/兄弟反目线是长线剧情弧——玩家深度结交两人后可能成为调解人

## 能力与服务

| 类型 | 内容 | 费用 |
|------|------|------|
| 灾厄金属加工 | 黑曜铁/血晶石/星铁的炼化与精炼 | 极高（300~1000 金/件，按难度） |
| 稀有炼金 | 灾厄金属、禁忌药剂、稀有材料的炼制 | 议价（按配方 100~500 金） |
| 知识咨询 | 灾厄金属的来源、性质、加工方法 | 议价（要主角"承诺不外传"） |
| 炼金代工 | 稀有/禁术/灾厄类配方的委托炼制（对标「铁匠代工」；普通药剂走「炼金规则·炼金代工」基准价） | +30~50%（按「炼金配方表」稀有禁术类） |

> 杜兰是「炼金规则·炼金代工」里唯一的禁术/灾厄类代工入口，可承接普通铁匠/药商接不了的单（灾厄金属精炼、禁忌药剂）。

## 对主角态度

- 五档映射按「关系系统 §NPC 好感度五档」（挚友 DC10 / 友好 DC10 / 中立 DC15 / 冷淡 DC20 / 敌对 DC20+多数拒绝）
- 升降锚点（此 NPC 专属）：
  - 守诺 → 友好以上
  - 试图劝他与凯尔和好 → 冷淡
  - 为灾厄金属研究作出重大贡献 → 挚友

## 跑团接口

- 档位：顶尖（按 NPC生成规则档次表；专业维度智力，种族映射：犬人=敏捷——但炼金术士按身份上浮至智力）
- 关键装备：移动炼金炉（藏于背后木箱）；炼金围裙（口袋多）；灾厄金属样本（从不离身）
- 战斗值：按 NPC生成规则「顶尖」档结算（HP 140、防御值 13）；不擅战斗，多靠炼金烟雾与地形脱身
- 委托样例：「把灾厄金属原料炼成法器材料」「把一批能量矿石炼成施法媒介」「鉴定一件疑似灾厄金属的物品」
- 升降锚点：守诺 → 友好以上；试图劝他与凯尔和好 → 冷淡；为灾厄金属研究作出重大贡献 → 挚友