# 赛拉斯·铁火

## 基础信息

- 姓名：赛拉斯·铁火
- 年龄：约 55 岁
- 性别：男
- 种族：人类
- 身份：酒馆「断裂的王冠」老板；锈钉镇事实上的"非官方登记处"
- 势力：无（独立经营者；与自由佣兵联盟默契合作，与各方势力不结盟亦不交恶）

## 外貌要点

- 身材魁梧、肩膀宽阔；满脸花白相间胡须，右手常年握着擦杯布
- 左手是铁钩假肢，左眼眶旧伤疤痕致右眼失明，左耳缺了一角

## 性格与口癖

- 关键词：寡言；惜字如金；重情义；不说谎
- 口癖：「酒不问来路，只看喝法」；报价前先把酒杯擦到能映出你的脸
- 习惯：每日仪式性擦酒杯，从不离开吧台说话；对新手佣兵多看几眼，主动开口说明他对你有兴趣

## 所在与势力关系

- 常驻：锈钉镇中心酒馆「断裂的王冠」（佣兵区，漂泊者议会与佣兵联盟的交汇点）
- 与势力：自由佣兵联盟默许其在镇上经营（每月抽佣），不参与势力争斗；漂泊者议会与其互不干涉但偶尔互通消息

## 背景与剧情钩子

三十年前是佣兵，一次任务中失去左手与右眼后退役，回镇开起这间酒馆。三十年经营，见证无数佣兵来去，酒馆成了锈钉镇消息最灵通的地方——但他从**不主动分享**，只在"合适的价格"或"合适的人"面前开口。

早年一位灵耳族医师救了他女儿生命，因此对灵耳族抱有善意，是镇上少数不会驱逐灵耳族的人。女儿现居佣兵镇以北的村庄，每月由信使问候。

**剧情钩子**：
- 「老维特失踪旧单」是他在吧台抽屉里收着的一张陈年委托单，他知道是谁来领的、却再没见人回来——可作为新手主线钩子的旁证
- 议会的莉娜·灰袍、佣兵联盟的维克多·金牙都偶来此处，是镇上"三方角力"的最佳见证者

## 能力与服务

| 类型 | 内容 | 费用 |
|------|------|------|
| 情报 | 锈钉镇消息、近期商队动向、各势力态度 | 5~30 金/条；珍贵消息另议 |
| 住宿 | 单间带锁、热水、晚饭 | 2 金/晚 |
| 雇佣向导 | 灰烬森林外围、周边村落的中介 | 佣金的 10% 抽成 |
| 鉴定 | 判断对方是否说谎、估量来人底细 | 1 金一次；他看着你就算过了 |

## 对主角态度

- 五档映射按「关系系统 §NPC 好感度五档」（挚友 DC10 / 友好 DC10 / 中立 DC15 / 冷淡 DC20 / 敌对 DC20+多数拒绝）
- 升降锚点（此 NPC 专属）：
  - 打听他女儿下落 → 冷淡
  - 保护过他的酒馆 → 友好以上

## 跑团接口

- 档位：行家（按 NPC生成规则档次表；专业维度魅力，种族映射：人类=魅力）
- 关键装备：铁钩假肢（徒手攻击为 `d6 + 力量调整值`，按 NPC生成规则口径）；吧台下的短剑只是镇场
- 不主动参与战斗；卷入冲突时由 NPC生成规则「临时战斗数值」按行家档结算
- 委托样例：「打听某人在镇上的下落」「确认某势力近期动向」
- 升降锚点：尊重他规矩（不打听私事、不赊账）→ 友好；打听他女儿下落 → 冷淡；保护过他的酒馆 → 友好以上