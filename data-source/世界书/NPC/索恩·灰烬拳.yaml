# 索恩·灰烬拳

## 基础信息

- 姓名：索恩·灰烬拳（"灰烬拳"为名号，纪念其在灰烬森林独剿变异狼群之事）
- 年龄：约 38 岁
- 性别：男
- 种族：人类
- 身份：圣火骑士团副团长；激进派代表
- 势力：圣火骑士团

## 外貌要点

- 体壮如熊，肩宽背厚；红褐色短发剪得极短，下巴常年留短须
- 双手指节粗大，指甲修得极短——便于握拳；颈侧有一道旧狼爪留下的长疤
- 铠甲不离身，平日也穿轻甲（被同僚称为"穿铠甲睡觉的人"）

## 性格与口癖

- 关键词：激进；冲动；外族外族零容忍；正直但狭窄
- 口癖：「异端烧不尽，圣火烧不熄」；与新面孔说话先盘问三句
- 习惯：开会时手指敲桌；遇异族 NPC 立刻起身戒备；常年带圣火徽章擦得锃亮

## 所在与势力关系

- 常驻：黎明之门北区骑士营；偶尔率队外出清剿
- 与势力：圣火骑士团副团长，激进派领袖；与马库斯的温和路线长期政争；与伊莎·圣焰立场相近但嫌她"不够狠"；对外族 NPC 与深渊之子零容忍；对玩家这种"新人"默认是"可疑新面孔"

## 背景与剧情钩子

灾厄纪年 282 年的灰烬森林独剿行动成名，彼时年仅 24 岁。被视为骑士团"下一代团长的当然人选"——但他与马库斯的路线分歧让他无法得到全部元老支持。三十多岁未娶，无子嗣，性格孤傲。

**剧情钩子**：
- 主张把主角当作"可疑新面孔"审讯，是新手进入骑士团视野的"敌人"选项
- 与马库斯的政争是长线；当他察觉马库斯在"安排继承"时，会主动出手搅局
- 可能与塞壬·渊语正面冲突——他视深渊之子为骑士团的首要敌人

## 能力与服务

| 类型 | 内容 | 费用 |
|------|------|------|
| 委托 | 高风险清剿任务（变异兽群、盗匪窝点） | 报酬丰厚（30~150 金）但要求极高 |
| 协助 | 讨伐深渊之子边哨、护送高价值目标 | 仅对"信得过的人"开放 |
| 训练 | 近身战、双手剑、克制深渊系生物的训练 | 议价（要主角通过他的"考验"） |
| 仲裁 | 与骑士团敌对势力的纠纷 | 不公开；要主角"证明立场" |

## 对主角态度

- 五档映射按「关系系统 §NPC 好感度五档」（挚友 DC10 / 友好 DC10 / 中立 DC15 / 冷淡 DC20 / 敌对 DC20+多数拒绝）
- 升降锚点（此 NPC 专属）：
  - 在主轴上建立战功 → 友好以上
  - 与外族 NPC 平等交往 → 冷淡以下
  - 为骑士团出生入死 → 挚友

## 跑团接口

- 档位：行家（按 NPC生成规则档次表；专业维度力量，种族映射：人类=魅力——但体壮如熊，按身份上浮至力量）
- 关键装备：双手剑（主武器，铁剑或双手剑装备条目口径）；锁甲；圣火徽章
- 战斗值：按 NPC生成规则「行家」档结算（HP 110、防御值 12）；近战战力是骑士团顶尖
- 委托样例：「清剿灰烬森林深处的变异狼群」「截击一支疑似深渊之子边哨的队伍」「为主角提供针对深渊系生物的训练」
- 升降锚点：在主轴上建立战功 → 友好以上；与外族 NPC 平等交往 → 冷淡以下；为骑士团出生入死 → 挚友