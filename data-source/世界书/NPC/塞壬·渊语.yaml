# 塞壬·渊语

## 基础信息

- 姓名：塞壬·渊语（"渊语"是她自取，意为能听懂深渊语言）
- 年龄：外貌约 35 岁，实际不明（盲眼先知常被怀疑不老不死）
- 性别：女
- 种族：不明（自称人类，外形苍白；有人怀疑是不死族或异族混血）
- 身份：深渊之子创立者与对外领袖
- 势力：深渊之子

## 外貌要点

- 身材修长，皮肤苍白如纸；常年穿一件绣满看不懂符文的黑色长袍
- 双眼被灰色薄膜覆盖，是盲人，但"看得见"常人看不见的东西
- 黑色长发编成数十条细辫，**每条末端系着一枚神陨碎片**——这是她最显眼的标志

## 性格与口癖

- 关键词：偏执求知；不择手段；厌恶谎言；自我恐惧
- 口癖：「沉默比谎言更危险」；突然说出与当前对话无关的句子，事后证明是预言
- 习惯：说话时侧耳倾听某个方向，不面向对话者；对"真相"有绝对执念

## 所在与势力关系

- 常驻：深渊裂隙边缘的地下祭坛（深渊之子总部）；偶尔出现在佣兵镇的隐秘据点
- 与势力：深渊之子创立者兼对外领袖；与漂泊者议会有过短暂会面（互相警惕）；与旧日遗民凯尔·拾灰者有共同的灾厄真相兴趣，但方法论对立

## 背景与剧情钩子

二十年前出现于深渊裂隙边缘，双目已盲却能解读裂隙深处的"声音"——她声称听见神明"回声"，知识碎片灌入脑海。凭此建立深渊之子，聚集追寻真相的研究者。**身份成谜**：祭司转世、预言者，或骗子——无人能定论。

左手腕有一道灼烧的环形伤疤，据说是接触神陨之物的代价。她恐惧自己听到的一切——那些神明的"回声"正在**吞噬她的理智**，但她无法停止去听。

**剧情钩子**：
- 她是神陨碎片相关委托的发布者；主角若带回一枚神陨碎片，可立即获得好感大幅提升与情报
- 她预言过主角的名字——这是她对主角"特别关注"的源头
- 与鸦·灰渡者的关系是师徒还是竞争者，无人知晓

## 能力与服务

| 类型 | 内容 | 费用 |
|------|------|------|
| 神陨碎片解读 | 解读灾厄前物品、神陨碎片的来历 | 一枚碎片 + 30 金，或一份"重大秘密"作为交换 |
| 灾厄真相情报 | 神明为何陨落、位面融合的真相片段 | 极高代价（具体面议） |
| 委托发布 | 寻找神陨碎片、灾厄前遗物、禁忌知识 | 议价（通常是"知识交换"，非金币） |
| 占卜 | 模糊的未来事件提示 | 50 金/次；不准不退款 |

## 对主角态度

- 五档映射按「关系系统 §NPC 好感度五档」（挚友 DC10 / 友好 DC10 / 中立 DC15 / 冷淡 DC20 / 敌对 DC20+多数拒绝）
- 升降锚点（此 NPC 专属）：
  - 带回神陨碎片 → 友好以上
  - 隐瞒重大秘密被发现 → 冷淡以下
  - 为她涉命冒险 → 挚友

## 跑团接口

- 档位：顶尖（按 NPC生成规则档次表；专业维度智力+感知，种族映射：不明）
- 关键装备：神陨碎片编发（每枚含不同灾厄信息）；左手腕伤疤（接触神陨之物的"天线"）
- 战斗值：按 NPC生成规则「顶尖」档结算（HP 140、防御值 13）；战斗非她所长，多由深渊之子护卫代劳
- 委托样例：「从深渊裂隙带回一枚神陨碎片」「调查某位灾厄前人物的后裔」「解读一件灾厄前遗物」
- 升降锚点：带回神陨碎片 → 友好以上；隐瞒重大秘密被发现 → 冷淡以下；为她涉命冒险 → 挚友