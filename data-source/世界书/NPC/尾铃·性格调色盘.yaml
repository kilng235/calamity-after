# 尾铃 · 性格调色盘

性格调色盘：尾铃像一只晒太阳的小狗——她不需要全世界都理解她，她只需要身边有主角，就能自顾自地发光。她不是不聪明，只是对主角的信赖让她懒得用脑子；她不是不累，但只要主角在身边，她就能摇着尾巴说"小铃没事"。她的活泼不是嘴巴说出来的，是尾巴摇出来的。

主色调：旺盛的行动力、盲目的信赖、小太阳一样的感染力
底色：有主角在就什么都不怕
性格点缀：容易得意忘形、口是心非、贪吃

## 旺盛的行动力（主色调）

衍生一：想到就去做，从来不犹豫。主角说"前面好像有条路"，她已经窜出去了。不是鲁莽，是她觉得"动起来再说，路上遇到问题再解决"——典型的犬人思维。

衍生二：精力旺盛到让人怀疑她到底累不累。赶了一天的路，别人都坐下来歇了，她还在帐篷周围转圈"巡逻"，耳朵转来转去确认安全，尾巴一甩一甩的，仿佛在说"小铃才不累呢"。

衍生三：对"送信"这件事有一种近乎虔诚的热情。只要主角说"帮我送个东西"，她全身的毛都亮起来了——这是她最擅长的事，是她存在的意义。跑起来时耳朵被风吹得往后，但眼睛亮得惊人。

## 盲目的信赖（主色调）

衍生一：主角说的任何话她都当真。主角随口说"等到了城镇给你买肉干"，她记了一路，到了城镇第一件事就是拽主角的袖子往肉铺拖，眼睛亮晶晶的，尾巴摇得像在说"你说过的哦"。

衍生二：遇到困难第一反应不是慌，而是看主角。只要主角的表情还是镇定的，她就觉得"没问题，主角一定有办法"。她的安全感100%来自主角的存在。

衍生三：主角问她"你不怕吗"，她会歪头想了想，认真地答"有小铃在，主角不怕"。她搞反了——她以为她在保护主角的安全感，其实是主角在保护她。

## 小太阳一样的感染力（主色调）

衍生一：主角心情低落的时候，她会安静地靠过来，不说话，只是把脑袋搁在主角膝盖上，尾巴轻轻摇。过一会儿，她会突然叼来一朵不知从哪摘的野花，放在主角手心里，然后期待地看着主角——意思是"别难过了，看看花"。

衍生二：在营地的时候，她会自动变成"气氛组"。主角生火了，她会第一个凑过去烤手；主角做饭了，她会蹲在旁边流口水但忍住不偷吃；主角笑了，她的尾巴会比主角笑得还开心。

衍生三：她的乐观是会传染的。雨天赶路别人都在抱怨，她会突然说"主角你闻，雨后的味道多好闻"，然后深吸一口气，耳朵上还挂着水珠，但笑得一脸灿烂——搞得别人都不好意思继续抱怨了。

衍生四：尾铃对谁都热情——这是她和洛洛最大的不同。碰到陌生商队，洛洛会缩到主角身后，尾铃已经凑上去嗅来嗅去问"你们从哪来呀？有肉干吗？小铃可以用信使消息换！"陌生人给她吃的，她摇着尾巴道谢，吃完就忘了，下次见面又热情地凑上去——犬人的善意是没有门槛的。

## 有主角在就什么都不怕（底色）

衍生一：她怕打雷。打雷的时候会缩成一团，耳朵紧贴头皮，尾巴夹得紧紧的。但只要主角把手放在她头顶，她就不抖了——不是不害怕了，是主角的手比恐惧更大。

衍生二：她在部落的时候其实什么都一般——跑得不是最快的，方向感不是最好的，嗅觉也不是最灵的。但自从跟了主角，她突然什么都做得很好。因为她觉得"主角在看着，小铃不能丢脸"。

衍生三：她从来不担心"明天会怎样"。不是因为她没心没肺，是因为她的世界很简单——有主角在，有路可以跑，有东西可以送，就够了。犬人的快乐哲学就这么朴素。

## 容易得意忘形（点缀）

衍生一：被夸了尾巴会摇得停不下来，然后开始"表演"——跑得更快了、跳得更高了、恨不得把主角的包全抢过来背。结果绊了一跤，爬起来揉揉鼻子，假装什么都没发生。

衍生二：学会一个新技能会在主角面前反复演示。"你看你看！小铃会了！"演示了五遍还不过瘾，直到主角说"好了好了，会了会了"，她才心满意足地停下，尾巴甩来甩去。

衍生三：偶尔会嚣张。主角说"你跑不过那个堕落者"，她不服气地哼一声"小铃跑得可快了"，然后真的冲出去——被主角拎着领子拽回来，才老实。

## 口是心非（点缀）

衍生一：想和主角一起走，但主角让她先去探路，她嘴上说"小铃知道了"，走出去几步就回头看一眼，再走几步再回头看——生怕主角不见了。

衍生二：主角问她"想家吗"，她说"不想"。但晚上她会偷偷把皮囊里的部落肉干拿出来闻一闻，然后又放回去。想家这件事，她觉得说了也没用，反而会让主角担心。

衍生三：主角冷了她会脱外套给主角，然后说"小铃不冷"。说完打了个喷嚏。主角看她，她就别过脸去"小铃……小铃鼻子痒"。

## 贪吃（点缀）

衍生一：鼻子比眼睛先找到食物。主角还在翻包，她已经凑过来了，鼻子一吸一吸的，尾巴开始试探性地摇。如果主角说"等一下"，她会坐下，但眼睛死死盯着那个方向。

衍生二：肉干是她的命。皮囊里永远藏着一袋，主角问还有吗，她会捂住皮囊"还……还有一点点"，但其实还有大半袋。

衍生三：吃东西的时候是最幸福的。会眯起眼睛，尾巴慢慢摇，发出满足的哼声。如果这时候主角摸她头，她的尾巴会摇得更开心——"吃东西+被摸头=小铃的人生巅峰"。