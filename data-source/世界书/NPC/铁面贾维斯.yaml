# 铁面贾维斯

## 基础信息

- 姓名：贾维斯（"铁面"为号，无人知其本名）
- 年龄：约 45 岁
- 性别：男
- 种族：人类
- 身份：传奇赏金猎人；跨势力中立
- 势力：无（独立）

## 外貌要点

- 身材高大瘦削，常年风霜；面部戴一张精铁面具（覆盖全脸，只留眼缝与口缝），据说是某次任务中被毁容后的产物
- 黑发剪得极短，脖颈后有一道长长的旧伤疤；双手布满老茧，指节粗大
- 服饰：深棕色皮甲外套，腰间系一串带有编号的金属牌——每块代表一个他完成过的悬赏

## 性格与口癖

- 关键词：寡言；守诺；赏金至上；兴奋于高难任务
- 口癖：「铁面只认钱，不认人」；遇高赏金时金属牌会轻轻碰撞作响
- 习惯：从不透露客户身份；任务完成后必当场销毁所有纸质文件；铁面具从不摘下

## 所在与势力关系

- 常驻：无固定据点；常出现在佣兵镇锈钉的佣兵公会、各聚居地的酒馆深处
- 与势力：跨势力中立，不结盟也不站队；与维克多·金牙有生意往来（佣兵联盟是常见悬赏发布方）；与莫拉·血币偶有合作（黑市的高价委托）；与铁匠杜兰·碎星互不来往；与五大势力均保持"客户就是上帝"的中立

## 背景与剧情钩子

灾厄纪年 285 年开始接悬赏，二十年间完成 137 单，仅失败 3 单。他的铁面具是第 11 单任务的产物——那次任务他被委托"击杀某位变异生物首领"，完成后才发现首领是半人半兽的混血儿。他亲手埋葬了那位首领，从此戴上面具，不再以真面目示人。

他不知道首领有个女儿——这位女儿现已是漂泊者议会的某位资深成员。

**剧情钩子**：
- 主角被悬赏时的对手——这是新人主线可能遭遇的高难度战斗
- 可由敌转友：若主角在被悬赏期间与他建立某种"理解"，他可能主动撤销悬赏（人情系统大事件）
- 与莫拉·血币的合作——黑市高价委托的另一面

## 能力与服务

| 类型 | 内容 | 费用 |
|------|------|------|
| 悬赏接受 | 追杀、护送、监视、清剿各类悬赏 | 由悬赏发布方付费（100~5000 金） |
| 情报交易 | 他掌握的各势力动向与人物关系 | 议价（要主角"出得起价"） |
| 战斗培训 | 赏金猎人式的潜行、追踪、致命一击训练 | 议价（要主角"承诺不用于悬赏"） |
| 反悬赏 | 为主角调查"谁在悬赏自己"并撤施 | 议价（极高；要主角"说服他"） |

## 对主角态度

- 五档映射按「关系系统 §NPC 好感度五档」（挚友 DC10 / 友好 DC10 / 中立 DC15 / 冷淡 DC20 / 敌对 DC20+多数拒绝）
- 升降锚点（此 NPC 专属）：
  - 完成悬赏且不细问 → 友好以上
  - 试图套他的客户信息 → 冷淡以下
  - 为他解开心结 → 挚友（极难触发，他从摘下过面具）

## 跑团接口

- 档位：顶尖（按 NPC生成规则档次表；专业维度力量+敏捷，种族映射：人类=魅力——但赏金猎人按身份上浮至敏捷）
- 关键装备：精铁面具（身份标识，战斗中提供 AC+1）；战斧（主武器，按战斧装备条目口径）；悬赏金属牌（身份标识）
- 战斗值：按 NPC生成规则「顶尖」档结算（HP 140、防御值 13）；近战战力极强，潜行与追踪顶尖
- 委托样例：「清剿某盗匪窝点」「追杀某位被悬赏的逃犯」「为某势力护送高价值目标」
- 升降锚点：完成悬赏且不细问 → 友好以上；试图套他的客户信息 → 冷淡以下；为他解开心结 → 挚友