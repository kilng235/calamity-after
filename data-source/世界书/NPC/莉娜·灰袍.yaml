# 莉娜·灰袍

## 基础信息

- 姓名：莉娜·灰袍（"灰袍"为漂泊者议会灰袍修士级衔，亦作代号）
- 年龄：约 32 岁
- 性别：女
- 种族：人类
- 身份：漂泊者议会在佣兵镇锈钉的常驻联络人
- 势力：漂泊者议会

## 外貌要点

- 中等身材，灰袍常年披肩（议会标准灰袍，袖口有暗色绣纹）
- 棕色短发编成一条辫子垂在胸前；左颊一道淡疤，据说是某次保护平民时留下的
- 眼神温和但总带着一丝观察

## 性格与口癖

- 关键词：温和；立场坚定；寡言守密；保护弱者
- 口癖：「我们不问过去，只问现在」；劝阻时低声说「有些事，追到了反而比追不到更苦」
- 习惯：与人谈话时手里常攥着一颗白石子，是议会的暗号之一

## 所在与势力关系

- 常驻：锈钉镇酒馆「断裂的王冠」二楼角落；镇北通向黎明之门的旧驿站
- 与势力：漂泊者议会在佣兵镇唯一的正式代表；与赛拉斯·铁火互相信任（议会给他女儿送过药材）；与维克多·金牙保持礼貌距离

## 背景与剧情钩子

十年前因家乡被变异兽群毁坏，被议会灰袍修士收养并培养。五年学徒，三年外勤，两年前调任锈钉镇。她是议会在佣兵镇的"门面"——所有议会在佣兵镇发布的任务、调解的纠纷、保护的平民，都经她的手。

**剧情钩子**：
- 她私下注意到主角的"某些特质"（玩家行为留下的痕迹），可能是主角被议会"灰色观察"的起点
- 她手里握着一份"灰烬森林周边孤儿名单"，主角若救助其中孤儿，可触发议会正式委派
- 她与塞壬·渊语有过一次短暂会面——议会对深渊之子既警惕又好奇

## 能力与服务

| 类型 | 内容 | 费用 |
|------|------|------|
| 委托 | 议会公开任务（护送平民、清剿盗匪） | 按委托等级（5~100 金） |
| 调解 | 佣兵与平民、势力之间的纠纷 | 议会议费（按对象 10~50 金，或主角付出非金钱承诺） |
| 灰色委托 | 不便公开的调查、护送、解围 | 议会议员才可发布；须主角承诺不细问 |
| 情报 | 议会在各区域的动向与议程 | 议会成员免费；外部 20 金起 |

## 对主角态度

- 五档映射按「关系系统 §NPC 好感度五档」（挚友 DC10 / 友好 DC10 / 中立 DC15 / 冷淡 DC20 / 敌对 DC20+多数拒绝）
- 升降锚点（此 NPC 专属）：
  - 与深渊之子有牵连 → 冷淡
  - 完成灰色委托且不细问 → 友好以上

## 跑团接口

- 档位：从业者（按 NPC生成规则档次表；专业维度魅力，种族映射：人类=魅力）
- 关键装备：议会议员徽章（外族通行的"中立凭证"）；腰间短匕用于自卫
- 战斗值：按 NPC生成规则「从业者」档结算（HP 80、防御值 11）
- 委托样例：「护送一群孤儿到灰烬森林西边的废弃修道院」「为被欺压的村民调解纠纷」
- 升降锚点：保护平民 → 友好以上；与深渊之子往来 → 冷淡以下；完成灰色委托不细问 → 友好以上