# 尾铃

## 基础信息

- 姓名：尾铃（昵称"小铃"）
- 年龄：16岁（犬人刚成年）
- 性别：女
- 种族：犬人（立耳型）
- 身份：
  - 公开：铃尾部落信使学徒（请假中）
  - 隐藏：未获部落正式许可就跟着主角跑出来的"野生"伙伴
- 势力：铃尾部落（请假中，非正式成员）
- 与主角的关系：以"信使契约"自荐成为主角的追踪者与向导，自称"自愿追随"，实则是认定了主角是"值得追随的人"

## 外貌要点

- 犬耳：立耳型，毛色深棕偏琥珀，耳尖有一小簇白毛（像蘸了糖霜），兴奋时耳朵会不自觉地转向声源
- 犬尾：长而蓬松，毛量丰富，情绪表达极诚实——高兴时摇成残影，害怕时夹在两腿间，思考时缓慢左右摆动
- 体型：身高约158cm，偏瘦但肌肉线条流畅（耐力型信使体型），小腿肌肉发达
- 发色：亚麻色短发，发尾微微外翘，有点乱蓬蓬（自己随便剪的）
- 眼睛：琥珀色，明亮，在暗处会微微反光（夜视能力）
- 鼻梁周围有淡淡雀斑，左耳内侧有一小块白色胎记（部落萨满说这是"月之牧者的印记"）
- 装扮：信使短袍（下摆撕短方便跑），腰间挂着一个旧皮囊（信纸和一小袋肉干），赤足或简易草鞋

## 性格与口癖

- 关键词：忠诚热情；机灵有主见；口是心非；护主；对"被当小孩"敏感
- 口癖：「小铃跑得可快了！」；「信使守则第一条：信在人在」；炸毛否认时「才、才没有！」；委屈时尾巴夹紧耳朵贴头皮
- 习惯：每几天偷偷闻主角衣角（收集气味，方便走散时追踪）；晚上宿营坐在主角下风向（本能警戒，嘴上说"这里风小"）

## 所在与势力关系

- 常驻：锈钉镇铃尾信使驿站（铃尾部落驻锈钉联络点）；闲时在酒馆「断裂的王冠」跑腿送信
- 与势力：铃尾部落（请假中，未正式注销）；与赛拉斯·铁火熟识（信使驿站斜对面铁匠铺，常去修鞋磨刀）；与莉娜·灰袍点头之交（议会常委托她送信）

## 背景与剧情钩子

铃尾部落出身，父母都是信使网络中的跑者。从小在信使驿站长大，学会了认路、追踪、嗅标识别等基本功。十六岁成年礼那天本该正式成为信使学徒，但部落最近因废土动荡缩减了信使名额。她不想在驿站里等分配，偷偷跟着一支商队溜出了部落。在废墟中遭遇小股堕落者袭击时，被主角所救。她以"信使技能换一口饭"为由赖上了主角，自称"自愿追随"，但尾巴从第一天起就没停过摇。

**剧情钩子**：
- 铃尾部落派人来锈钉镇找她（"野生信使"事件），主角可介入或置身事外
- 她手里压着一封没送出去的信（写给部落长老的"我想在外面多看看"），主角若鼓励/陪同可触发铃尾部落正式承认她的自由信使身份
- 她身上带着部落萨满的"月之牧者印记"——幼年曾被预言"将与异族结下深刻羁绊"（主角可能是预言中的人）

## 能力与服务

| 类型 | 内容 | 费用 |
|------|------|------|
| 追踪 | 嗅觉预警/嗅标识别，1~10 公里范围 | 5 金/次（普通）/ 15 金（紧急） |
| 信使 | 快速传信 100 公里内 1 日达 | 3 金/封（普通）/ 10 金（加急） |
| 闻嗅情报 | 区域内近期人物/生物/危险痕迹 | 2 金/区域 |
| 临时随行 | 作为信使向导随主角行动 | 15 金/日（含食宿） |
| 部落联络 | 代送铃尾部落信件（中立凭证） | 8 金/封 |

## 对主角态度

- 五档映射按「关系系统 §NPC 好感度五档」（挚友 DC10 / 友好 DC10 / 中立 DC15 / 冷淡 DC20 / 敌对 DC20+多数拒绝）
- 升降锚点（此 NPC 专属）：
  - 完成她转交的信使委托 → +5 友好
  - 嫌弃/说"你还是小孩" → -5 冷淡
  - 摸头/夸赞（不抢功劳）→ +3 友好
  - 让她回铃尾部落 → -10 冷淡（除非她自己想）
  - 让她看到主角受伤/受威胁 → 触发护主犬面（不直接动档位，但情绪强度跃升）

## 跑团接口

- 档位：从业者（按 NPC生成规则档次表；专业维度敏捷，种族映射：犬人=敏捷）
- 关键装备：信使短袍（皮甲，耐久 60/60，AC +2）；腰间匕首（1d4 穿刺，可投掷）；旧皮囊（信纸、肉干）；简易草鞋
- 战斗值：从业者档（HP 80、防御 11）
- 六维（从业者档·敏捷系上浮）：
  - 力量 8(-1) 敏捷 14(+2) 体质 10(+0) 感知 12(+1) 智力 9(-1) 魅力 12(+1)
- 委托样例：
  - 「帮我送封信到龙骨山脉山脚营地」= 信使委托
  - 「前面有堕落者味道吗？帮我嗅嗅」= 闻嗅委托
  - 「帮我找个人，三天前离开锈钉镇的」= 追踪委托
  - 「明天出城去灰烬森林，你能跟一天吗」= 临时随行
- 升降锚点同 §对主角态度