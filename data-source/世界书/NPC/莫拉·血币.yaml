# 莫拉·血币

## 基础信息

- 姓名：莫拉·血币（"血币"为号，纪念其以血誓古仪铸造的特殊货币）
- 年龄：约 40 岁
- 性别：女
- 种族：人类
- 身份：黑市商人；**隐藏的漂泊者议会议员**（双重身份）
- 势力：漂泊者议会（隐藏）；表面无势力（独立黑市商人）

## 外貌要点

- 中等身材，常穿宽大的深棕色披风（遮住随身物品）；棕色短发梳得整齐
- 左耳戴一只小巧的金色铃铛（议会联络暗号）；右手指甲染成暗红色（黑市标识）
- 眼神温和但精明，嘴角常带一丝让人捉摸不透的笑

## 性格与口癖

- 关键词：精明；价格透明；不问来历；议会议员身份隐藏极深
- 口癖：「血币不认主，钱到手就算清」；私下对议会核心成员说"这只是生意"
- 习惯：每笔交易必签血誓契约（古仪保证双方守信）；左手无名指戴一只暗红色戒指（议会血誓古仪标识）

## 所在与势力关系

- 常驻：锈钉镇南区废墟的隐秘黑市据点；偶尔出现在佣兵公会二楼的阴影角落
- 与势力：表面是独立黑市商人，**实际是漂泊者议会的隐藏议员**——议会知道她的双重身份，但她从不在公开场合透露；与维克多·金牙有暗中往来（佣兵联盟会长是她的大客户）；与铁面贾维斯偶有合作；与赛拉斯·铁火"心照不宣"（两人都不说破）

## 背景与剧情钩子

灾厄纪年 286 年灾厄前遗迹中挖出一本关于"血誓古仪"的古籍，自学五年后创立了带血誓古仪的货币交易——双方签约后古仪自动保证交易履行，违约者将失去等同价值的"运气"。

这套血誓古仪让她在黑市建立了绝对信用——**没有人能在血誓契约上骗她**。但她也因此成为某些势力的眼中钉。

她加入议会不是为了"行善"——是因为议会能为她的生意提供情报与人脉保护。**议会议员身份是她的"隐藏身份"**——玩家深度结交后才能从某些细节嗅到端倪。

**剧情钩子**：
- 黑市稀有物资的唯一卖家——灾厄金属、禁忌药剂、稀有材料
- 与维克多·金牙的暗中往来——佣兵联盟黑市渠道的源头
- 议会议员身份——玩家深度结交后才知的"另一面"
- 与赛拉斯·铁火的"心照不宣"——两人都知道对方是什么角色，从不说破

## 能力与服务

| 类型 | 内容 | 费用 |
|------|------|------|
| 稀有物资 | 灾厄金属、禁忌药剂、稀有材料、定制装备 | 基准价 +50%~+200%（含血誓古仪保证金） |
| 黑市情报 | 各势力未公开的动向与人物关系 | 议价（要主角"出得起价"） |
| 血誓契约 | 古仪保证双方交易履行的契约服务 | 5~50 金/份（按契约金额） |
| 隐秘运输 | 把物品从 A 城运到 B 城不被盘查 | 议价（按距离与物品价值） |

## 对主角态度

- 五档映射按「关系系统 §NPC 好感度五档」（挚友 DC10 / 友好 DC10 / 中立 DC15 / 冷淡 DC20 / 敌对 DC20+多数拒绝）
- 升降锚点（此 NPC 专属）：
  - 完成交易且不细问 → 友好以上
  - 试图套她的客户信息 → 冷淡以下
  - 为议会暗线作出重大贡献 → 挚友

## 跑团接口

- 档位：行家（按 NPC生成规则档次表；专业维度魅力+智力，种族映射：人类=魅力）
- 关键装备：血誓戒指（议会血誓古仪标识）；暗红色铃铛（议会联络暗号）；黑市账本（从不离身）
- 战斗值：按 NPC生成规则「行家」档结算（HP 110、防御值 12）；不擅战斗，多由黑市护卫代劳
- 委托样例：「为主角采购一批稀有材料」「为主角运输一批不想被盘查的物品」「与某方签订一份血誓契约」
- 升降锚点：完成交易且不细问 → 友好以上；试图套她的客户信息 → 冷淡以下；为议会暗线作出重大贡献 → 挚友