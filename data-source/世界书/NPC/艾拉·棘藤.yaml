# 艾拉·棘藤

## 基础信息

- 姓名：艾拉·棘藤（"棘藤"为号，纪念她在棘藤林迷路三天三夜后悟出草药之道）
- 年龄：约 70 岁
- 性别：女
- 种族：羊人
- 身份：灰烬森林深处的隐士；草药师与古精灵语持有者
- 势力：无（独立隐士）

## 外貌要点

- 羊人特有的卷曲双角向内弯；羊耳贴头侧立，被灰白长发半掩；满头灰白长发常年披散，夹杂几片风干的草叶
- 皮肤被阳光与药剂熏得黝黑；双手指节粗大、指缝有常年研磨草药留下的绿渍
- 服饰：粗麻长袍外罩一件缀满小口袋的皮围裙；腰间挂竹筒与药臼；赤足

## 性格与口癖

- 关键词：禁欲；只认药草不认人；耐心；自言自语
- 口癖：「草木不语，比人诚实」；见外族来访者常说"留下住三天，我看看你是什么人"
- 习惯：日落时对着森林深处念一段古精灵语；研磨草药时轻轻哼歌；不主动问来者姓名

## 所在与势力关系

- 常驻：灰烬森林溪谷深处的小屋（外人难找，须穿过焦黑深林）
- 与势力：独立隐士，与任何势力不结盟；与莉娜·灰袍的议会有旧交（曾救过某位议员）；与圣火骑士团保持距离（不喜其教条）；与深渊之子完全不来往

## 背景与剧情钩子

年轻时是某个边境村落的草药师学徒，灾厄纪年 248 年村落被变异兽群毁坏后独自进入灰烬森林。五十年的隐居生活让她精通灰烬森林所有的药草与生态——也让她学会了"不主动说话"。

她会讲古精灵语——这是灾厄前穿越裂隙而来的精灵带来的语言之一。她从母亲那里学到，至今仍能与偶尔路过的精灵对答。

**剧情钩子**：
- 灰烬森林深处危险信息（焦黑深林、变异生物分布、可采集的稀有药草）
- 可揭示旧王国时代的真相碎片——她母亲是灾厄前的史官，留下了某些未公开的文献
- 与莉娜议会有旧交——这是议会"灰色任务"的一条暗线

## 能力与服务

| 类型 | 内容 | 费用 |
|------|------|------|
| 草药 | 灰烬森林特有的药草配方与采集 | 5~50 金/份（按稀有度） |
| 病伤诊治 | 中毒、感染、变异咬伤的传统疗法 | 议价（要主角"听她说完再走"） |
| 森林向导 | 灰烬森林深处安全路线 | 不收金币；要主角"留宿三天" |
| 古精灵语 | 解读灾厄前精灵遗留的符文与文献 | 议价（要主角"证明是值得的人"） |

## 对主角态度

- 五档映射按「关系系统 §NPC 好感度五档」（挚友 DC10 / 友好 DC10 / 中立 DC15 / 冷淡 DC20 / 敌对 DC20+多数拒绝）
- 升降锚点（此 NPC 专属）：
  - 尊重她"留三天"的规矩 → 友好以上
  - 破坏森林 → 冷淡以下
  - 为森林作出重大贡献 → 挚友

## 跑团接口

- 档位：顶尖（按 NPC生成规则档次表；专业维度智力+感知，种族映射：羊人=力量——但隐士按身份上浮至智力）
- 关键装备：药臼与竹筒（草药师核心工具）；粗麻长袍（隐士装束）；古精灵语典籍
- 战斗值：按 NPC生成规则「顶尖」档结算（HP 140、防御值 13）；不擅战斗，多靠森林地形与药草脱身
- 委托样例：「为某位患者采集灰烬森林深处的稀有药草」「为主角解读一件灾厄前的精灵符文物品」「带主角穿过焦黑深林到达某处遗迹」
- 升降锚点：尊重她"留三天"的规矩 → 友好以上；破坏森林 → 冷淡以下；为森林作出重大贡献 → 挚友