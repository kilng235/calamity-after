# 凯尔·拾灰者

## 基础信息

- 姓名：凯尔·拾灰者
- 年龄：约 45 岁
- 性别：男
- 种族：矮人
- 身份：旧日遗民遗民长；旧日遗民铁匠（矮人宗师，专精精工护甲）
- 势力：旧日遗民

## 外貌要点

- 中等身材的矮人，皮肤粗糙黝黑，长年野外作业留下的痕迹
- 棕色短发两鬓斑白，常戴破旧宽檐帽；右眼戴自制放大镜式单片眼镜，用于鉴定遗物
- 双手布满老茧和伤疤，指甲缝有洗不掉的灰；背着塞满工具与碎片的巨大皮包，走路叮当作响

## 性格与口癖

- 关键词：健谈；守护遗产；暴怒于破坏遗物；知识焦虑
- 口癖：「神明带走了一切，除了他们忘了烧掉的书」；遇莽夫常说「算了，说了你们也不懂」
- 习惯：见"旧东西"凑近鉴定；随身带破旧笔记本记录遗迹位置与状态；话匣子一打开就收不住

## 所在与势力关系

- 常驻：旧王城废墟边缘的「遗民小屋」（地下档案室藏黑暗时代以来全部研究）
- 与势力：旧日遗民遗民长（学术权威）；矮人宗师级铁匠（精工护甲与矿脉武器，见「锻造规则·铁匠代工」）；与杜兰·碎星是旧识反目（理念分：凯尔走实用、杜兰走禁术）；与漂泊者议会互尊重共享信息；与圣火骑士团互警惕（其发掘被视为潜在异端）

## 背景与剧情钩子

祖先是魔法学院学生，灾厄时仅 7 岁躲过灾厄七日；灾厄前的知识与记忆代代相传至凯尔，是**第十代传人**。三十年来走遍旧王城废墟收集文献与遗物，创立旧日遗民，将散乱的拾荒者组织成考古队伍。他坚信灾厄前的遗产是重建关键，专注重建实用技术，**不涉禁忌**——这条底线与杜兰·碎星彻底决裂。

**剧情钩子**：
- **老维特失踪案**：旧日遗民资深探险家老维特，三个月前失踪于旧王城深处——他掌握迷雾区数条安全路线，其失踪是悬案；赛拉斯持有他当年的失踪旧单、鸦知道他最后一次进裂隙前的行程、莉娜的议会在私下寻人——三条线汇于此
- 灾厄金属（黑曜铁/血晶石/星铁）加工授权的唯一矮人（另一人是杜兰·碎星，但杜兰已与他决裂）
- 护甲锻造宗师——精工护甲与矿脉武器品质冠绝废土（按「锻造规则·铁匠代工」擅长列）

## 能力与服务

| 类型 | 内容 | 费用 |
|------|------|------|
| 遗物鉴定 | 判断灾厄前物品的用途、年代、危险程度 | 5~30 金/件 |
| 灾厄金属加工授权 | 黑曜铁/血晶石/星铁的合法加工许可证 | 须旧日遗民成员身份 + 100 金手续费 |
| 精工护甲锻造 | 盔甲/盾牌的高品质锻造与工艺改装 | 基准价 +20~30%（铁匠代工表口径） |
| 废墟向导 | 旧王城废墟迷雾区以外的安全路线 | 50~200 金/次（按区域深度） |
| 知识委托 | 灾厄前历史、度量衡、编年史研究 | 议价（按议题 30~500 金） |

## 对主角态度

- 五档映射按「关系系统 §NPC 好感度五档」（挚友 DC10 / 友好 DC10 / 中立 DC15 / 冷淡 DC20 / 敌对 DC20+多数拒绝）
- 升降锚点（此 NPC 专属）：
  - 提交灾厄前遗物或文献抄本 → 友好以上
  - 盗卖未鉴定遗物 → 冷淡以下
  - 资助研究 → 友好以上
  - 告发其发掘 → 敌对

## 跑团接口

- 档位：行家（六维力量 14~18、智力 14~18；其余 10~14）
- 关键装备：放大镜式单片眼镜（遗物鉴定核心工具）；旧皮包内的鉴定工具与碎片样本；腰间铁锤（铁匠工具，铁匠检定获优势）
- 战斗值：按 NPC生成规则「行家」档结算（HP 110、防御值 12）；不擅战斗，遇敌多靠地形与机关脱身
- 委托样例：「把主角在废墟里捡到的某件金属器物送来鉴定」「带主角随队入旧王城测绘新区域」「为主角鉴定一块可疑的灾厄前金属」
- 升降锚点：提交灾厄前遗物或文献抄本 → 友好以上；盗卖未鉴定遗物 → 冷淡以下；资助研究 → 友好以上；告发其发掘 → 敌对