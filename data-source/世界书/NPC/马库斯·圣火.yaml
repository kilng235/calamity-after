# 马库斯·圣火

## 基础信息

- 姓名：马库斯·圣火（"圣火"为名号，本姓不详）
- 年龄：约 62 岁
- 性别：男
- 种族：人类
- 身份：圣火骑士团大团长
- 势力：圣火骑士团

## 外貌要点

- 高瘦清癯，年过花甲仍腰背挺直；满头银发束成低马尾，鬓边有早年战场留下的烧灼疤痕
- 右臂纹有圣火纹章（袖口常年半垂，露出纹章是他对来访者的尊重）
- 双手因年迈略颤，但握圣火权杖时绝不动摇；左眼因旧伤半盲，靠一只右眼扫视全场

## 性格与口癖

- 关键词：务实温和；私下宽容；公开守教条；忧心继承
- 口癖：「火不问出身，只照方向」；沉思时常说「老了……想得太远」
- 习惯：每日清晨在圣火坛前独自沉默一刻钟；与晚辈说话从不居高临下

## 所在与势力关系

- 常驻：边境要塞「黎明之门」圣火坛前的团长厅
- 与势力：圣火骑士团最高领袖，务实温和派代表；与索恩·灰烬拳的激进派长期政争但未公开破裂；与伊莎·圣焰的审判庭保持距离（信任其公正但警惕其冷酷）；与旧日遗民凯尔·拾灰者警惕但不敌对（视发掘为潜在异端但尊重学术）

## 背景与剧情钩子

三十年前是中阶骑士，在一次讨伐深渊之子边哨的任务中失去左眼。灾厄纪年 270 年接任大团长，推行"以圣火照亮而非焚毁"的温和路线——这与索恩为代表的激进派持续暗争至今。

他私下同情混血与外族，但**公开场合严格遵守教条**——这是他的政治生存之道，也是他最大的负担。

**剧情钩子**：
- 主角第一次"被骑士团注意"事件的当事人（圣火骑士团如何处置主角，很大程度取决于他在场时的态度）
- 他正在**安排继承**：索恩的激进让他不放心，伊莎的冷酷让他不安——这是他能向主角透露的最大秘密
- 与老维特失踪案有微妙联系：他曾亲自签发过老维特最后一次进入旧王城废墟的"圣火骑士团通行证"

## 能力与服务

| 类型 | 内容 | 费用 |
|------|------|------|
| 委托 | 圣火骑士团公开任务（清剿变异兽群、护送朝圣者） | 象征性报酬（5~30 金）+ 食宿 |
| 仲裁 | 涉及圣火骑士团利益的纷争 | 议会议费 50~200 金 |
| 通行授权 | 进入圣火骑士团管辖区域的许可 | 议价（关系声望档位决定难度） |
| 私下指引 | 灾厄前的某些史实（仅在信任建立后） | 不要金币，要"承诺" |

## 对主角态度

- 五档映射按「关系系统 §NPC 好感度五档」（挚友 DC10 / 友好 DC10 / 中立 DC15 / 冷淡 DC20 / 敌对 DC20+多数拒绝）
- 升降锚点（此 NPC 专属）：
  - 护送平民与朝圣者 → 友好以上
  - 与深渊之子往来 → 冷淡以下
  - 为骑士团建立大功 → 挚友

## 跑团接口

- 档位：行家（按 NPC生成规则档次表；专业维度魅力，种族映射：人类=魅力）
- 关键装备：圣火权杖（团长信物，仪式性大于实战）；右臂圣火纹章（信仰标识）
- 战斗值：按 NPC生成规则「行家」档结算（HP 110、防御值 12）；不擅战斗，多由骑士小队护卫
- 委托样例：「护送朝圣队伍抵达黎明之门」「清剿袭扰商路的变异兽群」「为骑士团传递某项重要文件」
- 升降锚点：护送平民与朝圣者 → 友好以上；与深渊之子往来 → 冷淡以下；为骑士团建立大功 → 挚友