# 鸦·灰渡者

## 基础信息

- 姓名：鸦·灰渡者（"灰渡"意为把人从裂隙这头带到那头；本名不详）
- 年龄：约 40 岁
- 性别：男
- 种族：半精灵（母为精灵、父为人类）
- 身份：深渊裂隙专业向导；深渊之子外围成员（与塞壬·渊语关系暧昧）
- 势力：深渊之子（外围）

## 外貌要点

- 瘦高、半精灵的尖耳藏在兜帽下；常年披一件灰羽披风
- 脸上戴一张乌鸦形铁面具，只露出下半张脸；面具下据说有一道被裂隙烧灼的旧伤
- 行走轻如羽毛，常带一根黑木手杖（手杖中空，内藏火折子与几枚神陨碎片）

## 性格与口癖

- 关键词：神秘；寡言；守信；价格透明
- 口癖：「路我开，命你带」；出发前必先检查一遍装备清单
- 习惯：从不摘面具；从不透露本名；以"鸦"自称

## 所在与势力关系

- 常驻：深渊裂隙入口附近的岩洞营地（裂隙边缘"灰渡客栈"）；偶尔出现在佣兵镇南区废墟区
- 与势力：深渊之子外围成员（不参与研究，只做向导）；与塞壬·渊语关系暧昧（有人说是她的"眼睛"，有人说是情人）；与旧日遗民凯尔·拾灰者互不来往

## 背景与剧情钩子

十五年前第一次跟人进入深渊裂隙，此后每年带团进出裂隙十几次，从未失手。**脸上那张乌鸦面具**是他二十年前在某次裂隙探险中拾得，戴上后再没摘下——有人说是被诅咒了，有人说他是裂隙本身的一部分。

他是塞壬·渊语能"看见"深渊裂隙的延伸——她听，他看。

**剧情钩子**：
- 主角第一次进深渊裂隙必须雇他当向导（裂隙地形会变，无向导必迷路）
- 他手里有一份"裂隙内部地图"草稿，每带一次团更新一次，是无价的情报资产
- 他知道老维特失踪案的另一面——老维特最后一次进裂隙前曾雇过他

## 能力与服务

| 类型 | 内容 | 费用 |
|------|------|------|
| 裂隙向导 | 进出深渊裂隙的全程向导 | 100~300 金/次（按深度） |
| 裂隙情报 | 裂隙内部地形、近期裂隙异动、神陨碎片产地 | 20~50 金/条 |
| 紧急救援 | 裂隙内被困者的搜救 | 500 金起，议价 |
| 装备代购 | 裂隙探险所需的特殊装备（火折子、净化苔藓、绳索） | 基准价 +30% |

## 对主角态度

- 五档映射按「关系系统 §NPC 好感度五档」（挚友 DC10 / 友好 DC10 / 中立 DC15 / 冷淡 DC20 / 敌对 DC20+多数拒绝）
- 升降锚点（此 NPC 专属）：
  - 按他要求准备装备 → 友好以上
  - 进裂隙前隐瞒关键信息 → 冷淡以下
  - 连续三次平安出入 → 挚友

## 跑团接口

- 档位：行家（按 NPC生成规则档次表；专业维度敏捷+感知，种族映射：半精灵）
- 关键装备：乌鸦铁面具（裂隙探险的核心护具，防护裂隙精神污染）；黑木手杖（藏火折子与神陨碎片）
- 战斗值：按 NPC生成规则「行家」档结算（HP 110、防御值 12）；裂隙内战斗非他所长，多靠地形熟悉度脱身
- 委托样例：「带主角进裂隙采集神陨碎片」「救援被困裂隙的某势力成员」「讲解裂隙内部某区域地形」
- 升降锚点：按他要求准备装备 → 友好以上；进裂隙前隐瞒关键信息 → 冷淡以下；连续三次平安出入 → 挚友