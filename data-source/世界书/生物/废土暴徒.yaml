# 废土暴徒

## 基础数值（跑团接口）

- 威胁等级：中高（HP36 ｜ 防御值14 ｜ 伤害 1d10，按「生物总纲」）
- 类型：人形（人类暴徒头目/佣兵败类） ｜ 区域：荒原废墟、旧王城废墟外围
- 特性：强力打击（重击时伤害骰额外 +1d10）

## 外观与习性

- 身高体壮的悍匪，废铁板拼成的简易护甲，惯用一根包铁巨棒
- 比普通掠夺者更有组织：会占据废墟要道设卡收税，豢养两三个废土掠夺者作小弟
- 记仇、贪财、欺软怕硬；对支付「保护费」的目标尚存信义（下次过路不再为难）

## 遭遇与战斗

- 强力打击：重击（天然 20）时伤害骰额外 +1d10——被它打出重击极其危险
- 惯用战法：让手下先上消耗，自己观察后补刀；情势不妙会抓人质要挟
- 弱点：自恃力大轻敌，对精准打击（目标其持械手臂等部位瞄准）缺乏防备

## 战利品与材料

- 包铁巨棒：约 20 金币，重武器，趁手的话可直接使用
- 厚皮护具：约 15 金币，可拆出皮甲补片
- 「保护费」积蓄：设卡以来搜刮的金币与物资（数额视其盘踞时长，剧情级）
