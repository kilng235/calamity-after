# 石蝠

## 基础数值（跑团接口）

- 威胁等级：低（单体 HP12 ｜ 防御值10 ｜ 伤害 1d6，按「生物总纲」群体规则）
- 类型：普通生物 ｜ 区域：沉没之城（穹顶与梁架）
- 特性：群体倒挂；受惊惊飞

## 外观与习性

- 翼展约三十厘米，灰褐色，成百倒挂在露出地面的教堂穹顶与塔尖梁架上
- 夜间外出觅食昆虫，粪便堆积处有刺鼻氨味（寻找栖息地的标志）
- 无攻击性，威胁来自受惊后的惊群冲撞

## 遭遇与战斗

- 惊群冲撞：受惊（强光/巨响/攀爬梁架）时成群起飞，在场者侦查与感知类检定承受劣势一轮（翅风扑面、方向大乱）
- 抓挠（1d6）：个别个体被逼入死角时才会抓挠自卫
- 惊飞会惊动沉没之城里的其他存在（叙事后果：暴露行踪）
- 对策：静步通过（潜行检定 DC10）、提前投石引飞

## 战利品与材料

- 蝙蝠粪：燃料与肥料，可收集贩卖
- 无其他有价值材料
