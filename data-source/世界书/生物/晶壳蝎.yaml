# 晶壳蝎

## 基础数值（跑团接口）

- 威胁等级：中（HP24 ｜ 防御值12 ｜ 伤害 1d8，按「生物总纲」）
- 类型：魔法生物 ｜ 区域：魔法荒原（结晶地/能量流边缘）
- 特性：甲壳附晶；尾刺电击

## 外观与习性

- 体长半米，甲壳上附生魔法结晶碎片，光下折射出细碎虹彩
- 栖息在结晶地边缘，以能量蠕虫与小型生物为食；结晶是其进食后的沉积
- 挖掘结晶的采集者最常惊扰它

## 遭遇与战斗

- 尾刺电击（1d8）：命中后目标陷入「麻痹」状态一回合（效果与解除按「状态列表」；持金属武器/穿金属甲者被命中时额外受 1d4 电伤传导）
- 双螯钳制：钳住目标武器或肢体（对抗力量挣脱）
- 甲壳反光：烈日直射下对其远程命中检定承受劣势（结晶反光干扰瞄准）
- 弱点：静默区内电击失效（尾刺仅剩 1d6 钝伤），引其入静默区是采集者常用手段

## 战利品与材料

- 晶壳蝎甲壳：镶嵌结晶的甲片（反伤护甲/饰品材料）
- 毒液（电击腺体）：麻痹药剂与魔法墨水原料，高价
- 体表结晶碎粒：天然魔法结晶小额来源
