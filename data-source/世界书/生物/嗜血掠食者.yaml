# 嗜血掠食者

## 基础数值（跑团接口）

- 威胁等级：中（HP24 ｜ 防御值12 ｜ 伤害 1d8，按「生物总纲」）
- 类型：变异生物 ｜ 区域：灰烬森林深处、荒原边缘
- 特性：狂暴突进（击杀目标后可立即扑向另一目标）；嗜血撕咬（自身 HP 低于半数时攻击获优势）

## 外观与习性

- 流线型躯体覆着暗红短毛，肌肉虬结，双颚外露的獠牙滴着涎液
- 终生处于亢奋的狩猎状态，闻到血腥味会从数百米外直线扑来
- 独行猎手，极少与其他同类分享领地；受伤后不退反狂

## 遭遇与战斗

- 嗜血撕咬：自身 HP 低于半数时进入狂暴，攻击检定获优势（负伤反凶是它的标志）
- 狂暴突进：若一击放倒目标，可立即对相邻的另一目标追击（无需再掷先攻）
- 应对建议：集火速杀优于消耗——把它拖进低血量阶段等于亲手打开狂暴开关

## 战利品与材料

- 掠食者毛皮：暗红厚实、纤维致密，约 18 金币，护具衬里的上等材料
- 尖牙：约 10 金币，饰品与匕首柄装饰
- 活体极难捕捉，完整尸身对驯兽者与炼金师均有额外价值（剧情级）
