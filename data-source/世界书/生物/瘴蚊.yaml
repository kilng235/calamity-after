# 瘴蚊

## 基础数值（跑团接口）

- 威胁等级：低（单体 HP12 ｜ 防御值10 ｜ 伤害 1d6，按「生物总纲」群体规则）
- 类型：普通生物 ｜ 区域：迷雾沼泽（瘴气区）
- 特性：瘴气繁殖；叮咬致疹

## 外观与习性

- 指节大小，翅翼带灰绿瘴色，成群在瘴气区低空盘旋
- 在瘴气积水中繁殖，雨后水位上涨时最活跃
- 群体随瘴气浓度移动，是瘴气区边界的活体指示

## 遭遇与战斗

- 群袭叮咬：每轮群袭掷 1d6 伤害（群体规则），黄昏与夜间活跃时伤害改掷两枚取高
- 叮咬致疹：同一场景内被叮咬多轮后陷入「中毒」状态的弱化版（低烧皮疹，叙事化：所有检定 −1 而非劣势，按「状态列表」中毒从宽裁定）
- 浸药面罩：免疫叮咬（进入建议按区域条目）
- 对策：烟熏驱散、解毒药草（区域产物）擦拭

## 战利品与材料

- 毒腺：弱毒提取原料（与灰烬蚊毒腺同途）
- 无其他价值
