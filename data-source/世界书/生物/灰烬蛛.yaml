# 灰烬蛛

## 基础数值（跑团接口）

- 威胁等级：中（HP24 ｜ 防御值12 ｜ 伤害 1d8，按「生物总纲」）
- 类型：变异生物（节肢） ｜ 区域：灰烬森林深处
- 特性：毒刺（命中后体质豁免 DC12，失败额外 1d6 毒伤）；结网（目标力量豁免 DC13 挣脱）

## 外观与习性

- 体长一米的大型蛛类，甲壳焦黑如炭、关节处泛暗红热光，八眼在灰雾中如磷火
- 在枯木之间结出灰白色巨网，网丝韧性极强，被烧毁后数日内会重结
- 独居性，产卵期（剧情可设定）攻击性倍增

## 遭遇与战斗

- 结网困缚：命中或目标经过蛛网时，力量豁免 DC13 失败即被黏缚（主行动挣脱）；缚缚状态下其攻击获优势
- 毒刺：命中后体质豁免 DC12，失败额外 1d6 毒伤（按「状态列表」中毒）
- 恶习：喜欢把猎物吊在网上风干，巢穴上方常挂着先前遇害者的遗骸与遗物（探索线索）

## 战利品与材料

- 蛛网丝：韧性极佳的天然纤维，约 12 金币，可制网具与缝线
- 毒腺：约 15 金币，炼金毒剂与解毒剂的对药原料
- 甲壳碎片：可打磨成护甲补片（装饰性材料）
