# 废土巨兽

## 基础数值（跑团接口）

- 威胁等级：高（HP48 ｜ 防御值16 ｜ 伤害 1d12，按「生物总纲」）
- 类型：变异巨兽 ｜ 区域：魔法荒原
- 特性：狂暴冲撞（冲锋命中后目标力量豁免 DC14，失败被击倒）；巨力震地（周围 5 英寸内目标敏捷豁免，失败倒地受伤）

## 外观与习性

- 肩高近三米的六足巨兽，背脊隆起的骨质装甲板嵌着发光的能量晶簇——魔法荒原辐射扭曲的产物
- 领地意识极强，把整片荒原视为自己的觅食场；非食性驱动，攻击多为驱逐与震慑
- 发怒前会先用前足刨地、低吼示警——给了观察者撤离的余地

## 遭遇与战斗

- 狂暴冲撞：直线冲锋，命中后目标力量豁免 DC14，失败被撞倒（倒地状态，起身耗半行动）
- 巨力震地：被近身围攻时震地，5 英尺内所有目标敏捷豁免，失败倒地并受 1d6 落石伤
- 皮糙肉厚：防具值 16 意味着低等级冒险者的普通攻击很难破防——策略与环境利用优于正面硬拼
- 弱点：转身迟缓，灵活的目标绕背攻击有优势；背脊晶簇是它唯一的软处（精准打击可击落）

## 战利品与材料

- 巨兽角：约 35 金币，锻造上等武器的骨干材料
- 厚皮：约 25 金币，重甲鞣制主材
- 背脊能量晶簇：完整击落的晶簇含魔法荒原的辐射能量，法术研究者出高价（剧情级）
