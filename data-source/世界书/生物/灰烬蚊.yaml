# 灰烬蚊

## 基础数值（跑团接口）

- 威胁等级：低（单体 HP12 ｜ 防御值10 ｜ 伤害 1d6，按「生物总纲」群体规则）
- 类型：普通生物 ｜ 区域：灰烬森林（溪谷/枯木林）
- 特性：群体吸血；低毒叮咬

## 外观与习性

- 指节大小的灰白色蚊虫，成群活动，灰烬层上空常起「蚊柱」
- 溪谷水边繁殖，黄昏最活跃；口器可刺穿普通衣物
- 烟熏可驱散

## 遭遇与战斗

- 蚊群缠身：每轮群袭掷 1d6 伤害（按生物总纲群体规则，单体低威胁以数量补足），并使被叮咬者的检定承受劣势（骚扰干扰，等同劣势来源）
- 低毒叮咬：同一轮被叮咬两次以上，陷入「中毒」状态（效果与解除按「状态列表」）
- 对策：烟熏火把（蚊群三轮内散去）、面罩遮挡（免疫叮咬）、药草驱蚊剂

## 战利品与材料

- 毒腺：低毒性毒素提取原料（淬毒刃用，效果按「状态列表」中毒）
- 蚊群翅翼无价值，不值得专门狩猎
