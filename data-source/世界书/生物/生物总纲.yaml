# 生物总纲

## 危险等级表（敌人面板数值的唯一权威源）

| 威胁等级 | 防御值 | HP | 伤害 | 击败经验 |
|----------|--------|-----|------|----------|
| 低 | 10 | 12 | 1d6 | 5~10 |
| 中 | 12 | 24 | 1d8 | 15~25 |
| 中高 | 14 | 36 | 1d10 | 25~40 |
| 高 | 16 | 48 | 1d12 | 40~50 |
| 极高 | 18 | 72 | 1d12+4 | 50+（首脑/领主级，视剧情上调） |

- 基准为参照值，可按体型与习性上下微调 ±2；伤害从骰子池对应骰型依次取用
- 群体生物（蚊群/鼠群/蝙蝠群）单体取「低」档，以数量补足威胁
- 战斗开始时按「战斗规则」生成敌人面板，数值以本表与各生物条目为准

## 四类生物

- 普通生物：未受灾厄影响，行为与灾厄前相似，多避人
- 变异生物：被灾厄能量侵蚀，形态或习性改变，攻击性强
- 魔法生物：受魔法能量影响或诞生于魔法异常区域，具特殊能力
- 异常生物：空间扭曲或深渊能量催生的特殊存在，难以常理度测

