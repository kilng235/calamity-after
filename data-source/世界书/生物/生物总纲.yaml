## 战利品结算

- 战利品判定（投骰/稀有度/品相/势力收购/容器搜刮/任务凭证/拾取）见「战利品系统」条目（世界书/系统/战利品系统.yaml），不重复定义
- 击败生物后战利品记入背包，经验按「生物总纲」危险等级表发放；各生物掉落材料以对应条目「战利品与材料」为准
- 材料价格以「世界观-经济」为权威源，本总纲不报价
