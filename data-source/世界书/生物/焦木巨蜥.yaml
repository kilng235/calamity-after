# 焦木巨蜥

## 基础数值（跑团接口）

- 威胁等级：中高（HP36 ｜ 防御值14 ｜ 伤害 1d10，按「生物总纲」）
- 类型：变异生物 ｜ 区域：灰烬森林（焦黑深林/溪谷沿岸）
- 特性：灰烬潜伏伪装；跃出突袭

## 外观与习性

- 体长约两米，鳞片焦黑带炭化纹路，伏在灰烬中与焦木难以区分
- 恒温性差，清晨趴在灰烬层下吸热；领域性强，袭击进入领地的活物
- 蜕下的鳞甲常被拾荒者捡走换钱

## 遭遇与战斗

- 潜伏突袭：初次攻击前，目标需以感知检定（DC15）察觉，失败则巨蜥首击获优势
- 撕咬与尾扫：主行动咬（1d10），若两个以上敌人近身改用尾扫（1d8，可同时命中相邻目标）
- 弱点腹鳞：将其掀翻（对抗力量成功）后，对其攻击获优势
- 畏惧强光：照明弹或烈焰可迫其后退

## 战利品与材料

- 巨蜥鳞片：制甲材料（鳞甲/护甲基底）
- 巨蜥皮：皮革替代品，耐磨
- 毒腺：无（此蜥无毒，勿与沼泽巨蜥混淆）
