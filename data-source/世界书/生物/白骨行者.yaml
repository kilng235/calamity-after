# 白骨行者

## 基础数值（跑团接口）

- 威胁等级：低（HP12 ｜ 防御值10 ｜ 伤害 1d6，按「生物总纲」）
- 类型：不死者（骸骨） ｜ 区域：旧王城废墟
- 特性：远程射击（可持弓箭远距离袭扰）

## 外观与习性

- 灾厄中死去的城卫与平民，骸骨被残留的执念驱动，拖着锈蚀的装备游荡
- 动作僵硬迟缓，但不会疲倦、不会恐惧，除非被击散
- 对生者的体温与声响有反应，成群徘徊在废墟街巷的阴影处

## 遭遇与战斗

- 远程袭扰：部分个体持有残破猎弓，先在射程外放箭，逼目标进入街巷伏击圈
- 骨散难缠：单体脆弱，但常三两成群；钝击对骸骨效果更佳（叙事层呈现）
- 无痛觉：不受恐吓与要挟类社交影响；被「击倒」后若未彻底散架仍会爬起一轮

## 战利品与材料

- 古老骨骸：灾厄前的骨料，约 8 金币，炼金与饰品材料
- 破损武器：锈蚀的制式短刃或猎弓，约 5 金币，可修复
- 偶尔带着死者遗物（一枚戒指、半张全家福画像），可作剧情线索
