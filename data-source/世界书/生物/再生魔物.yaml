# 再生魔物

## 基础数值（跑团接口）

- 威胁等级：高（HP48 ｜ 防御值16 ｜ 伤害 1d12，按「生物总纲」）
- 类型：异常生物（深渊造物） ｜ 区域：深渊裂隙
- 特性：快速再生（每回合开始恢复 5 HP）；多重攻击（每回合可攻击两次）

## 外观与习性

- 躯体由不协调的肌肉块拼接而成，伤口以肉眼可见的速度蠕动愈合，行走时关节反折发出湿响
- 深渊裂隙能量泄漏区孕育的造物，杀不死的特质使它盘踞一地、目空一切
- 无痛觉、无恐惧、无进食规律——唯一的目标是把靠近的活物撕碎

## 遭遇与战斗

- 快速再生：每回合开始恢复 5 HP——火力不足的队伍会被活活耗死；火/酸/冷冻类伤害可压制再生（叙事层裁定）
- 多重攻击：每回合两次攻击，可分别指定不同目标——队伍站位不可大意
- 应对核心：这不是拼输出的敌人，是拼「找到压制再生的手段」的谜题型敌人（深渊之子应该有相关研究）

## 战利品与材料

- 再生组织：约 40 金币，炼金再生药剂的核心材料（黑市稀有品）
- 魔物血液：约 30 金币，深渊之子与研究者收购
- 完整的心核（若一刀切下，剧情级）：能量密度极高，来历成谜
