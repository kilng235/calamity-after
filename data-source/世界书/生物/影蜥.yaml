# 影蜥

## 基础数值（跑团接口）

- 威胁等级：中高（HP36 ｜ 防御值14 ｜ 伤害 1d10，按「生物总纲」）
- 类型：魔法生物 ｜ 区域：深渊裂隙（空间裂隙区）
- 特性：近乎隐形；突袭捕食

## 外观与习性

- 体长约一米半的蜥蜴，体表半透明，光线折射下只剩一道扭曲的轮廓
- 独居，伏在碎石与裂缝间等猎物经过；耐心极佳，可数日不动
- 泼溅液体或扬起粉尘会令其显形

## 遭遇与战斗

- 隐形潜袭：未显形时对其命中检定承受劣势；它的首次突袭获优势（察觉需感知检定 DC15）
- 破隐：泼水、撒粉尘、烟熏可令其显形一轮（显形期间对其攻击获优势）
- 撕咬（1d10）后立即退入裂缝，隔轮再袭；不与多人缠斗，遭围攻即逃

## 战利品与材料

- 影蜥皮：半透明皮革（潜行装备衬里，潜行相关检定获优势），高价值
- 影蜥眼珠：炼金材料（隐形药水研究用），深渊之子高价收购
