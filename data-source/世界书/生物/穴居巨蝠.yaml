# 穴居巨蝠

## 基础数值（跑团接口）

- 威胁等级：中（HP24 ｜ 防御值12 ｜ 伤害 1d8，按「生物总纲」）
- 类型：魔法生物 ｜ 区域：地下裂谷（中层洞厅穹顶）
- 特性：群体倒挂；俯冲撕咬

## 外观与习性

- 翼展两米，膜翼灰黑，倒挂在中层洞厅穹顶成片栖息
- 群居，以洞穴鱼类与昆虫为食，夜间沿地下河觅食
- 受惊时整群起飞，翅风与尖叫令人失去方向

## 遭遇与战斗

- 俯冲撕咬：从穹顶俯冲攻击（1d8）后拉升，轮换袭扰；对其远程命中检定承受劣势（高速机动）
- 惊群：群体受袭后进入狂乱，在场者侦查与聆听类检定承受劣势两轮
- 弱点畏光：强光（火把直射/照明弹）可将其驱回穹顶，受照射时其命中检定承受劣势
- 声波干扰：投掷石块制造回声可引开蝠群

## 战利品与材料

- 巨蝠翼膜：隔音披风与滑翔制品材料
- 蝙蝠粪（中层堆积）：燃料，铁匠铺收购
