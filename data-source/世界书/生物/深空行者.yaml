# 深空行者

## 基础数值（跑团接口）

- 威胁等级：极高（HP72 ｜ 防御值18 ｜ 伤害 1d12+4，按「生物总纲」，视剧情可再上调）
- 类型：异常生物 ｜ 区域：深渊裂隙（核心祭坛，传说）
- 特性：非实体；能量形态

## 外观与习性

- 无人见过全貌：目击者只记得「一段被拉长的夜空」与不属于任何语言的声音
- 据推测非实体存在，以能量形态活动，出没于核心祭坛四周的能量风暴中
- 三百年来进入核心区者无一生还，一切认知来自只言片语的传闻

## 遭遇与战斗

- 非实体：物理（武器）伤害减半；魔法伤害正常
- 领域失序：以其为中心十步内，所有检定承受劣势（空间扭曲干扰）
- 官方定位：剧情级存在，遭遇即安排撤离叙事，正面战斗等同于绝境（天然掷出20 也只换来逃跑机会）
- 深渊之子对其讳莫如深；引路人鸦·灰渡者拒绝谈论核心区

## 战利品与材料

- 理论掉落：「深空残片」（纯传闻，据说是研究位面融合的关键材料）
- 无实据的猎获记录，任何声称持有者都会引来深渊之子与各方势力追问
