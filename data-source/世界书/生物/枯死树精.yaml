# 枯死树精

## 基础数值（跑团接口）

- 威胁等级：中（HP24 ｜ 防御值12 ｜ 伤害 1d8，按「生物总纲」；躯体庞大可微调 HP+12）
- 类型：魔法生物 ｜ 区域：灰烬森林（焦黑深林，极少数）
- 特性：根须缠绕；行动迟缓；畏火

## 外观与习性

- 灾厄后残存获灵智的焦木，枝干扭曲成人形轮廓，眼窝处两点暗绿微光
- 终年不动，仅在领地被侵入时拔根而行；移动缓慢，步声沉闷
- 不主动追击，目标退出领地即止

## 遭遇与战斗

- 根须缠绕：命中后目标陷入「束缚」状态（效果与解除按「状态列表」，割断根须或对抗力量可脱）
- 枝干横扫：近身范围挥击（1d8）
- 行动迟缓：先手检定承受劣势；每两轮仅能行动一次（另一轮扎根蓄力）
- 畏火：受到的火焰伤害×2；被点燃后陷入「燃烧」状态且不再缠绕，专注扑火

## 战利品与材料

- 树精核心：腐朽树心处一枚暗绿晶核，魔法材料（法杖杖芯/魔法媒介），价值不菲
- 精魂木：树精残躯的木料，结构坚韧（法杖/工艺品材料）
