# 废土掠夺者

## 基础数值（跑团接口）

- 威胁等级：低（HP12 ｜ 防御值10 ｜ 伤害 1d6，按「生物总纲」）
- 类型：人形（人类匪徒） ｜ 区域：荒原废墟（旧王城废墟外围、魔法荒原边缘）
- 特性：群体战术（同伴近身时攻击获优势）；懦夫（HP 低于半数即寻机逃跑）

## 外观与习性

- 三五成群的荒原匪徒，破布裹身、废铁拼凑的武器，眼神警惕而贪婪
- 蛰伏在废墟断墙后盯梢过路商旅，专挑落单与看似软弱的目标下手
- 无组织无信仰，今日的同伙明日可能为半袋干粮火并

## 遭遇与战斗

- 群体战术：同伙近身缠斗时，其攻击检定获优势；击溃一两个同伙即动摇全队
- 懦夫本性：HP 过半后掷 d20 ≤12 即弃战逃跑，逃跑前可能丢下杂物作阻碍
- 偶尔虚张声势勒索「过路费」，胆小的目标交钱即可脱身；遇到硬茬立刻变脸求饶

## 战利品与材料

- 废铁武器：常见，铁匠铺收购价约 5 金币
- 破布与杂物：不值钱，可作引火或修补材料
- 偶尔搜出被害人遗留的零钱与小物件（剧情道具，视遭遇场景而定）
