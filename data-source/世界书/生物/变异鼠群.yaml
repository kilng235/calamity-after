# 变异鼠群

## 基础数值（跑团接口）

- 威胁等级：低（单体 HP12 ｜ 防御值10 ｜ 伤害 1d6，按「生物总纲」群体规则）
- 类型：变异生物 ｜ 区域：旧王城废墟（下水道系统/废墟底层）
- 特性：群体行动；啃噬装备

## 外观与习性

- 拳头大小，皮毛斑秃带灰白癣斑，眼泛红光
- 数十至上百只集群，在下水道与废墟底层筑巢；能啃穿皮革与薄木板
- 领地内尸骨无存，饥饿时连同类也啃

## 遭遇与战斗

- 鼠潮啃咬：每轮群袭掷 1d6 伤害；同时随机一件随身皮革/木质装备耐久 −5（啃噬）
- 装备卫护：把装备举过头顶或藏进铁箱（力量检定 DC10）可免除啃噬
- 火线驱离：火焰瓶或火把扫出一道线，鼠群三轮内不越线
- 巢穴宝藏：鼠巢深处常混有它们拖回的金属小件（小额战利品来源）

## 战利品与材料

- 鼠皮：低价值皮革（量大可凑数卖）
- 鼠巢捡拾：硬币、金属扣、钥匙等杂项（按经济条目杂项收购）
