# 石缝蛇

## 基础数值（跑团接口）

- 威胁等级：低（HP12 ｜ 防御值10 ｜ 伤害 1d6，按「生物总纲」）
- 类型：普通生物 ｜ 区域：旧王城废墟（石墙裂缝）
- 特性：弱毒咬伤；易致感染

## 外观与习性

- 体长半米到一米，土灰色带碎斑，盘在石墙裂缝中只露头
- 受热吸引，常聚在白天晒热的石面；踩中或伸手入缝时咬人
- 无攻击性，一切咬伤源于被踩或被摸

## 遭遇与战斗

- 突咬（1d6）：仅在被踩踏或翻动石块时反击一轮，随后钻缝逃走
- 弱毒：命中后目标陷入「中毒」状态（效果按「状态列表」，从宽裁定，解毒药草即可解除）
- 伤口易感染：若未及时处理（智力检定 DC10 包扎），次日伤势恶化（叙事化：额外一天乏力，检定 −1）
- 预防：探路棍先探石缝，穿铁靴可免疫咬伤

## 战利品与材料

- 蛇皮：低价值皮革
- 蛇胆：解毒药剂辅药（民间偏方）
