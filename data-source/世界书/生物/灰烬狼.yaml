# 灰烬狼

## 基础数值（跑团接口）

- 威胁等级：中（HP24 ｜ 防御值12 ｜ 伤害 1d8，按「生物总纲」）
- 类型：变异生物 ｜ 区域：灰烬森林
- 特性：群体狩猎（头狼指挥包抄）；畏惧火光

## 外观与习性

- 皮毛灰白，与灰烬环境融为一体，静止时难辨形迹
- 五至八头一群，由头狼指挥包抄猎物；昼伏夜出，巢穴多在枯木林深处
- 食物匮乏的冬季会尾随落单旅人

## 遭遇与战斗

- 狼群包抄：头狼存活期间，狼群命中检定获优势；击杀或惊走头狼后此优势消失
- 咬住不放：命中后下一轮可续咬（伤害掷 1d6，无需再检定命中），目标可用主行动挣脱（对抗力量）
- 弱点畏惧火光：持火把者对其威吓检定获优势；狼群受火焰伤害后可能溃散（掷 d20 ≤10 即逃）

## 战利品与材料

- 灰烬狼皮：保暖耐磨，冬季抢手（可制成保暖衣物）
- 灰烬狼牙：护符与饰品材料
- 头狼毛皮成色更佳，收购价上浮
