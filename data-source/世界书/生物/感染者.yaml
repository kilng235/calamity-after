# 感染者

## 基础数值（跑团接口）

- 威胁等级：中（HP24 ｜ 防御值12 ｜ 伤害 1d8，按「生物总纲」）
- 类型：感染者（生前为人） ｜ 区域：旧王城废墟、灰烬森林边缘
- 特性：不死韧性（首次 HP 归零时五成概率苟留一口气）；感染撕咬（命中后体质豁免 DC12，失败中毒）

## 外观与习性

- 皮肉灰败溃烂，脉络状黑纹从咬伤处蔓延周身，双眼浑浊只剩捕食本能
- 昼伏夜出，被声响吸引；生前可能是任何人的邻里与亲人
- 伤口若不处理，被咬者有转化之危（剧情级后果，非立即数）

## 遭遇与战斗

- 感染撕咬：命中后目标需体质豁免（DC12），失败中毒（按「状态列表」，需解毒药剂或医师处置）
- 不死韧性：首次 HP 归零时掷 d20 ≤10，苟留 1 HP 继续行动一次；再度归零才真正倒下
- 成群出没于废墟窄巷，靠数量与毒性耗死目标；火攻有效但会烧毁战利品

## 战利品与材料

- 灾厄结晶：体内凝出的黑紫色结晶，约 20 金币，深渊之子收购研究
- 破损装备：生前遗物，约 8 金币，可修复
- 新鲜感染组织：医师与炼金师的危险研究材料（谨慎保存）
