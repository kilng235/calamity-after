# 裂隙犬

## 基础数值（跑团接口）

- 威胁等级：中（HP24 ｜ 防御值12 ｜ 伤害 1d8，按「生物总纲」）
- 类型：魔法生物 ｜ 区域：深渊裂隙（外围荒原）
- 特性：预感能量风暴；对空间异常敏感

## 外观与习性

- 外形近野犬，皮毛灰白无光泽，眼瞳在暗处泛淡蓝
- 独行或成对游荡于外围荒原，从不出物理规则正常区之外一步
- 能提前半日感知能量风暴，届时成群向远离裂隙方向迁徙

## 遭遇与战斗

- 奔袭撕咬：直线冲刺后跃起咬喉（1d8），冲刺首击获优势
- 感知灵敏：潜行绕过它需对抗检定，其感知取行家档（+3，按「NPC生成规则」）
- 战斗中会避开金属武器挥舞范围，绕后攻击；受重创后果断脱离，不恋战
- 跟随裂隙犬迁徙方向可避开能量风暴（探索者的活路标）

## 战利品与材料

- 裂隙犬皮毛：灰白无光，据说能减弱空间异常的眩晕感（护符衬里材料）
- 犬牙与爪：普通饰品材料
