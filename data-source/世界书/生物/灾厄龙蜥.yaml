# 灾厄龙蜥

## 基础数值（跑团接口）

- 威胁等级：极高（HP72 ｜ 防御值18 ｜ 伤害 1d12+4，按「生物总纲」首脑/领主级）
- 类型：异常生物（龙裔领主级） ｜ 区域：深渊裂隙（灾厄核心）
- 特性：灾厄吐息（锥形范围，敏捷豁免 DC15，失败 3d8 伤害）；厚鳞护甲（非魔法武器伤害 -2）；恐惧光环（首次遭遇意志豁免 DC13，失败恐惧）
- 弱点：腹部鳞甲薄弱，命中腹部时伤害 +4

## 外观与习性

- 体长五米的龙形巨蜥，鳞片漆黑泛紫光，双眼如燃烧的火焰，行经之处草木枯萎
- 灾厄中诞生的最强生物之一，占据深渊裂隙核心，视一切闯入者为挑战者
- 智慧高于寻常野兽：会记住冒犯者的气味与面貌，战术性利用地形与吐息

## 遭遇与战斗

- 灾厄吐息：锥形范围喷吐，敏捷豁免 DC15，失败受 3d8 灾厄伤害（骰池取骰）；喷吐后有喘息间隙（下一轮无法再吐）
- 恐惧光环：首次遭遇需意志豁免 DC13，失败陷入恐惧（按「状态列表」）；意志坚定者不会再次受影响
- 厚鳞护甲：非魔法武器伤害 -2——魔法武器、精准打击（腹部 +4）或environment利用是破防关键
- 头脑级战斗：建议满级队伍、携带解毒/医疗准备、制定腹部打击战术后再挑战；贸然闯入核心区等同自寻死路

## 战利品与材料

- 龙蜥鳞片：必掉。黑紫鳞甲，锻造高阶护甲的传说材料，约 100 金币
- 龙心结晶：八成概率。灾厄能量凝晶，约 150 金币，施法者与深渊之子觊觎的至宝
- 龙骨：六成概率。约 120 金币，骨白岩般的锻造与饰品材料
