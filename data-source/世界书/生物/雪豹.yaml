# 雪豹

## 基础数值（跑团接口）

- 威胁等级：中（HP24 ｜ 防御值12 ｜ 伤害 1d8，按「生物总纲」）
- 类型：普通生物 ｜ 区域：龙骨山脉（龙骨峰一带，雪线附近）
- 特性：潜伏扑杀；独行猎手

## 外观与习性

- 皮毛灰白带黑斑，与雪岩融为一体，尾长而蓬松
- 以岩羊为主食，极少主动接近人类；被逼入绝境或极度饥饿时才袭人
- 领地范围极大，一山常只有一只

## 遭遇与战斗

- 潜伏扑杀：自高处或岩后扑出，首次攻击获优势；察觉需感知检定（DC15）
- 锁喉撕咬（1d8）：命中后紧咬不放，目标每轮持续受 1d4 伤害直至挣脱（对抗力量）
- 猎手本能：不恋战，HP 低于一半即拖猎物或空手撤离；追逐战中它的移动检定获优势（雪地健足）
- 对策：多人同行、携带铃铛（它厌恶声响）、不背对岩壁行走

## 战利品与材料

- 雪豹皮：灰白带黑斑，高档保暖皮料，收购价高
- 雪豹牙/爪：饰品与护符材料
