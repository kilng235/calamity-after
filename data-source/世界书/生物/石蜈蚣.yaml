# 石蜈蚣

## 基础数值（跑团接口）

- 威胁等级：中（HP24 ｜ 防御值12 ｜ 伤害 1d8，按「生物总纲」）
- 类型：变异生物 ｜ 区域：地下裂谷（岩壁裂缝/上层通道）
- 特性：多足攀壁；麻痹毒液

## 外观与习性

- 体长一至两米，节肢灰褐与岩色一致，受惊时节肢摩擦出细碎石响
- 藏身岩壁裂缝，以蝙蝠幼崽与鱼类为食；对光源敏感，趋暗避明
- 蜕壳期攻击性最强

## 遭遇与战斗

- 攀壁游走：可在岩壁与洞顶自由移动，常从头顶方向来袭（首次袭击目标察觉检定 DC15）
- 毒颚咬（1d8）：命中后目标陷入「麻痹」状态（效果与解除按「状态列表」，时限从宽约一回合）
- 多足缠身：贴身缠咬时，目标行动检定承受劣势，翻滚脱离（对抗力量）可解
- 弱点：火焰与浓烟可逼其退回裂缝；斩断半数节肢即丧失攀爬逃走能力

## 战利品与材料

- 毒腺：麻痹药剂核心原料（对接经济条目药剂类），高价
- 蜈蚣甲节：轻甲缀片与箭簇材料
