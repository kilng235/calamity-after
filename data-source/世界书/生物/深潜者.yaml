# 深潜者

## 基础数值（跑团接口）

- 威胁等级：高（HP48 ｜ 防御值16 ｜ 伤害 1d12，按「生物总纲」）
- 类型：异常生物 ｜ 区域：地下裂谷（下层裂谷）
- 特性：岩壁攀爬；避光群居

## 外观与习性

- 体型近人形，皮肤灰黑无毛，四肢细长，指端成钩状嵌进岩缝
- 可在岩壁间垂直攀爬，移动速度超过常人奔跑；避开一切光源
- 群居，领地意识强；在下层裂谷以围猎方式驱逐入侵者

## 遭遇与战斗

- 岩壁突袭：从黑暗中贴壁疾行接近，首击获优势；遇袭后立即散入岩缝，下一轮再合围
- 钩爪撕裂（1d12）：命中护甲时同时扣除该护甲耐久 −5（钩爪勾挂撕扯）
- 畏强光：被强光持续照射时，其命中检定承受劣势且不会主动逼近；火把阵型可守住阵地
- 群体围猎：三至五只协同，优先拖走队尾落单者

## 战利品与材料

- 深潜者蜕皮：稀罕皮料（轻甲衬层，潜行相关检定获优势）
- 深潜者骨骼：深渊之子高价收购（研究用）
