# 灾厄幽灵

## 基础数值（跑团接口）

- 威胁等级：高（HP48 ｜ 防御值16 ｜ 伤害 1d12，按「生物总纲」）
- 类型：幽灵（灾厄亡念） ｜ 区域：旧王城废墟、沉没之城
- 特性：虚体（物理伤害减半）；生命汲取（造成伤害的一半转化为自身 HP）；黑暗缠绕（目标视野受限，攻击检定劣势）

## 外观与习性

- 人形虚影，轮廓如烟如絮，面孔随观看角度扭曲成不同的生前表情
- 由灾厄之日死去者的执念凝成，重复着生前最后一刻的行为——也可能是清醒的、记着死因的
- 无声移动，出现处温度骤降、烛火转蓝

## 遭遇与战斗

- 虚体：普通武器对其伤害减半——银器、附魔武器或特定手段（按剧情）才造成全额伤害
- 生命汲取：接触攻击造成伤害的一半转化为自身 HP，被汲取者感到记忆被抽走（叙事层）
- 黑暗缠绕：周身黑雾扩散，范围内目标攻击检定承受劣势
- 非战斗解法：多数幽灵困于未竟之事——查明执念（找到遗物/传递遗言/真相大白）可使其安息，无需战斗。这是设计与叙事的暗门

## 战利品与材料

- 灵魂碎片：约 50 金币，施法者与深渊之子的稀有研究材料
- 灾厄精华：约 60 金币，幽灵消散处凝结
- 生前遗物：执念所系之物（剧情级，往往指向一段废土往事）
