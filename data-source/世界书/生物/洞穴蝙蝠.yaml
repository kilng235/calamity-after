# 洞穴蝙蝠

## 基础数值（跑团接口）

- 威胁等级：低（单体 HP12 ｜ 防御值10 ｜ 伤害 1d6，按「生物总纲」群体规则）
- 类型：普通生物 ｜ 区域：龙骨山脉（矿洞群）
- 特性：群体栖息；受惊成群飞出

## 外观与习性

- 翼展二十至二十五厘米，通体深灰，矿洞顶成片倒挂
- 以昆虫为食，黄昏出洞掠飞；矿洞深处偶有个体体型偏大（变异迹象，按「中」档临时生成）
- 群体密度是矿洞废弃程度的直观标志

## 遭遇与战斗

- 惊群蔽日：受惊时成群飞出洞口，在场者侦查与远程命中检定承受劣势一轮
- 抓挠叮咬（1d6）：仅在被直接骚扰（触摸/挥网捕捉）时自卫
- 骚扰源：矿洞深处居民（变异蝙蝠/穴居爬行动物）会被惊群引至现场（叙事后果）
- 对策：入洞前投石驱飞、火把开路

## 战利品与材料

- 蝙蝠粪：燃料（铁匠铺收购）
- 个体本身无捕获价值
