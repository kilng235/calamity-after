# 能量蠕虫

## 基础数值（跑团接口）

- 威胁等级：中（HP24 ｜ 防御值12 ｜ 伤害 1d8，按「生物总纲」）
- 类型：魔法生物 ｜ 区域：魔法荒原（能量流）
- 特性：能量为食；触碰反伤

## 外观与习性

- 体长一米余，体表半透明发微光，内脏如流动的光带
- 生活在能量流中，以魔法能量为食，沿能量流缓慢游动
- 离开能量流百步即枯萎；死前会释放储存的能量

## 遭遇与战斗

- 触碰反伤：以近战武器命中它的人同时受 1d6 能量伤害（体表能量放电）
- 能量冲击（1d8）：受威胁时向能量流方向拍出一道冲击（远程攻击，金属甲不减免）
- 引流避险：攻击能量流上游可短暂改道（智力检定 DC15），使其离流追击两轮后陷入乏力（命中检定承受劣势）
- 静默区克星：被逼入静默区一轮后失去行动能力（能量供应断绝）

## 战利品与材料

- 蠕虫内核：凝聚的能量结晶胚（炼金/施法媒介），风暴眼外最容易获得的能量材料
- 半透明体膜：魔法物品包裹材料（延缓能量逸散）
