# 折射蝶

## 基础数值（跑团接口）

- 威胁等级：低（单体 HP12 ｜ 防御值10 ｜ 伤害 1d4，按「生物总纲」群体规则）
- 类型：变异生物 ｜ 区域：深渊裂隙（空间裂隙区边缘）
- 特性：翅翼折射光线；群体干扰

## 外观与习性

- 掌心大小的蝶群，翅翼如磨砂棱镜，飞过处光线扭曲成虹彩斑纹
- 群居，围绕空间裂隙边缘起落，数量数十至数百
- 无攻击性器官，威胁来自对视线与法术的干扰

## 遭遇与战斗

- 虹光乱目：处于蝶群中，远程命中与侦查检定承受劣势（光线折射干扰瞄准）
- 施法干扰：蝶群中施放法术需智力检定（DC15），失败则法术效果偏差（叙事化处理）
- 对其攻击：命中检定承受劣势（飞行轨迹飘忽）；范围攻击（挥扫/火焰）一轮驱散
- 不主动伤人，缓慢绕行即可避免冲突

## 战利品与材料

- 折射翅翼：棱镜粉末原料（光学迷彩涂料/幻术法术媒介），深渊之子收购
- 蝶群核心的「棱晶尘」少量即可售出好价
