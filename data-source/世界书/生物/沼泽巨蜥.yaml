# 沼泽巨蜥

## 基础数值（跑团接口）

- 威胁等级：中（HP24 ｜ 防御值12 ｜ 伤害 1d8，按「生物总纲」；水下伏击场景先手优势）
- 类型：变异生物 ｜ 区域：迷雾沼泽（水网迷宫浅滩）
- 特性：水下潜伏；麻痹毒液

## 外观与习性

- 体长约两米，灰绿皮肤常覆一层泥浆，浮出水面时像一截烂木
- 潜伏在水网迷宫浅滩水下，只露鼻孔，猎物饮水或涉水时突袭
- 冷血畏寒，清晨与雨后趴在枯木上晒泥，那时最易发现

## 遭遇与战斗

- 水下突袭：自水下咬击，首击获优势；察觉需感知检定（DC15，水面涟漪与气泡）
- 毒牙咬（1d8）：命中后目标陷入「麻痹」状态（效果与解除按「状态列表」，时限从宽约一回合）
- 拖拽入水：咬住后向深水拖拽（对抗力量，失败则被拖入水中，水中其攻击获优势）
- 弱点：离水后行动迟缓，命中检定承受劣势；引其上岸再战是标准打法

## 战利品与材料

- 巨蜥皮：护甲基底与防水皮革
- 毒腺：麻痹药剂原料（对接经济条目药剂类）
