# 灰蛞蝓

## 基础数值（跑团接口）

- 威胁等级：低（HP12 ｜ 防御值10 ｜ 伤害 1d6，按「生物总纲」；爬行迟缓可先手）
- 类型：变异生物 ｜ 区域：旧王城废墟（潮湿巷道/下水道）
- 特性：腐蚀黏液；夜行

## 外观与习性

- 体长半米，灰白半透明软体，爬行过处留一道泛泡的腐蚀黏痕
- 夜间活动，白天缩在阴湿墙角硬壳内；趋潮湿，雨后大量出现
- 不追击活物，但会缓慢爬向睡熟的人

## 遭遇与战斗

- 黏液腐蚀：接触（被爬过/踩过黏痕）的皮革与金属装备耐久 −10，皮肤接触受 1d4 伤害（化学灼伤）
- 舐咬（1d6）：仅对倒地或熟睡目标主动攻击
- 迟缓目标：先手检定对其获优势；一轮爬行不超过数步，远离即安全
- 对策：撒盐（急缩成球失能一轮）、火烤、绕开黏痕行走（侦查检定 DC10 识别新旧黏痕）

## 战利品与材料

- 黏液腺：腐蚀药剂原料（开锁/蚀甲用途，炼金术士收购）
- 蛞蝓壳：研磨后作止血药粉辅料
