# 石甲虫

## 基础数值（跑团接口）

- 威胁等级：低（HP12 ｜ 防御值10，卷缩时+2 ｜ 伤害 1d6，按「生物总纲」）
- 类型：普通生物 ｜ 区域：龙骨山脉（矿洞与岩坡）
- 特性：甲壳坚硬；受惊卷缩

## 外观与习性

- 体长半米，背甲灰褐带矿物光泽，与碎石难以区分
- 以矿物碎屑为食，啃食过的岩面留细密齿痕（矿脉指示标志，矿工视其为吉物）
- 不主动攻击，受惊时卷缩成球装死

## 遭遇与战斗

- 卷缩防御：受击后立即卷缩，防御值+2 且不再移动，直至威胁离开（对卷缩个体攻击自动命中但伤害减半，甲壳吸收）
- 钳咬（1d6）：仅被直接翻动或捡起时反击
- 捕捉：无需战斗，双手翻捡即可（力量检定 DC10，失败被钳）
- 高价值活体：矮人工匠收购（矿脉探矿用）

## 战利品与材料

- 甲壳：盾牌与轻甲缀片材料（成品轻且硬）
- 活体：铁匠铺/矮人工匠收购价更高
