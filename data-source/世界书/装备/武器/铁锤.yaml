# 铁锤

## 基础数值（跑团接口）

- 伤害骰：1d8（钝击）
- 攻速：中
- 槽位：主手（可副手持盾）
- 特性：击晕叙事；单手
- 耐久上限：80
- 基准价格：18 金

## 外观与美学

- 方头铁锤（锤头10~15cm），木质或铁柄（70cm）
- 常见材质：铁/精铁锤头；焦木柄
- 废土变体：矿工锤改锤头带矿石刮痕，柄缠皮绳


## 材料加成公式（按材料档位）

| 材料档 | 公式 | 范围 |
|--------|------|------|
| 一阶（铁/焦木/黑曜石等）| 1d8 | 见上 |
| 二阶（精铁/银/骨白岩等）| 1d8+1 | min + 1 |
| 三阶（秘银/龙骨化石/宝石等）| 1d10+1 | 二阶 + 升档 |
| 灾厄（黑曜铁/血晶石/星铁）| 1d10+2 | 三阶 + 1 |

> 公式随材料自动生效（铁→精铁→秘银→灾厄），AI 掷骰时直接套用。与词缀状态伤害独立计算。
## 跑团接口

- 伤害掷取：从骰子池 d8 依次取用；力量调整值可用
- 击晕叙事：命中头部/弱点时使目标陷入「震慑」状态（效果与解除按「状态列表」）
- 单手：可副手持盾

- 耐久：每次命中 −1；大失败额外 −5
## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
