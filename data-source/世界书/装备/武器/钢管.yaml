# 钢管

## 基础数值（跑团接口）

- 伤害骰：1d4（钝击）
- 攻速：快
- 槽位：主手（可副手持盾或双持）
- 特性：无短板钝击武器，废墟中随处可得的原始武器
- 耐久上限：80
- 基准价格：2 金

## 外观与美学

- 长约一米的实心钢管，一端焊着废铁块增加重量
- 常见材质：铁/精铁；缠布握把或裸杆
- 废土变体：杆身锈迹斑斑，配重块歪斜但结实

## 材料加成公式（按材料档位）

| 材料档 | 公式 | 范围 |
|--------|------|------|
| 一阶（铁/焦木/黑曜石等）| 1d4 | 见上 |
| 二阶（精铁/银/骨白岩等）| 1d4+1 | min + 1 |
| 三阶（秘银/龙骨化石/宝石等）| 1d6+1 | 二阶 + 升档 |
| 灾厄（黑曜铁/血晶石/星铁）| 1d6+2 | 三阶 + 1 |

> 公式随材料自动生效（铁→精铁→秘银→灾厄），AI 掷骰时直接套用。与词缀状态伤害独立计算。

## 跑团接口

- 伤害掷取：从骰子池 d4 依次取用；力量调整值可用
- 平衡特性：无特殊劣势，任何近战情境通用
- 耐久：每次命中 −1；大失败额外 −5

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
