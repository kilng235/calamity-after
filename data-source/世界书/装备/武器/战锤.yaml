# 战锤

## 基础数值（跑团接口）

- 伤害骰：1d10（钝击）
- 攻速：很慢
- 槽位：主手（双手持用，占主手槽）
- 特性：重型击晕叙事，破盾；双手
- 耐久上限：60
- 基准价格：60 金

## 外观与美学

- 大锤（锤头20~30cm），长柄（130~160cm），配重尾钉
- 常见材质：精铁/黑曜铁锤头；龙骨化石柄芯
- 废土变体：锤头带变异生物残留，柄缠厚皮绳


## 材料加成公式（按材料档位）

| 材料档 | 公式 | 范围 |
|--------|------|------|
| 一阶（铁/焦木/黑曜石等）| 1d10 | 见上 |
| 二阶（精铁/银/骨白岩等）| 1d10+1 | min + 1 |
| 三阶（秘银/龙骨化石/宝石等）| 1d12+1 | 二阶 + 升档 |
| 灾厄（黑曜铁/血晶石/星铁）| 2d6+2 | 三阶 + 1 |

> 公式随材料自动生效（铁→精铁→秘银→灾厄），AI 掷骰时直接套用。与词缀状态伤害独立计算。
## 跑团接口

- 伤害掷取：从骰子池 d10 依次取用；力量调整值可用
- 破盾：命中持盾敌人叙事破盾（盾牌 AC 无效化叙事）
- 重型击晕：命中头部使目标陷入「震慑」状态（效果与解除按「状态列表」）
- 双手：攻速很慢，一回合一次主攻击

- 耐久：每次命中 −1；大失败额外 −5
## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
