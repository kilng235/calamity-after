# 双手剑

## 基础数值（跑团接口）

- 伤害骰：1d10（劈砍）
- 攻速：慢
- 槽位：主手（双手持用，占主手槽）
- 特性：重型，破甲叙事；双手持用
- 耐久上限：70
- 基准价格：30 金

## 外观与美学

- 长刃（120~150cm），双手握柄（20~25cm），配重球尾
- 常见材质：精铁/秘银（轻量重击）；龙骨化石柄芯（轻量坚韧）
- 废土变体：刃身带锈蚀修补痕，护手为变异生物骨雕


## 材料加成公式（按材料档位）

| 材料档 | 公式 | 范围 |
|--------|------|------|
| 一阶（铁/焦木/黑曜石等）| 1d10 | 见上 |
| 二阶（精铁/银/骨白岩等）| 1d10+1 | min + 1 |
| 三阶（秘银/龙骨化石/宝石等）| 1d12+1 | 二阶 + 升档 |
| 灾厄（黑曜铁/血晶石/星铁）| 2d6+2 | 三阶 + 1 |

> 公式随材料自动生效（铁→精铁→秘银→灾厄），AI 掷骰时直接套用。与词缀状态伤害独立计算。
## 跑团接口

- 伤害掷取：从骰子池 d10 依次取用；力量调整值可用
- 重型：对穿甲目标（锁甲/板甲敌人）命中后伤害叙事破甲（非数值）
- 双手：不可同时持盾或双持；攻速慢（一回合一次主攻击）

- 耐久：每次命中 −1；大失败额外 −5
## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
