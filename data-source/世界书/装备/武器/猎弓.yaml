# 猎弓

## 基础数值（跑团接口）

- 伤害骰：1d6（穿刺）
- 攻速：快
- 槽位：主手（远程武器）
- 特性：远程，射程50m；可移动射击
- 耐久上限：60
- 基准价格：25 金

## 外观与美学

- 短弓（80~120cm），弓身木或焦木，弓弦为兽筋
- 常见材质：焦木（灰烬森林特产，烟熏纹路）；变异生物筋弦
- 废土变体：弓身缠绕皮革补强，箭袋为变异生物皮


## 材料加成公式（按材料档位）

| 材料档 | 公式 | 范围 |
|--------|------|------|
| 一阶（铁/焦木/黑曜石等）| 1d6 | 见上 |
| 二阶（精铁/银/骨白岩等）| 1d6+1 | min + 1 |
| 三阶（秘银/龙骨化石/宝石等）| 1d8+1 | 二阶 + 升档 |
| 灾厄（黑曜铁/血晶石/星铁）| 1d8+2 | 三阶 + 1 |

> 公式随材料自动生效（铁→精铁→秘银→灾厄），AI 掷骰时直接套用。与词缀状态伤害独立计算。
## 跑团接口

- 伤害掷取：从骰子池 d6 依次取用（远程不加属性调整值）
- 可移动射击：战斗中可边移动边射（叙事优势）
- 弹药：消耗箭矢（20支/份，1金），每次射击扣 1 耐久

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
