# 匕首

## 基础数值（跑团接口）

- 伤害骰：1d4（穿刺）
- 攻速：快
- 槽位：主手（或副手双持）
- 特性：可投掷（10m，1d4）；敏捷调整值可用；背刺叙事优势
- 耐久上限：60
- 基准价格：3 金

## 外观与美学

- 短刃（15~25cm），单刃或双刃，皮绳缠柄
- 常见材质：铁/黑曜石（磨刃）/银（不死特攻叙事）；废土变体用焦木柄+变异生物牙打磨
- 鞘多为硬皮或兽骨，斜挎或别于腰后


## 材料加成公式（按材料档位）

| 材料档 | 公式 | 范围 |
|--------|------|------|
| 一阶（铁/焦木/黑曜石等）| 1d4 | 见上 |
| 二阶（精铁/银/骨白岩等）| 1d4+1 | min + 1 |
| 三阶（秘银/龙骨化石/宝石等）| 1d6+1 | 二阶 + 升档 |
| 灾厄（黑曜铁/血晶石/星铁）| 1d6+2 | 三阶 + 1 |

> 公式随材料自动生效（铁→精铁→秘银→灾厄），AI 掷骰时直接套用。与词缀状态伤害独立计算。
## 跑团接口

- 伤害掷取：从骰子池 d4 依次取用；投掷时掷 1d4（远程不加属性调整值）
- 背刺：潜行至目标背后突袭时，命中检定获优势（按通用检定 §3·特质优势）
- 耐久：每次命中 −1；大失败额外 −5

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
