# 战斧

## 基础数值（跑团接口）

- 伤害骰：1d10（劈砍）
- 攻速：慢
- 槽位：主手（双手持用，占主手槽）
- 特性：重型破甲叙事，可破盾；双手
- 耐久上限：60
- 基准价格：50 金

## 外观与美学

- 大刃战斧（刃宽25~30cm），长柄（120~150cm），配重尾钉
- 常见材质：精铁/黑曜铁（灾厄金属）；龙骨化石柄芯
- 废土变体：刃口带变异生物残留血渍，柄缠皮革绳


## 材料加成公式（按材料档位）

| 材料档 | 公式 | 范围 |
|--------|------|------|
| 一阶（铁/焦木/黑曜石等）| 1d10 | 见上 |
| 二阶（精铁/银/骨白岩等）| 1d10+1 | min + 1 |
| 三阶（秘银/龙骨化石/宝石等）| 1d12+1 | 二阶 + 升档 |
| 灾厄（黑曜铁/血晶石/星铁）| 2d6+2 | 三阶 + 1 |

> 公式随材料自动生效（铁→精铁→秘银→灾厄），AI 掷骰时直接套用。与词缀状态伤害独立计算。
## 跑团接口

- 伤害掷取：从骰子池 d10 依次取用；力量调整值可用
- 破盾：命中持盾敌人时叙事破盾（盾牌 AC 无效化叙事，非数值）
- 双手：不可同时持盾；攻速慢

- 耐久：每次命中 −1；大失败额外 −5
## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
