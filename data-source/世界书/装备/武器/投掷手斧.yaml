# 投掷手斧

## 基础数值（跑团接口）

- 伤害骰：1d6（劈砍）
- 攻速：快
- 槽位：主手（可投掷：10m 内掷 1d6，远程不加属性调整值）
- 特性：投掷/近战两用，斧柄经平衡处理；佣兵喜爱的多用途武器
- 耐久上限：65
- 基准价格：8 金

## 外观与美学

- 单手轻斧，斧头与木柄以皮绳绑扎固定
- 常见材质：铁斧刃/焦木柄；斧柄末端系皮环便于回旋发力
- 废土变体：斧刃带缺口与打磨痕，柄身缠防滑布条

## 材料加成公式（按材料档位）

| 材料档 | 公式 | 范围 |
|--------|------|------|
| 一阶（铁/焦木/黑曜石等）| 1d6 | 见上 |
| 二阶（精铁/银/骨白岩等）| 1d6+1 | min + 1 |
| 三阶（秘银/龙骨化石/宝石等）| 1d8+1 | 二阶 + 升档 |
| 灾厄（黑曜铁/血晶石/星铁）| 1d8+2 | 三阶 + 1 |

> 公式随材料自动生效（铁→精铁→秘银→灾厄），AI 掷骰时直接套用。与词缀状态伤害独立计算。

## 跑团接口

- 伤害掷取：从骰子池 d6 依次取用；近战力量调整值可用
- 投掷：10m 内掷 1d6（从骰子池取用，远程不加属性调整值）
- 耐久：每次命中 −1；大失败额外 −5

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
