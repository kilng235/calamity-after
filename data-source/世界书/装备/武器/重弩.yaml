# 重弩

## 基础数值（跑团接口）

- 伤害骰：1d12（穿刺）
- 攻速：很慢
- 槽位：主手（远程武器，双手持用）
- 特性：远程，射程120m；需装填1回合
- 耐久上限：40
- 基准价格：80 金

## 外观与美学

- 重型弩（120~150cm），铁弩臂（精铁/黑曜铁），木托
- 常见材质：精铁弩机/黑曜铁弩臂；焦木或硬木托
- 废土变体：弩机为灵耳族精密件，带机关齿轮外露


## 材料加成公式（按材料档位）

| 材料档 | 公式 | 范围 |
|--------|------|------|
| 一阶（铁/焦木/黑曜石等）| 1d12 | 见上 |
| 二阶（精铁/银/骨白岩等）| 1d12+1 | min + 1 |
| 三阶（秘银/龙骨化石/宝石等）| 2d6+1 | 二阶 + 升档 |
| 灾厄（黑曜铁/血晶石/星铁）| 2d6+2 | 三阶 + 1 |

> 公式随材料自动生效（铁→精铁→秘银→灾厄），AI 掷骰时直接套用。与词缀状态伤害独立计算。
## 跑团接口

- 伤害掷取：从骰子池 d12 依次取用（远程不加属性调整值）
- 装填：射击后需装填一回合（行动受限叙事）
- 弹药：消耗弩矢（20支/份，1.5金），每次射击扣 1 耐久

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
