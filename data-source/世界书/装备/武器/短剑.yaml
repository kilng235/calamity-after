# 短剑

## 基础数值（跑团接口）

- 伤害骰：1d6（穿刺）
- 攻速：快
- 槽位：主手（或副手双持）
- 特性：平衡；力量调整值可用，灵巧武器可用敏捷调整值替代
- 耐久上限：70
- 基准价格：8 金

## 外观与美学

- 短刃（40~60cm），单刃或双刃，轻巧
- 常见材质：铁/精铁；废土变体用焦木柄
- 比匕首长、比铁剑轻，适合近身缠斗与狭窄空间


## 材料加成公式（按材料档位）

| 材料档 | 公式 | 范围 |
|--------|------|------|
| 一阶（铁/焦木/黑曜石等）| 1d6 | 见上 |
| 二阶（精铁/银/骨白岩等）| 1d6+1 | min + 1 |
| 三阶（秘银/龙骨化石/宝石等）| 1d8+1 | 二阶 + 升档 |
| 灾厄（黑曜铁/血晶石/星铁）| 1d8+2 | 三阶 + 1 |

> 公式随材料自动生效（铁→精铁→秘银→灾厄），AI 掷骰时直接套用。与词缀状态伤害独立计算。
## 跑团接口

- 伤害掷取：从骰子池 d6 依次取用；力量调整值可用（灵巧武器可敏捷替代）
- 平衡：无特殊劣势，室内/巷战/舟上等狭窄环境无额外惩罚（叙事）
- 耐久：每次命中 −1；大失败额外 −5

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
