# 法杖

## 基础数值（跑团接口）

- 伤害骰：1d4（物理钝击）
- 攻速：中
- 槽位：主手
- 特性：施法媒介（推荐持杖）；物理击打；可镶符文装饰
- 耐久上限：60
- 基准价格：20 金

## 外观与美学

- 长杖（120~150cm），木质/骨质，顶端可镶符文装饰
- 常见材质：精铁/银杖身；骨白岩；宝石（镶嵌）
- 废土变体：杖身刻有旧王国符文，顶端挂药囊/符牌

## 施法媒介（按「法术总纲」）

- **持杖施法**：标准流程，无修正
- **不持杖施法**：法术检定承受劣势（掷两次取低）；叙事「徒手施法勉强维持，效力大打折扣」
- 法术大失败（d20=1）：法杖耐久额外 −5


## 材料加成公式（按材料档位）

| 材料档 | 公式 | 范围 |
|--------|------|------|
| 一阶（铁/焦木/黑曜石等）| 1d4 | 见上 |
| 二阶（精铁/银/骨白岩等）| 1d4+1 | min + 1 |
| 三阶（秘银/龙骨化石/宝石等）| 1d6+1 | 二阶 + 升档 |
| 灾厄（黑曜铁/血晶石/星铁）| 1d6+2 | 三阶 + 1 |

> 公式随材料自动生效（铁→精铁→秘银→灾厄），AI 掷骰时直接套用。与词缀状态伤害独立计算。
## 跑团接口

- 伤害掷取：物理 1d4（钝击）
- 耐久：每次命中 −1；大失败（d20=1）额外 −5

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
