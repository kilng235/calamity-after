# 长弓

## 基础数值（跑团接口）

- 伤害骰：1d8（穿刺）
- 攻速：慢
- 槽位：主手（远程武器，双手持用）
- 特性：远程，射程100~150m；命中叙事+15%
- 耐久上限：50
- 基准价格：45 金

## 外观与美学

- 长弓（150~180cm），弓身直木或焦木（优质焦木），兽筋弦
- 常见材质：优质焦木/龙骨化石弓身（轻量坚韧）
- 废土变体：弓身带古战痕，弓弦为变异生物筋


## 材料加成公式（按材料档位）

| 材料档 | 公式 | 范围 |
|--------|------|------|
| 一阶（铁/焦木/黑曜石等）| 1d8 | 见上 |
| 二阶（精铁/银/骨白岩等）| 1d8+1 | min + 1 |
| 三阶（秘银/龙骨化石/宝石等）| 1d10+1 | 二阶 + 升档 |
| 灾厄（黑曜铁/血晶石/星铁）| 1d10+2 | 三阶 + 1 |

> 公式随材料自动生效（铁→精铁→秘银→灾厄），AI 掷骰时直接套用。与词缀状态伤害独立计算。
## 跑团接口

- 伤害掷取：从骰子池 d8 依次取用（远程不加属性调整值）
- 长射程：100~150m 有效命中（叙事，远程优势）
- 命中叙事+15%：远程命中检定获优势（符合种族特质/背景特质时叠加）
- 弹药：消耗箭矢（20支/份，1金），每次射击扣 1 耐久

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
