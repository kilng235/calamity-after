# 轻弩

## 基础数值（跑团接口）

- 伤害骰：1d8（穿刺）
- 攻速：慢
- 槽位：主手（远程武器）
- 特性：远程，射程80m；无需弓术训练
- 耐久上限：50
- 基准价格：30 金

## 外观与美学

- 轻型弩（80~100cm），木托+铁弩臂，兽筋弦
- 常见材质：铁弩臂/精铁弩机；焦木托
- 废土变体：弩托带皮绳补强，弩机为灵耳族精密件


## 材料加成公式（按材料档位）

| 材料档 | 公式 | 范围 |
|--------|------|------|
| 一阶（铁/焦木/黑曜石等）| 1d8 | 见上 |
| 二阶（精铁/银/骨白岩等）| 1d8+1 | min + 1 |
| 三阶（秘银/龙骨化石/宝石等）| 1d10+1 | 二阶 + 升档 |
| 灾厄（黑曜铁/血晶石/星铁）| 1d10+2 | 三阶 + 1 |

> 公式随材料自动生效（铁→精铁→秘银→灾厄），AI 掷骰时直接套用。与词缀状态伤害独立计算。
## 跑团接口

- 伤害掷取：从骰子池 d8 依次取用（远程不加属性调整值）
- 无需弓术训练：未受训者亦可使用（无弓术特质劣势）
- 弹药：消耗弩矢（20支/份，1.5金），每次射击扣 1 耐久

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
