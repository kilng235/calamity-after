# 短矛

## 基础数值（跑团接口）

- 伤害骰：1d6（穿刺）
- 攻速：中
- 槽位：主手（或投掷）
- 特性：触及+1m；可投掷（10m，1d6）
- 耐久上限：70
- 基准价格：12 金

## 外观与美学

- 短矛（120~150cm），铁质矛头（20~25cm），木质或铁柄
- 常见材质：铁/精铁矛头；焦木或直木柄
- 废土变体：矛头带变异生物牙磨制，柄缠皮绳


## 材料加成公式（按材料档位）

| 材料档 | 公式 | 范围 |
|--------|------|------|
| 一阶（铁/焦木/黑曜石等）| 1d6 | 见上 |
| 二阶（精铁/银/骨白岩等）| 1d6+1 | min + 1 |
| 三阶（秘银/龙骨化石/宝石等）| 1d8+1 | 二阶 + 升档 |
| 灾厄（黑曜铁/血晶石/星铁）| 1d8+2 | 三阶 + 1 |

> 公式随材料自动生效（铁→精铁→秘银→灾厄），AI 掷骰时直接套用。与词缀状态伤害独立计算。
## 跑团接口

- 伤害掷取：从骰子池 d6 依次取用；力量调整值可用；投掷时掷 1d6
- 触及+1m：可与敌人保持距离攻击（叙事优势）
- 投掷：掷出后收回需行动（一回合收回）

- 耐久：每次命中 −1；大失败额外 −5
## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
