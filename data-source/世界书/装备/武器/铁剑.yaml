# 铁剑

## 基础数值（跑团接口）

- 伤害骰：1d8（劈砍/穿刺）
- 攻速：中
- 槽位：主手（可副手持盾或双持）
- 特性：平衡，无短板；力量调整值可用
- 耐久上限：80
- 基准价格：15 金

## 外观与美学

- 直刃（80~100cm），单手握柄，十字或斜十字护手
- 常见材质：铁/精铁/精铁+骨白岩；废土变体用焦木剑柄+变异生物皮缠手
- 鞘为硬木包皮或铁壳，斜佩于腰侧；锈钉镇佣兵标准配剑


## 材料加成公式（按材料档位）

| 材料档 | 公式 | 范围 |
|--------|------|------|
| 一阶（铁/焦木/黑曜石等）| 1d8 | 见上 |
| 二阶（精铁/银/骨白岩等）| 1d8+1 | min + 1 |
| 三阶（秘银/龙骨化石/宝石等）| 1d10+1 | 二阶 + 升档 |
| 灾厄（黑曜铁/血晶石/星铁）| 1d10+2 | 三阶 + 1 |

> 公式随材料自动生效（铁→精铁→秘银→灾厄），AI 掷骰时直接套用。与词缀状态伤害独立计算。
## 跑团接口

- 伤害掷取：从骰子池 d8 依次取用；力量调整值可用
- 平衡特性：无特殊劣势，任何近战情境通用
- 耐久：每次命中 −1；大失败额外 −5

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
