# 炼金配方表（6 类谱系，成品基准价权威源）

> 本条目为配方权威源。炼金判定/成败/强度/品级见「炼金规则」；配方 DC 三档（一阶10/二阶15/三阶20）与既往法力药水口径一致；**基准价以「世界观-经济」零售价为本**，自炼成本 = 基准价 ÷2。

## 配方字段说明

`配方名 | 类别 | 所需原料 | 制作 DC | 基线药效（标准强度档）| 基准价（零售）| 强度骰影响/备注`

- 原料来源：采集（「地理」「生物」条目）/ 购买（「经济」零售价）/ 战利品（「战利品系统」）；原料本身不单列额外成本（已含在 ÷2 的成本口径内）

