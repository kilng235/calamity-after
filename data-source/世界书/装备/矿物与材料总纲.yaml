> 价格纪律：所有价格按「世界观-经济」币制（1 金 = 10 银）；偏远聚落上浮 20~50%（经济条目第 9 行）；公会/商人收购按零售价 × 50%（经济条目第 89 行）。

> 单位换算：1 块原矿 ≈ 拳头大小（5~10 公斤）；1 筐燃料 ≈ 10 公斤；1 颗宝石 ≈ 拇指指甲大小。

---

## 三、纪律与接口

- **材料分类与视觉特征** → 本节「价格表·作用」列 + 区域条目材料节
- **产地与伴生关系** → 「地理」三区域条目的材料节
- **材料 → 主题倾向（词条池来源）** → 「词缀表」第 1 段
- **锻造 DC 分级与材料成本口径** → 「锻造规则」第 20–28 行
- **收购价（公会/商人）** → 「世界观-经济」第 89–91 行
- **法力恢复消耗品配方与价格** → 「炼金配方表·法力类」（权威源，含 4 档法力药水原料/DC/价格；法术总纲仅保留恢复路径）

- **禁用约束**：灾厄金属/灾厄结晶（黑曜铁/血晶石/星铁）默认禁用于普通玩家锻造，需经势力授权或特定 NPC（如凯尔·拾灰者、杜兰·碎星）才可加工。

