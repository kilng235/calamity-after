# 矿物与材料总纲（DND 资源层·价格与作用）

描述: 补齐材料价格的缺失维度，并建立「材料 → 装备/魔法介质」的明确映射。
本条目**不重复**其他条目的产地/词缀/分类信息，仅作为价格与作用的权威源。

---

## 一、价格基准（21 种矿物/燃料/木材/宝石 + 介质）

### 价格档位锚定（与「世界观-经济」币制一致）

- 一阶（常见金属/燃料/废土材料）：1~5 金/单位
- 二阶（精炼金属/骨系/中等灾厄/中等宝石）：10~30 金/单位
- 三阶（稀有金属/灾厄金属/灾厄结晶/极稀有宝石）：50~200 金/单位
- 完美钻石/远古符文/能量晶簇/星辉宝石：200+ 金/单位（按「世界观-经济」第 91 行遗物口径）

