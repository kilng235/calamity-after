# 全罩盔

## 基础数值（跑团接口）

- AC 加成：+3
- 重量：中
- 槽位：头部
- 特殊限制：视野−5m（笨重）；需力量≥15
- 耐久上限：60
- 基准价格：40 金

## 外观与美学

- 全罩式铁盔（覆盖整个头部，面罩开缝），内衬皮垫
- 常见材质：精铁/黑曜铁盔壳；内衬焦木纤维
- 废土变体：面罩缝带磨损痕，盔顶带圣火纹章（骑士团制式）


## 材料加成公式（按材料档位）

| 材料档 | AC 加成 | 重甲敏捷惩罚 |
|--------|---------|-------------|
| 一阶（铁/兽皮）| +3 | 不获敏捷调整值 |
| 二阶（精铁/钢）| +4 | 不获敏捷调整值 |
| 三阶（秘银/骨白岩/宝石）| +4 | 不获敏捷调整值 |
| 灾厄（黑曜铁/血晶石/星铁）| +5 | 不获敏捷调整值 |

| 档位 | 价格倍率 | 基础价格（铁）|
|------|---------|---------------|
| 一阶 | ×1.0 | 40 金 |
| 二阶 | ×2.5 | 100 金 |
| 三阶 | ×10.0 | 400 金 |
| 灾厄 | ×50.0 | 2000 金 |

> 公式随材料自动生效。局部防护件（手套/护腿/肩甲/铁靴）只升 2 档。重甲穿戴者不获敏捷调整值（防御高但闪避低）。



- AC：战斗中作为防御值加值（+3，头部全覆盖）
- 笨重：穿戴者不获敏捷调整值；视野−5m（远程/侦查相关检定劣势叙事）；需力量≥15 穿戴
- 耐久：被命中 −伤害等额；破损（1~50）AC −1；报废（0）不提供 AC

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
