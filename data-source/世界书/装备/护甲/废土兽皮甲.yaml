# 废土兽皮甲

## 基础数值（跑团接口）

- AC 加成：+2
- 重量：中
- 槽位：身体
- 特殊限制：无
- 耐久上限：60
- 基准价格：10 金

## 外观与美学

- 粗糙的变异巨熊皮或灰烬狼皮整皮护身，毛发焦黑
- 常见材质：变异兽皮（整张鞣制）/筋腱绑扎
- 废土变体：厚重但保暖，兽皮上留有弹孔与爪痕，适合废土游荡者

## 材料加成公式（按材料档位）

| 材料档 | AC 加成 | 重甲敏捷惩罚 |
|--------|---------|-------------|
| 一阶（铁/兽皮）| +2 | — |
| 二阶（精铁/钢）| +3 | — |
| 三阶（秘银/骨白岩/宝石）| +4 | — |
| 灾厄（黑曜铁/血晶石/星铁）| +5 | — |

| 档位 | 价格倍率 | 基础价格（铁）|
|------|---------|---------------|
| 一阶 | ×1.0 | 10 金 |
| 二阶 | ×2.5 | 25 金 |
| 三阶 | ×10.0 | 100 金 |
| 灾厄 | ×50.0 | 500 金 |

> 公式随材料自动生效。局部防护件（手套/护腿/肩甲/铁靴）只升 2 档。重甲穿戴者不获敏捷调整值（防御高但闪避低）。

- AC：战斗中作为防御值加值（+2）
- 中甲：敏捷调整值最多 +2；无潜行惩罚（叙事）
- 耐久：被命中 −伤害等额；破损（1~50）AC −1；报废（0）不提供 AC

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
