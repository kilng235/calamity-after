# 军用重甲

## 基础数值（跑团接口）

- AC 加成：+5
- 重量：中
- 槽位：身体
- 特殊限制：潜行相关检定劣势（护具齐全，行动受限）
- 耐久上限：90
- 基准价格：750 金

## 外观与美学

- 军警部队的半身板甲，护胸、护肩、护臂齐全
- 常见材质：军规合金板/凯夫拉复合内衬
- 废土变体：沉重且行动受限，但防护优秀；漆面下露出驻队编号

## 材料加成公式（按材料档位）

| 材料档 | AC 加成 | 重甲敏捷惩罚 |
|--------|---------|-------------|
| 一阶（铁/兽皮）| +5 | — |
| 二阶（精铁/钢）| +6 | — |
| 三阶（秘银/骨白岩/宝石）| +7 | — |
| 灾厄（黑曜铁/血晶石/星铁）| +8 | — |

| 档位 | 价格倍率 | 基础价格（铁）|
|------|---------|---------------|
| 一阶 | ×1.0 | 750 金 |
| 二阶 | ×2.5 | 1875 金 |
| 三阶 | ×10.0 | 7500 金 |
| 灾厄 | ×50.0 | 37500 金 |

> 公式随材料自动生效。局部防护件（手套/护腿/肩甲/铁靴）只升 2 档。重甲穿戴者不获敏捷调整值（防御高但闪避低）。

- AC：战斗中作为防御值加值（+5）
- 中甲：敏捷调整值最多 +2；潜行相关检定劣势
- 耐久：被命中 −伤害等额；破损（1~50）AC −1；报废（0）不提供 AC

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
