# 锁甲

## 基础数值（跑团接口）

- AC 加成：+4
- 重量：中
- 槽位：身体
- 特殊限制：锁甲穿戴者不获敏捷调整值（笨重，重甲惩罚）
- 耐久上限：70
- 基准价格：70 金

## 外观与美学

- 铁环锁子甲（上万铁环），内衬皮革或布
- 常见材质：铁/精铁环；内衬焦木纤维或兽皮
- 废土变体：环间补铁片（镶嵌式修补），带战场磨痕


## 材料加成公式（按材料档位）

| 材料档 | AC 加成 | 重甲敏捷惩罚 |
|--------|---------|-------------|
| 一阶（铁/兽皮）| +4 | 不获敏捷调整值 |
| 二阶（精铁/钢）| +5 | 不获敏捷调整值 |
| 三阶（秘银/骨白岩/宝石）| +6 | 不获敏捷调整值 |
| 灾厄（黑曜铁/血晶石/星铁）| +7 | 不获敏捷调整值 |

| 档位 | 价格倍率 | 基础价格（铁）|
|------|---------|---------------|
| 一阶 | ×1.0 | 70 金 |
| 二阶 | ×2.5 | 175 金 |
| 三阶 | ×10.0 | 700 金 |
| 灾厄 | ×50.0 | 3500 金 |

> 公式随材料自动生效。局部防护件（手套/护腿/肩甲/铁靴）只升 2 档。重甲穿戴者不获敏捷调整值（防御高但闪避低）。



- AC：战斗中作为防御值加值（+4）
- 重甲惩罚：穿戴者不获敏捷调整值（潜行/侦查相关检定劣势叙事）
- 耐久：被命中 −伤害等额；破损（1~50）AC −1；报废（0）不提供 AC

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
