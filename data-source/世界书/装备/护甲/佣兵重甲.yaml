# 佣兵重甲

## 基础数值（跑团接口）

- AC 加成：+6
- 重量：重
- 槽位：身体
- 特殊限制：不获敏捷调整值；穿戴需力量≥13；潜行相关检定劣势
- 耐久上限：90
- 基准价格：75 金

## 外观与美学

- 完整的锁甲，链环密集覆盖全身，附半臂与护领
- 常见材质：铁链环/皮革衬底/肩部铆铁片
- 废土变体：需要强壮体魄才能长时间穿戴；佣兵联盟制式装备

## 材料加成公式（按材料档位）

| 材料档 | AC 加成 | 重甲敏捷惩罚 |
|--------|---------|-------------|
| 一阶（铁/兽皮）| +6 | 不获敏捷调整值 |
| 二阶（精铁/钢）| +7 | 不获敏捷调整值 |
| 三阶（秘银/骨白岩/宝石）| +8 | 不获敏捷调整值 |
| 灾厄（黑曜铁/血晶石/星铁）| +9 | 不获敏捷调整值 |

| 档位 | 价格倍率 | 基础价格（铁）|
|------|---------|---------------|
| 一阶 | ×1.0 | 75 金 |
| 二阶 | ×2.5 | 187 金 |
| 三阶 | ×10.0 | 750 金 |
| 灾厄 | ×50.0 | 3750 金 |

> 公式随材料自动生效。局部防护件（手套/护腿/肩甲/铁靴）只升 2 档。重甲穿戴者不获敏捷调整值（防御高但闪避低）。

- AC：战斗中作为防御值加值（+6）
- 重甲惩罚：穿戴者不获敏捷调整值；需力量≥13 才能长时间穿戴（低力量移动受限）；潜行相关检定劣势
- 耐久：被命中 −伤害等额；破损（1~50）AC −1；报废（0）不提供 AC
- 重量重：负重超过10+力量×2 公斤时力量相关检定劣势（按背包系统）

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
