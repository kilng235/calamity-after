# 头盔

## 基础数值（跑团接口）

- AC 加成：+2
- 重量：轻
- 槽位：头部
- 特殊限制：仅护头部
- 耐久上限：60
- 基准价格：15 金

## 外观与美学

- 半球形铁盔（轻盔），内衬皮垫，带系带
- 常见材质：铁/精铁盔壳；内衬焦木纤维或皮革
- 废土变体：盔面带凹痕，系带为皮绳补丁


## 材料加成公式（按材料档位）

| 材料档 | AC 加成 | 重甲敏捷惩罚 |
|--------|---------|-------------|
| 一阶（铁/兽皮）| +2 | — |
| 二阶（精铁/钢）| +3 | — |
| 三阶（秘银/骨白岩/宝石）| +3 | — |
| 灾厄（黑曜铁/血晶石/星铁）| +4 | — |

| 档位 | 价格倍率 | 基础价格（铁）|
|------|---------|---------------|
| 一阶 | ×1.0 | 15 金 |
| 二阶 | ×2.5 | 37 金 |
| 三阶 | ×10.0 | 150 金 |
| 灾厄 | ×50.0 | 750 金 |

> 公式随材料自动生效。局部防护件（手套/护腿/肩甲/铁靴）只升 2 档。重甲穿戴者不获敏捷调整值（防御高但闪避低）。



- AC：战斗中作为防御值加值（+2，仅头部）
- 轻盔：无重甲惩罚，头/目弱点防御叙事
- 耐久：被命中 −伤害等额；破损（1~50）AC −1；报废（0）不提供 AC

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
