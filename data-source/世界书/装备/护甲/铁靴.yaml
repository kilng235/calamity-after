# 铁靴

## 基础数值（跑团接口）

- AC 加成：+1
- 重量：轻
- 槽位：足部
- 特殊限制：仅护足部
- 耐久上限：70
- 基准价格：8 金

## 外观与美学

- 铁皮包革短靴（护胫+靴面），铆钉加固
- 常见材质：铁/精铁片；革面为变异生物皮
- 废土变体：靴底磨平带补丁，靴面带矿渣痕


## 材料加成公式（按材料档位）

| 材料档 | AC 加成 | 重甲敏捷惩罚 |
|--------|---------|-------------|
| 一阶（铁/兽皮）| +1 | — |
| 二阶（精铁/钢）| +1 | — |
| 三阶（秘银/骨白岩/宝石）| +2 | — |
| 灾厄（黑曜铁/血晶石/星铁）| +2 | — |

| 档位 | 价格倍率 | 基础价格（铁）|
|------|---------|---------------|
| 一阶 | ×1.0 | 8 金 |
| 二阶 | ×2.5 | 20 金 |
| 三阶 | ×10.0 | 80 金 |
| 灾厄 | ×50.0 | 400 金 |

> 公式随材料自动生效。局部防护件（手套/护腿/肩甲/铁靴）只升 2 档。重甲穿戴者不获敏捷调整值（防御高但闪避低）。



- AC：战斗中作为防御值加值（+1，仅足部）
- 足部防护：践踏/陷阱/地形伤害防御叙事
- 耐久：被命中 −伤害等额；破损（1~50）AC −1；报废（0）不提供 AC

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
