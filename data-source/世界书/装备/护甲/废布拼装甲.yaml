# 废布拼装甲

## 基础数值（跑团接口）

- AC 加成：+1
- 重量：轻
- 槽位：身体
- 特殊限制：无
- 耐久上限：50
- 基准价格：5 金

## 外观与美学

- 用废弃帆布和破布层层缝制，内衬填充干草
- 常见材质：麻布/帆布/变异生物筋腱缝线
- 废土变体：补丁摞补丁，浆洗后发硬，聊胜于无的防护

## 材料加成公式（按材料档位）

| 材料档 | AC 加成 | 重甲敏捷惩罚 |
|--------|---------|-------------|
| 一阶（铁/兽皮）| +1 | — |
| 二阶（精铁/钢）| +2 | — |
| 三阶（秘银/骨白岩/宝石）| +3 | — |
| 灾厄（黑曜铁/血晶石/星铁）| +4 | — |

| 档位 | 价格倍率 | 基础价格（铁）|
|------|---------|---------------|
| 一阶 | ×1.0 | 5 金 |
| 二阶 | ×2.5 | 12 金 |
| 三阶 | ×10.0 | 50 金 |
| 灾厄 | ×50.0 | 250 金 |

> 公式随材料自动生效。局部防护件（手套/护腿/肩甲/铁靴）只升 2 档。重甲穿戴者不获敏捷调整值（防御高但闪避低）。

- AC：战斗中作为防御值加值（+1）
- 轻甲：无移动惩罚，潜行相关检定不获劣势（叙事）
- 耐久：被命中 −伤害等额；破损（1~50）AC −1；报废（0）不提供 AC

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
