# 防暴胸甲

## 基础数值（跑团接口）

- AC 加成：+4
- 重量：中
- 槽位：身体
- 特殊限制：无
- 耐久上限：85
- 基准价格：400 金

## 外观与美学

- 旧世界防暴装备的胸甲部分，一体成型金属护胸
- 常见材质：旧世界合金钢板/复合材料衬层
- 废土变体：打磨除锈后重新上油，保护要害且不影响行动

## 材料加成公式（按材料档位）

| 材料档 | AC 加成 | 重甲敏捷惩罚 |
|--------|---------|-------------|
| 一阶（铁/兽皮）| +4 | — |
| 二阶（精铁/钢）| +5 | — |
| 三阶（秘银/骨白岩/宝石）| +6 | — |
| 灾厄（黑曜铁/血晶石/星铁）| +7 | — |

| 档位 | 价格倍率 | 基础价格（铁）|
|------|---------|---------------|
| 一阶 | ×1.0 | 400 金 |
| 二阶 | ×2.5 | 1000 金 |
| 三阶 | ×10.0 | 4000 金 |
| 灾厄 | ×50.0 | 20000 金 |

> 公式随材料自动生效。局部防护件（手套/护腿/肩甲/铁靴）只升 2 档。重甲穿戴者不获敏捷调整值（防御高但闪避低）。

- AC：战斗中作为防御值加值（+4）
- 中甲：敏捷调整值最多 +2；无潜行惩罚（叙事）
- 耐久：被命中 −伤害等额；破损（1~50）AC −1；报废（0）不提供 AC

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
