# 废铁鳞片甲

## 基础数值（跑团接口）

- AC 加成：+4
- 重量：中
- 槽位：身体
- 特殊限制：潜行相关检定劣势（走动时金属片碰撞作响）
- 耐久上限：80
- 基准价格：50 金

## 外观与美学

- 废铁片裁剪成鳞片状，缝在皮甲底上，层层叠压
- 常见材质：废铁鳞片/皮底/筋腱或铁丝缀连
- 废土变体：鳞片大小不一，走动时金属片碰撞作响，潜行困难

## 材料加成公式（按材料档位）

| 材料档 | AC 加成 | 重甲敏捷惩罚 |
|--------|---------|-------------|
| 一阶（铁/兽皮）| +4 | — |
| 二阶（精铁/钢）| +5 | — |
| 三阶（秘银/骨白岩/宝石）| +6 | — |
| 灾厄（黑曜铁/血晶石/星铁）| +7 | — |

| 档位 | 价格倍率 | 基础价格（铁）|
|------|---------|---------------|
| 一阶 | ×1.0 | 50 金 |
| 二阶 | ×2.5 | 125 金 |
| 三阶 | ×10.0 | 500 金 |
| 灾厄 | ×50.0 | 2500 金 |

> 公式随材料自动生效。局部防护件（手套/护腿/肩甲/铁靴）只升 2 档。重甲穿戴者不获敏捷调整值（防御高但闪避低）。

- AC：战斗中作为防御值加值（+4）
- 中甲：敏捷调整值最多 +2；潜行相关检定劣势
- 耐久：被命中 −伤害等额；破损（1~50）AC −1；报废（0）不提供 AC

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
