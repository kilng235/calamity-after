# 废铁环甲

## 基础数值（跑团接口）

- AC 加成：+4
- 重量：重
- 槽位：身体
- 特殊限制：不获敏捷调整值；潜行相关检定劣势
- 耐久上限：85
- 基准价格：30 金

## 外观与美学

- 废铁环串联成的简易护甲，环与环之间有缝隙
- 常见材质：废铁环/粗铁丝缀连/帆布衬底
- 废土变体：笨重且防护有限，但总比没有好；铁环锈蚀后一掰就断

## 材料加成公式（按材料档位）

| 材料档 | AC 加成 | 重甲敏捷惩罚 |
|--------|---------|-------------|
| 一阶（铁/兽皮）| +4 | 不获敏捷调整值 |
| 二阶（精铁/钢）| +5 | 不获敏捷调整值 |
| 三阶（秘银/骨白岩/宝石）| +6 | 不获敏捷调整值 |
| 灾厄（黑曜铁/血晶石/星铁）| +7 | 不获敏捷调整值 |

| 档位 | 价格倍率 | 基础价格（铁）|
|------|---------|---------------|
| 一阶 | ×1.0 | 30 金 |
| 二阶 | ×2.5 | 75 金 |
| 三阶 | ×10.0 | 300 金 |
| 灾厄 | ×50.0 | 1500 金 |

> 公式随材料自动生效。局部防护件（手套/护腿/肩甲/铁靴）只升 2 档。重甲穿戴者不获敏捷调整值（防御高但闪避低）。

- AC：战斗中作为防御值加值（+4）
- 重甲惩罚：穿戴者不获敏捷调整值；潜行相关检定劣势
- 耐久：被命中 −伤害等额；破损（1~50）AC −1；报废（0）不提供 AC
- 重量重：负重超过10+力量×2 公斤时力量相关检定劣势（按背包系统）

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
