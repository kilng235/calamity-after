# 盾牌

## 基础数值（跑团接口）

- AC 加成：+2
- 重量：中
- 槽位：副手
- 特殊限制：占副手槽；近战格挡叙事优势
- 耐久上限：70
- 基准价格：20 金

## 外观与美学

- 圆盾或鸢形盾（60~80cm），木芯包铁皮或全铁
- 常见材质：铁/精铁皮；焦木芯；变异生物皮蒙面
- 废土变体：盾面带凹痕与箭孔补丁，蒙皮为焦木巨蜥皮


## 材料加成公式（按材料档位）

| 材料档 | AC 加成 | 重甲敏捷惩罚 |
|--------|---------|-------------|
| 一阶（铁/兽皮）| +2 | — |
| 二阶（精铁/钢）| +3 | — |
| 三阶（秘银/骨白岩/宝石）| +4 | — |
| 灾厄（黑曜铁/血晶石/星铁）| +5 | — |

| 档位 | 价格倍率 | 基础价格（铁）|
|------|---------|---------------|
| 一阶 | ×1.0 | 20 金 |
| 二阶 | ×2.5 | 50 金 |
| 三阶 | ×10.0 | 200 金 |
| 灾厄 | ×50.0 | 1000 金 |

> 公式随材料自动生效。局部防护件（手套/护腿/肩甲/铁靴）只升 2 档。重甲穿戴者不获敏捷调整值（防御高但闪避低）。



- AC：战斗中作为防御值加值（+2，副手）
- 格挡叙事优势：近战格挡/防御姿态时相关检定获优势（叙事，非数值）
- 占副手：双持时不可持盾（双持规则见战斗规则·双持）
- 耐久：被命中 −伤害等额；破损（1~50）AC −1；报废（0）不提供 AC

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
