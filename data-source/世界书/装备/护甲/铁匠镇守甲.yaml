# 铁匠镇守甲

## 基础数值（跑团接口）

- AC 加成：+7
- 重量：重
- 槽位：身体
- 特殊限制：不获敏捷调整值；穿戴需力量≥15；潜行相关检定劣势
- 耐久上限：95
- 基准价格：200 金

## 外观与美学

- 铁匠精心锻造的夹板甲，金属条纵向拼接，铆钉封边
- 常见材质：精铁甲条/皮革铰接/内衬毛毡
- 废土变体：极其沉重，只有精锐卫兵才配备；甲面常錾刻铁匠镇徽记

## 材料加成公式（按材料档位）

| 材料档 | AC 加成 | 重甲敏捷惩罚 |
|--------|---------|-------------|
| 一阶（铁/兽皮）| +7 | 不获敏捷调整值 |
| 二阶（精铁/钢）| +8 | 不获敏捷调整值 |
| 三阶（秘银/骨白岩/宝石）| +9 | 不获敏捷调整值 |
| 灾厄（黑曜铁/血晶石/星铁）| +10 | 不获敏捷调整值 |

| 档位 | 价格倍率 | 基础价格（铁）|
|------|---------|---------------|
| 一阶 | ×1.0 | 200 金 |
| 二阶 | ×2.5 | 500 金 |
| 三阶 | ×10.0 | 2000 金 |
| 灾厄 | ×50.0 | 10000 金 |

> 公式随材料自动生效。局部防护件（手套/护腿/肩甲/铁靴）只升 2 档。重甲穿戴者不获敏捷调整值（防御高但闪避低）。

- AC：战斗中作为防御值加值（+7）
- 重甲惩罚：穿戴者不获敏捷调整值；需力量≥15 才能穿戴（低力量移动受限）；潜行相关检定劣势
- 耐久：被命中 −伤害等额；破损（1~50）AC −1；报废（0）不提供 AC
- 重量重：负重超过10+力量×2 公斤时力量相关检定劣势（按背包系统）

## 词缀与变体

- 自然词条：装备完成后 AI 按 §词缀表 抽 N 个（按品质档），自由起 2~4 字废土冷峻风叙事名
