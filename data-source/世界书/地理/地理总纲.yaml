## 区域关联

- **锈钉镇**是多数探索的起点，可通往所有区域
- **旧王城废墟**地下通过排水渠连接**沉没之城**
- **灰烬森林**南接**魔法荒原**
- **龙骨山脉**南麓有**遗忘修道院**
- **深渊裂隙**向南延伸出**地下裂谷**
- **迷雾沼泽**地下河汇入旧王城地下水系