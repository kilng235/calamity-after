# 区域·北方山脉

## 龙骨山脉

- 类型：山脉（神陨时龙骨坠落形成，岩石嵌巨大骨白色化石，据说是陨落神明骸骨）
- 位置：旧王国北部边境，横贯东西约四十公里；主峰龙骨峰海拔约三千米，雪线两千米
- 危险：中高；主要势力：自由佣兵联盟（采矿队）、深渊之子（考察队）
- 特征：山体嶙峋，矿脉丰富吸引拾荒者与探险队；雨季山体滑坡、冬季雪崩、拾荒者冲突

### 地点

| 地点 | 特征 |
|------|------|
| 龙骨峰 | 主峰，山脊形似龙骨，终年积雪 |
| 矿洞群 | 沿山麓废弃矿洞，部分被拾荒者占据 |
| 骨白峡谷 | 两山间狭长谷地，岩壁裸露骨白色岩层 |
| 山脚营地 | 临时补给点，商队采矿队中转站 |

### 生物

- 岩羊：群居雪线以下山崖，岩石间跳跃灵活
- 洞穴蝙蝠：矿洞群居，受惊成群飞出
- 雪豹：龙骨峰一带，皮毛灰白带黑斑，以岩羊为食
- 石甲虫：甲壳坚硬如石，以矿物为食，体长半米

### 材料

- 铁矿石（浅层矿洞，灰褐深褐带铁锈斑）、精铁（深层矿洞，深灰银灰）、铜矿石（浅层，红褐青绿）、锡矿石（浅层伴生，银白浅灰）、银矿石（深层伴生铁矿，断面银白）
- 骨白岩（骨白峡谷，乳白骨白断面纤维状，黑暗中隐约温热）、龙骨化石（骨白峡谷，骨骼纹理清晰，比石轻）、燃煤（深层矿洞）
- 星铁陨矿（峰顶，见深渊与地下区域同材）

> 详细产地与伴生关系以本条目为权威源；价格/作用以「矿物与材料总纲」为权威源。

### 宝石

- 蓝宝石（冰脉冰川裂隙内侧，深蓝半透明冷光）、红宝石（深脉铁矿石脉深处，血红微暖）、黄玉（河床冲积，金黄折射强）、玛瑙（黑曜石脉伴生，灰白环纹）、星辉宝石（峰顶星铁伴生，银白星纹虹彩）

### 危险因素

- 山体滑坡（雨季频繁，矿洞入口常被掩埋）
- 雪崩（龙骨峰冬季积雪厚，高声可能引发）
- 洞穴生物（矿洞深处变异蝙蝠与穴居爬行动物）
- 拾荒者冲突（矿区势力争夺）

