## 迷雾沼泽

- 类型：沼泽（灾厄后地形剧变，平原塌陷成沼泽，地下水涌入形成水网迷宫）
- 位置：旧王国南部低地
- 危险：中；主要势力：漂泊者议会（秘密通道）、拾荒者
- 特征：终年灰绿色瘴气笼罩；外界者无向导三天内无法自行走出水网迷宫

### 地点

| 地点 | 特征 |
|------|------|
| 瘴气区 | 沼泽外围，灰绿雾气弥漫，能见度低 |
| 水网迷宫 | 交错水道深浅不定 |
| 枯树丛 | 大片枯死树木，根部浸水 |
| 孤岛 | 高地散布，干燥地面与简易避风所 |
| 暗流河 | 沼泽深处地下河，汇入旧王城地下水系 |

### 瘴气特性

- 瘴气从地面裂缝持续渗出，浓度随季节变化
- 长期吸入导致头晕、幻觉，严重昏迷
- 某些植物能吸收瘴气，附近浓度降低至可呼吸
- 雨后浓度降低但积水更深

### 生物

- 荧光苔藓：夜间幽绿光芒照亮水面，覆盖枯树根与孤岛岩石
- 瘴蚊：指节大小群居，叮咬引起皮疹低烧
- 沼泽巨蜥：体长两米，灰绿皮肤覆泥，浅滩潜伏水下突袭，咬伤带麻痹毒液

### 产物与探索点

- 解毒药草（解瘴气毒与多数蛇毒）、荧光苔藓粉末（照明药剂与信号弹）
- 探索点：孤岛庇护所（漂泊者议会秘密安全屋）、沉没遗迹（灾厄前建筑残骸半淹）、暗流河入口（通往旧王城地下水系）

### 进入建议

- 佩戴浸药面罩遮挡瘴气，携带长杆探路避免陷入深沼
- 黄昏与夜间毒虫活跃，尽量避免行动；孤岛是安全宿营点