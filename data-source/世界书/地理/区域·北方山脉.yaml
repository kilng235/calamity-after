## 遗忘修道院

- 类型：遗迹/宗教建筑（灾厄前旧王国最大宗教典籍收藏地）
- 位置：龙骨山脉南麓山腰（海拔约一千二百米，占地约两公顷，石阶山路蜿蜒两公里）
- 危险：中；主要势力：无（无人占据）
- 特征：灾厄后与外界隔绝，居民或死或散，建筑群主体结构完整；传闻地下密室藏灾厄前珍贵文献

### 建筑布局

| 地点 | 特征 |
|------|------|
| 礼拜堂 | 主建筑，石砌穹顶，彩色玻璃窗部分碎裂 |
| 回廊庭院 | 露天庭院，石板上刻神徽 |
| 藏书室 | 三层石楼，书架倾倒书籍散落，部分虫蛀 |
| 宿舍区 | 修士修女起居区，已成废墟 |
| 地下密室 | 藏书室下方，入口被倒塌石块封堵 |
| 药草园 | 围墙内花园，野生药草茂盛 |

### 探索价值

- 地面两层藏书室约七成书籍被虫蛀或受潮解体，主要保存宗教典籍、历史编年、草药图谱
- 地下密室据遗民记载保存最珍贵收藏，可能含禁书与失落知识

### 生物与产物

- 生物：石壁蜥蜴（灰色鳞片融于岩石）、林鹿（山谷常见，清晨偶近药草园）、猫头鹰（穹顶阁楼筑巢）、山鼠（废墟啃食书籍织物）
- 产物：宗教典籍抄本、草药图谱（数百种药用植物绘图）、修道院编年史、药草（制药用）

