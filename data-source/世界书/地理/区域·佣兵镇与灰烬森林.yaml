## 灰烬森林

- 类型：废墟/荒野（无主要势力，危险区域）
- 位置：旧王国西部，占地约五十平方公里，锈钉镇以西可见
- 特征：灾厄时烧毁的古老森林，三百年后仍灰白；灰烬层厚约半米，核心区能见度不足五米
- 危险：中高；进入需面罩遮挡口鼻，沿溪谷前进作参照，避免夜间进入

### 地点

| 地点 | 特征 |
|------|------|
| 灰烬平原 | 森林外围，灰烬覆盖，相对安全 |
| 枯木林 | 灰烬飘落最密集，能见度低 |
| 焦黑深林 | 核心区，无光，变异生物出没 |
| 溪谷 | 唯一水源，变异鱼类栖息地 |

### 生物

- 灰烬狼：皮毛灰白与灰烬融为一体，群体狩猎，头狼指挥包抄
- 焦木巨蜥：体长两米，焦黑鳞片，灰烬中潜伏伪装，捕食时跃出
- 灰烬蚊：指节大小成群，口器刺穿衣物吸血，带低毒性毒素
- 枯死树精：极少数，灾厄后树木获灵智，移动缓慢，不主动攻击但领地意识强

### 材料与产物

- 焦木：通体漆黑带炭化层，耐火关键；用途：法杖杖身、武器握柄、盾牌主体、建材（价目见经济条目）
- 硫磺矿：黄色块状/粉末，刺鼻（臭鸡蛋）；用途：火焰瓶/烟幕弹核心、炼金药剂（另见深渊与地下区域）
- 祖母绿：溪谷两侧岩壁绿脉，深绿半透明含微光，生命属性魔法矿物
- 琥珀：倒伏焦木树心树脂化石，半透明金黄，内含焦木碎屑与古代虫骸
- 灰烬：含微量魔法残留，炼金配方用
- 生物材料：灰烬狼皮（保暖耐磨）、焦木蜥鳞片（制甲材料）、毒腺
- 遗物：灾厄时遗弃物，金属制品保存较好