# 区域·佣兵镇与灰烬森林

## 佣兵镇·锈钉

- 类型：边境城镇（自由佣兵联盟实际控制）
- 位置：旧王国边境隘口，背靠低矮石山，面朝荒原
- 人口：约 3000 人；信仰：无主导宗教，多神混居
- 特色：一切带铁锈与磨损痕迹；主街碎石铺成，两侧铁皮木屋（屋顶压石块防风）；旧城墙（灾厄前遗留，石砌高约四米，部分坍塌）

### 地点

| 地点 | 位置 | 功能 |
|------|------|------|
| 酒馆「断裂的王冠」 | 镇中心 | 三教九流汇聚之地，情报交易主要场所 |
| 佣兵公会 | 主街尽头 | 接受任务与发布悬赏 |
| 集市 | 镇内 | 每周三次，周边村庄带物资交换 |
| 铁匠铺 | 主街 | 三家，回收旧金属重铸武器工具 |

### 势力分布

- 酒馆区：自由佣兵联盟、漂泊者议会
- 佣兵公会：自由佣兵联盟
- 北区：圣火骑士团联络点
- 废墟区：旧日遗民、拾荒者
- 地下：深渊之子（隐秘据点）

### 本地人物

- 赛拉斯·铁火：酒馆「断裂的王冠」老板，通用铁匠（锻造规则铁匠代工基准价）
- 莉娜·灰袍：漂泊者议会联络人
- 艾莉丝：药剂店「苔藓与露」店主（银叶精灵），出售净化苔藓等银叶药剂

### 产物与补给

- 铁器、补给品（干粮/麦酒/绳索/火把）、情报、遗物（黑市偶现旧王城废墟遗物）

