# 漂泊者议会

## 概述

由游侠、信使与漂泊者组成的理想主义互助网络，游走于各方势力之间，保护平民与弱者，是五大势力中最年轻、也最不像「势力」的一支。

- 类型：游侠互助组织（慈善）
- 活动区域：无固定据点，散布各区域
- 成员估计：约 200 人
- 象征：缠结的绳结路徽

## 信仰与理念

- **保护弱者**：平民不该成为势力斗争的牺牲品；行善不问回报
- **不偏不倚**：不站在任何政治势力一边；成员四海为家，不求安稳
- **行胜于言**：议会不立碑、不记功，帮到人就是全部

> 「我们不拥有家园，家园拥有我们；我们不属于任何地方，但我们属于所有人。」

## 组织与据点

- 层级：漂泊长（资深成员选举产生）→ 游侠（正式成员，独立执行任务）→ 信使（传递情报与联络）→ 学徒
- 无总部：联络点散布各聚居地，锈钉镇设有常驻联络人
- 灾厄纪年 290~299 年间由各地游侠结盟成立

## 活动方式

- 护卫平民车队穿越危险区域；灾变与冲突后第一时间进场救助
- 维持一张覆盖各区域的口信情报网；对不公之事，也会在夜里悄悄出手
- 争议之处：曾庇护被通缉者（不问缘由）、曾泄露个别势力的密事

## 对外关系

- 圣火骑士团：理念相悖但无实际冲突，偶尔为通缉犯的归属摩擦
- 自由佣兵联盟：暗中争夺人才，偶有合作
- 深渊之子：警惕其危险研究，未敌对
- 旧日遗民：互相尊重，共享信息

## 重要成员

- 莉娜·灰袍：联络人，常驻锈钉镇，负责招募与联络（见其 NPC 条目）
- 薇拉·夜莺：暗影指挥官，主持暗中行动（见其 NPC 条目）

## 跑团接口

- 入门态度：友善，对落难者尤其如此
- 关系上升：无偿援助平民、解救被围困者、分享有价值的情报
- 关系下降：欺凌弱者、出卖行踪、为金币做脏活
- 加入途径：无仪式，由成员观察引荐，一起走过一段路，便算是同行人
- 典型委托：义务护送难民车队（报酬微薄，人情为重）；查明一座村落的失踪案（真相即报酬）
