# 自由佣兵联盟

## 概述

以佣兵公会为核心的商业佣兵联合体，信奉「金币至上，契约神圣」，不介入政治，只为金币而战，实际控制着佣兵镇锈钉的秩序。

- 类型：商业佣兵组织
- 活动区域：佣兵镇锈钉及周边
- 成员估计：约 500 人（含各佣兵团与编外散人）
- 象征：交叉双剑托一枚金币

## 信仰与理念

- **金币至上**：报酬到位，什么任务都接，包括不太体面的
- **契约神圣**：一旦签契，必须履行；毁约者在联盟地界再接不到活
- **不问立场**：不站在任何势力一边，种族与出身一视同仁（八族佣兵同价同契）
- **联盟互保**：成员战死，联盟抚恤家属；成员被欺，佣兵团共担

> 「契约上没有写立场，只写了价码。」

## 组织与据点

- 层级：公会会长（由最有势力的佣兵团推举）→ 佣兵团长 → 资深佣兵 → 见习佣兵
- 主基地：锈钉镇佣兵公会大堂，镇中心最大建筑，任务公告板、交易大厅、休息区一应俱全
- 灾厄纪年 150~200 年间随佣兵镇兴起而成形

## 活动方式

- 委托中介：接受护卫、护送、讨伐、清剿、调查各类委托，抽取佣金（委托报酬的一成，与经济条目口径一致）
- 商业经营：联盟名下商铺与训场；对镇内灰色业务睁一只眼闭一只眼
- 对平民：明码标价，童叟无欺，但也绝不免单

## 对外关系

- 圣火骑士团：稳定的大客户与巡防同行，商业往来无冲突
- 深渊之子：中立业务往来，佣兵受雇为其探索护航
- 漂泊者议会：暗中争夺人才，偶有合作
- 旧日遗民：护卫与鉴定的收费往来

## 重要成员

- 维克多·金牙：公会会长，锈钉镇事实上的主人（见其 NPC 条目）

## 跑团接口

- 入门态度：中立，金币面前人人平等，异族佣兵同价同契
- 关系上升：如约完成委托、举荐新血、在镇内守规矩
- 关系下降：毁约、私吞战利品、在锈钉镇内动粗
- 加入途径：公会大堂登记为见习佣兵（缴登记费），即可接低阶委托；攒满声望可入佣兵团
- 典型委托：护送商队穿越灰烬森林（按里程与人头计酬）；下矿道清剿变异兽（按威胁等级计酬）
