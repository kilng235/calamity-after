# 深渊之子

## 概述

追寻灾厄真相的隐秘研究结社，驻于深渊裂隙外围，不惜代价收集神陨的知识与遗物，是五大势力中最令人不安的一支。

- 类型：秘密研究组织
- 活动区域：深渊裂隙及周边荒原
- 成员估计：约 100 人（核心研究员不足三十）
- 象征：裂隙螺旋纹

## 信仰与理念

- **真相至上**：灾厄的起因必须查明，神为什么死，比谁在统治更重要
- **知识无善恶**：禁忌与否只取决于理解深浅，这条信条招来最多敌意
- **代价论**：找到真相的路上，牺牲是必要的成本，包括自己的

> 「神明保守了三百年的秘密，不该跟着他们一起下葬。」

## 组织与据点

- 层级：深渊祭司（最高领袖，据说能直接感应裂隙，无人见过真容）→ 裂隙探索者 → 研究员 → 学徒
- 主基地：深渊前哨站，位于裂隙外围荒原，表面是风尘仆仆的考察站，地下藏着通向裂隙的秘道
- 灾厄纪年 280~290 年间开始系统研究神陨之地，此前只有零散寻秘者

## 活动方式

- 派遣探索队深入裂隙，采集异常样本与灾厄碎片
- 重金收购灾厄前后文献与异常物品；在后哨站地下进行不对外公开的实验
- 争议传闻：灾厄碎片活体实验、探索队失踪被隐瞒，真相不明，但没人敢深究

## 对外关系

- 圣火骑士团：被视作异端，受其敌视与调查
- 自由佣兵联盟：雇佣关系，探索与护航都按契给钱
- 漂泊者议会：警惕其危险研究，未敌对
- 旧日遗民：学术往来，互相利用（并有不为外人所知的合作）

## 重要成员

- 塞壬·渊语：首领与创立执行者，盲眼先知，深渊祭司的代言人（见其 NPC 条目）
- 鸦·灰渡者：裂隙引路人，探索队出入皆由其带路（见其 NPC 条目）

## 跑团接口

- 入门态度：疏离审视，他们只在乎你能带回什么
- 关系上升：递交裂隙见闻、异常物品、灾厄前古籍
- 关系下降：泄露前哨站与秘道位置、损毁研究资料、与圣火审判官过从甚密
- 加入途径：由成员引荐，向前哨站交代自己的可用专长，经数项小任务取信
- 典型委托：随探索队入裂隙绘图采样（危险与报酬俱高）；把一只封印箱护送到前哨站，不许开、不许问（重金）
