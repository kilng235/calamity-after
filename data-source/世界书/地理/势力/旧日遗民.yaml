# 旧日遗民

## 概述

记录并保存灾厄前文明遗产的学者结社，成员多是学者、史官与收藏家，相信文明不该被遗忘，而真相就埋在过去里。

- 类型：学术收藏组织
- 活动区域：旧王城废墟及周边
- 成员估计：约 150 人（探险队仅占两成）
- 象征：烧焦的书页纹

## 信仰与理念

- **保存遗产**：灾厄前的知识必须传承；灾厄后的世界必须被记录，用文字而非口传
- **真相在过去**：文明为何崩塌，答案藏在废墟里，不在祈祷里
- **鉴定而后传承**：遗物须先弄清是什么，再谈归谁；未经鉴定的买卖即盗卖

> 「神明带走了一切，除了他们忘了烧掉的书。」

## 组织与据点

- 层级：遗民长（学术权威）→ 探险家（实地发掘）→ 鉴定师（断代估价值）→ 记录者（整理编史）
- 主基地：遗民小屋，旧王城废墟边缘一栋不起眼的屋子，地下档案室却收藏着黑暗时代以来的全部研究
- 已有成果：《灾厄编年史》初版、旧王城地图（迷雾区以外）、灾厄前度量衡考、魔法物品鉴定手册

## 活动方式

- 系统性发掘旧王城遗迹，按区域推进测绘
- 在各聚居地设鉴定点，为遗物断代估价（收费，与经济条目口径一致）
- 编写编年史、培养学徒；经费紧张时会出售重复遗物，这也是争议所在
- 隐秘之事：与深渊之子维持着不公开的合作，某些危险发现从未上报

## 对外关系

- 圣火骑士团：其发掘被视作潜在异端，受警惕
- 自由佣兵联盟：付费护卫与鉴定往来
- 深渊之子：学术往来，互相利用（并有不为外人所知的合作）
- 漂泊者议会：互相尊重，共享信息

## 重要成员

- 凯尔·拾灰者：遗民长，矮人宗师（见其 NPC 条目）
- 老维特：资深探险家，掌握迷雾区数条安全路线，三个月前失踪于旧王城深处，议会正在私下寻人（剧情钩子）

## 跑团接口

- 入门态度：中立好谈，对识货的人和气，对莽夫冷淡
- 关系上升：提交灾厄前遗物或文献抄本、报告废墟新发现、资助研究
- 关系下降：盗卖未鉴定遗物、破坏遗迹现场、向圣火审判官告发其发掘
- 加入途径：具备读写与鉴定基础，经记录者考核后自学徒做起
- 典型委托：随探险队入旧王城测绘新区域（按件计酬）；护送一箱遗物前往外地鉴定点（按箱计险）
