# 圣火骑士团

## 概述

以圣火为信仰核心的神权军事修会。信徒相信圣火是灾厄前神明遗留的最后火种，必须守护并以它重建秩序。

- 类型：军事修会（神权）
- 活动区域：边境要塞「黎明之门」及周边商路
- 成员估计：约 2000 人（圣火骑士约 300，余为修士与见习）
- 象征：白焰纹章

## 信仰与理念

- **核心信仰**：圣火是神明陨落后唯一的遗火，是黑暗时代仅存的神性凭据
- **教义**：用圣火照亮黑暗，以秩序取代混乱
- **戒律**：禁止欺诈、背叛、伤害无辜；违者受审并逐出教团

> 「火不问出身，只照方向。」

## 组织与据点

- 层级：大团长 → 圣火骑士（精锐战力）→ 灰袍修士（文职，记录与调查）→ 见习骑士
- 主基地：边境要塞「黎明之门」，位于锈钉镇北方三日路程，灾厄纪年 100~150 年间由边防古堡改建，城墙内常年不熄圣火坛
- 分驻：沿主要商路设小型祈祷堂兼哨站，骑士小队轮驻

## 活动方式

- 边境驻防，维护商路与聚居点秩序；接受平民护卫委托，仅收象征性费用
- 讨伐盗匪与变异生物；调查一切被认为威胁秩序的存在
- 经济来源：信众奉献、领主馈赠、护卫捐（不主动经商）

## 对外关系

- 自由佣兵联盟：唯利是图但守信，警惕不敌对
- 深渊之子：敌视，禁忌研究即是异端
- 漂泊者议会：理念相悖（秩序 vs 自由），无实际冲突
- 旧日遗民：警惕其发掘「不该出土之物」

## 重要成员

- 马库斯·圣火：大团长，务实温和派（见其 NPC 条目）
- 索恩·灰烬拳：副团长，激进派，主张主动出击（见其 NPC 条目）
- 伊莎·圣焰：审判官，负责异端调查（见其 NPC 条目）

## 跑团接口

- 入门态度：对守序者中立偏敬；五大势力中唯一对异族仍持偏见的只有其保守派（与种族总纲一致）
- 关系上升：护送平民与朝圣者、讨伐变异生物、上缴禁忌遗物
- 关系下降：与深渊之子往来、亵渎圣火、庇护通缉犯
- 加入途径：两名圣火骑士担保，于黎明之门圣火坛前宣誓，自见习骑士做起
- 典型委托：清剿袭扰商路的变异兽群（按威胁等级计酬）；护送朝圣队伍抵达黎明之门（象征性报酬+食宿）
