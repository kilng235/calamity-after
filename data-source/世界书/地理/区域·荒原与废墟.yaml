## 魔法荒原

- 类型：魔法异常区域（灾厄时魔法能量大规模泄露形成）
- 位置：旧王城废墟以西，灰烬森林以南
- 危险：高；主要势力：深渊之子（研究站）、独行法师
- 特征：物理规则被扭曲，魔法能量以可见形态在地表流动；施法极其危险，法术效果无法预测，但孕育独特魔法结晶与能量矿脉

### 地点

| 地点 | 特征 |
|------|------|
| 能量流 | 魔法能量地表可见光流，红蓝绿三色交织 |
| 结晶地 | 魔法能量凝结成晶体，从地面生长而出 |
| 静默区 | 魔法能量完全消失的零散区域，施法无效 |
| 风暴眼 | 能量最密集区域，常年能量风暴 |
| 扭曲林 | 树木被魔法扭曲成螺旋状 |

### 魔法异常现象

- 法术随机化（火球术可能变冰锥或光球）
- 魔法共鸣（能量流与结晶放大或干扰法术）
- 空间微扰（物体原地消失后远处出现）
- 记忆回响（灾厄前场景幻象，魔法记录回放）

### 危险因素

- 能量风暴（不定期爆发，施法者可能被反噬）、结晶刺（地面突然生长刺穿身体）、静默区陷阱（无法施法被困）、变异生物（体表长出结晶）

### 生物

- 晶壳蝎：体长半米，甲壳附魔法结晶碎片，尾刺带魔法能量释放微弱电击
- 能量蠕虫：生活在能量流中，以魔法能量为食，体表半透明，触碰释放能量冲击
- 扭曲鸦：羽毛被魔法染蓝紫，眼睛红光，能飞越能量风暴
- 静默鼠：静默区边缘，体型比普通鼠大两倍，能量风暴前成群逃离

### 资源与产物

- 魔法结晶（天然魔法能量聚合物，炼金/施法媒介）、能量矿石（地下开采含高浓度魔法能量）、能量晶簇（稀有~传说）、晶壳蝎毒液（麻痹药剂与魔法墨水）、扭曲木（结构异常坚韧，法杖用）

### 探索点与进入建议

- 探索点：结晶地（采集者最常去）、风暴眼（危险但价值最高，据说有巨型魔法结晶）、静默区（非施法者无直接威胁，可安全宿营）、深渊之子研究站（荒原边缘）
- 进入建议：非施法者携带魔法抗性护具；施法者备封印法术器具；沿能量流边缘行走相对安全；日落时能量风暴几率增加，建议日间探索