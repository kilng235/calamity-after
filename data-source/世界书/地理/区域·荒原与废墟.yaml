# 区域·荒原与废墟

## 旧王城废墟

- 类型：废墟/遗迹（灾厄前人类首都）
- 位置：旧王国中心盆地，占地约十平方公里；迷雾从地面裂缝持续渗出，雾层高可达二十米
- 危险：高；主要势力：旧日遗民（主要探索者）
- 特征：断壁残垣永远笼罩迷雾；拾荒者与旧日遗民出没，寻找黄金纪元遗物

### 地点

| 地点 | 特征 |
|------|------|
| 王宫废墟 | 屋顶已塌，只剩骨架 |
| 魔法学院遗址 | 灾厄后仍时灵时不灵的魔法残留 |
| 商业区 | 商铺遗址，偶能发现完好商品 |
| 下水道系统 | 连接各区域，部分被变异生物占据 |
| 中央广场 | 曾经的集会地，破碎的先王雕像 |

### 迷雾现象

- 迷雾自灾厄后第二日起未消散，深入可能迷失
- 迷雾中可能出现幻觉，看见灾厄前景象
- 旧日遗民绘制了部分安全路线

### 危险因素

- 变异鼠群（被灾厄侵蚀，群体行动，能啃穿皮革与薄木板）、废墟坍塌、魔法陷阱（灾厄前遗留部分仍有效）、拾荒者（为遗物不惜杀人）

### 生物

- 变异鼠群：拳头大小群体行动
- 迷雾鸦：通体黑色，塔楼废墟筑巢群居
- 石缝蛇：体长半米到一米，藏身石墙裂缝，毒弱但咬伤易感染
- 灰蛞蝓：夜间活动，爬行留腐蚀性黏液

### 材料与产物

- 星铁陨矿（废墟深处搜索，见深渊与地下区域同材）
- 完美钻石：宝库残骸（皇室藏宝室、大教堂密室），无色透明切面完整者极罕见，灾厄前顶级珍宝
- 远古符文：遗迹深层（旧王城废墟深层、地下祭坛），刻旧王国失落文字的石/金属符文片，残留灾厄前魔法
- 能量晶簇：魔法荒原能量矿脉，淡蓝白结晶簇含高浓度魔法能量
- 产物：遗物、贵金属（金币银器首饰）、魔法物品（极少量能量耗尽可修复）、历史文献（书籍卷轴碑文拓片）

> 详细产地与伴生关系以本条目为权威源；价格/作用以「矿物与材料总纲」为权威源。

### 进入建议

- 雇佣向导（旧日遗民成员），准备绳索与照明，避开夜间行动

