# 区域·深渊与地下

## 深渊裂隙

- 类型：神陨之地（灾厄中心，所有神明在此同时陨落）
- 位置：旧王国北部山区，以裂隙为中心半径十公里
- 危险：极高；主要势力：深渊之子（主要研究者）
- 特征：空间扭曲，魔法紊乱，禁忌之地；进入需向导（深渊之子成员）、定位魔法道具、可能一去不回

### 地点

| 地点 | 特征 |
|------|------|
| 外围荒原 | 裂隙周边，碎石地面植被枯死，物理规则正常 |
| 空间裂隙区 | 地面裂缝，空气折射异常，空间不稳定 |
| 核心祭坛 | 传说神明陨落处，悬浮岩石平台，四周能量风暴，无人返回 |

### 空间异常

- 空间折叠：明明百步却走不到
- 时间扭曲：进入数小时，出来已过数天
- 视觉错乱：可能看见不存在的人或物
- 物理异常：引力改变，上下左右不可靠

### 禁忌力量

- 原始魔法（灾厄前能量，不受现有体系约束）、神力残留（微弱）、灾厄碎片（能量结晶）

### 生物

- 裂隙犬：外围常见，皮毛灰白，能提前感知能量风暴
- 折射蝶：翅翼折射光线，飞行轨迹飘忽，群居于裂隙区边缘
- 影蜥：半透明体表，光线折射下近乎隐形，捕食突袭
- 深空行者：核心区传说生物，推测非实体，以能量形态活动

### 材料

- 黑曜铁：能量风暴后地表暴露；纯黑带暗红纹路，比铁重，触感冰冷微能量波动
- 秘银矿：银蓝光泽流动光影，比石轻，黑暗微弱冷光（仅大师铁匠可冶）
- 黑曜石：火山玻璃，贝壳状断口边缘锋利（箭头/匕首刃料）
- 血晶石：深红至血红半透明，流动血色纹路，黑暗中微弱红光，触感温热
- 星铁陨矿：深灰至黑致密块，表面烧蚀纹路，断口星纹，重约铁两倍
- 燃煤、硫磺矿：见经济条目价目

> 详细产地与伴生关系以本条目为权威源；价格/作用以「矿物与材料总纲」为权威源。

### 宝石

- 紫水晶（裂谷岩缝，紫罗兰半透明）、魔法结晶·暗（裂隙边缘，深紫近黑吞光感）、磷光菌核（菌巢深处，青绿夜光球体）

