## 沉没之城

- 类型：地下遗迹（灾厄时整城沉入地下）
- 位置：旧王城废墟东南方半日路程；地表为直径约两公里塌陷盆地，底部距原地面 15~20 米
- 危险：中高；主要势力：旧日遗民（挖掘队）、拾荒者
- 特征：地面只剩高塔尖顶与教堂穹顶露出（墓碑般矗立）；地下保留灾厄前完整格局，承重柱已裂缝，大型震动可能二次坍塌

### 地点

| 地点 | 特征 |
|------|------|
| 地面层 | 露出的屋顶塔尖，竖井与裂缝通地下 |
| 上层区 | 原地面下 5~8 米，商业街与住宅区，部分屋顶完整 |
| 下层区 | 十八米以下完全土石掩埋，需挖掘 |
| 地下广场 | 城市中心，塌陷天窗透光 |
| 排水渠 | 灾厄前排水系统，连接各区域 |

### 生物

- 石蝠：群居倒挂穹顶梁架，夜间觅食
- 地穴蛇：体长一米，石缝废墟藏身，无毒

### 产物

- 旧王国钱币（锈钉镇流通）、金属器具（生锈可重铸）、瓷器玻璃器（收藏价值）、石雕构件（旧日遗民收购）