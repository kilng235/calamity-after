## 地下裂谷

- 类型：地下通道网络（从深渊裂隙向南延伸约十五公里）
- 位置：深渊裂隙以南，旧王城废墟地下深处
- 危险：极高；主要势力：深渊之子（勘探队）、变异生物
- 特征：神陨时大地裂开形成，越深空间异常越频繁；上层湿润、中层有地下河、下层黑玄武岩深达四百米以上

### 地点

| 地点 | 特征 |
|------|------|
| 入口区 | 裂隙外围荒原南侧，若干洞口 |
| 上层通道 | 天然溶洞裂缝，石灰岩潮湿，洞顶高 2~5 米 |
| 中层洞厅 | 地震形成巨大空间（最高 50 米），底部地下河流淌 |
| 下层裂谷 | 黑玄武岩，深达 400 米以上，空间扭曲开始出现 |
| 古代遗迹 | 旧王国时期地下建筑，用途不明，刻旧王国徽章 |

### 空间异常

- 距离感知偏移（实际行走与感知不一致）、回声异常（声音方向逆转）、重力扰动（减半或加倍）、裂隙幻象（岩壁出现他处景象）

### 生物

- 穴居巨蝠：翼展两米群居，倒挂中层洞厅穹顶
- 磷光菌：岩壁与蝙蝠粪上发光菌类，幽蓝微光，可照明
- 地下河鱼：体长半米无眼，靠侧线感知水流震动
- 深潜者：下层特有，人形，岩壁垂直攀爬，速度超常人奔跑，避光
- 石蜈蚣：体长 1~2 米多足，毒液致麻痹

### 产物与探索点

- 磷光菌（照明数日）、地下河鱼（可食）、蝙蝠粪（燃料）、深潜者蜕皮（稀罕皮料）、深潜者骨骼（深渊之子高价收购）
- 探索点：地下瀑布（高约 30 米）、古代遗迹、磷光湖（幽蓝）、裂隙之门（空间扭曲最重）

