# 战利品检定（战利品/品相/容器场景 d20 范围掷取特化）

> 本条目为战利品场景掷骰权威源。d20 骰子来源按「通用检定 §0 场景调度表 + §6 骰子来源」执行；本条目只写范围映射（投骰范围 / 品相档位 / 容器状态）。
> **口径**：投骰/品相/容器均为 d20 **范围掷取**，不是「d20 + 调整值 vs DC」检定，不发检定经验（列入「经验与成长 §2」不发放清单）；稀有度五档、势力收购、任务凭证、拾取流程见「战利品系统」。

## 投骰体系

- 击败后 d20 投骰：1-10 折半/部分获取（按生物条目战利品表的 50% 概率项），11-20 全获
- 群体生物（蚊群/鼠群/蝙蝠群）单体取「低」档，以数量补足威胁
- 特殊修正：自爆类战利品消失、被烧毁/破损的样本降品相

## 品相判定

- 品相基准 = 投 d20：1-7 普通 / 8-15 完好 / 16-20 上品
- 击杀方式修正（客观公正：只偏移档位，不锁死结果）：
  - 部位破坏剥取（命中部位→该部位材料品相 −1 档）
  - 环境伤害取物（烧焦/坠落/控火烧杀）→ −1 档
  - 快速干净击杀（首击致命）→ +1 档
- **质量附加 d6**（普通/完好/上品三档都掷，从骰子池 d6 取用）：
  | d6 | 质量 | 收购价修正 |
  |----|------|-----------|
  | 1 | 劣质 | 品相价 ×0.9 |
  | 2~5 | 标准 | 无额外修正 |
  | 6 | 精良 | 品相价 ×1.2 |
- 收购价修正堆叠：品相档倍率（普通×0.8 / 完好基准 / 上品×1.5）× 质量附加倍率（劣质×0.9 / 标准×1 / 精良×1.2）联乘
- 任务凭证要求：高危/灾厄级任务凭证需品相完好以上

## 容器搜刮（区域进入时）

- 容器状态 d20：1-6 已空 / 7-18 未触碰 / 19 上锁或封闭（保底高级物资）/ 20 诱饵或陷阱（互动即触发伤害或警报）
- 侦察检定：感知 vs 隐藏 DC，此为正式 d20 检定，走「通用检定 §1」（成功发现基础物资池，大成功发现隐藏/稀有物品；**失败则跳过丰度掷取，只见表层废料~普通档物资**）
- 丰度 d20：1-6 废料 / 7-12 普通 / 13-17 高级 / 18-19 稀有 / 20 违禁品或独特物品
- 特殊修正：高辐射/污染区产出附带腐败/腐化属性，地区已被光顾过则容器状态检定 −5
