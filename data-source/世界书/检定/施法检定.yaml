# 施法检定（施法场景检定特化）

> 本条目为施法场景检定权威源。d20 检定公式、优势/劣势合并、大成功/大失败后果按「通用检定 §0 场景调度表 + §1~§7」执行；MP 体系、智力档位、法术数据与恢复路径见「法术总纲」，本条目不重抄。

## 输出结构（检定结构三分类）

- **A 单检定施法**：`<check>`×1，检定落地即出效果（伤害/治疗/召唤/环境/变形类，12/18 条）——按法术总纲各法术
- **B 目标抵抗施法**：`<check>`×2（施法方检定 + 目标抵抗/挣脱骰）——束缚之绳（对抗目标力量 DC13 挣脱）、恐惧凝视（对抗魅力 DC14）
- **C 自适应 DC 施法**：`<check>`×1，DC 随目标/物品浮动——鉴定术（物品稀有度 10/12/15/18/20）
- **锚点**：非战斗施法 → 正文独立 `<check>`；战斗施法 → `<check>` 嵌入 `<battle>` 回合块（施法作主行动）；反应施法（护盾术/寒冰护甲）→ 以独立 `■反应（施法）` 回合块插队在受害回合内；MP 扣费行随施法 `<check>` 输出、置于检定过程行之前（字面位置见「输出规范-检定」）
- `<check>` 字面排版见「输出规范-检定」；本条目只定层数与锚点，不重抄排版

## 施法检定

- **检定公式**：`d20 + 智力调整值 + PB` vs DC（按通用检定 §1 + §0 调度表「施法」行；PB 仅书籍习得后计入，已习得法术视为熟练，与技能检定口径对齐）
- **DC 按法术等级递增**（不走三档默认值）：1 级=DC12 / 2 级=DC15 / 3 级=DC18 / 4 级=DC20 / 5 级=DC22
- **施法顺序**：扣 MP → 消耗介质（卷轴）/ 无（书籍习得后）→ 掷施法检定 vs DC
- **MP 不足**：法术不可用（不进入检定阶段）；MP 扣费与恢复见「法术总纲」
- **施法媒介**：推荐持法杖；**不持杖施法检定承受劣势**（掷两次取低，按通用检定 §3），叙事「徒手施法勉强维持，效力大打折扣」；法杖耐久 −5 / 大失败（d20=1）
- **卷轴施法**：一次性载体（读后消失），不需研读检定，智力低也能放（内置引导）；因无熟练过程**不加 PB**，按该法术 DC 掷 `d20 + 智力调整值` vs DC，失败卷轴消失（卷轴破损）
- **法术习得检定**（研读书籍）走「学习检定」，不走本条目
