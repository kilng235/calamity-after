# 通用检定（轻量 D20，高骰制）

> 本条目是检定家族总纲：§0 场景调度表 + §1~§7 通用机制。各场景检定细则在独立条目（战斗检定/学习检定/战利品检定/锻造检定/施法检定），场景条目只引用本表与对应检定条目，不再各自重抄公式、DC、优势、骰子来源、经验规则。

## §0 检定场景调度表

> 本表是所有 d20 检定的入口索引。任何场景需要做检定时，**只引用本表与对应场景检定条目**。

| 场景类型 | 主属性 | DC档位 | 给检定经验 | 权威源条目（场景特化） |
|---------|--------|--------|-----------|---------------------|
| 战斗命中 | 敏捷 | 敌人 AC（生物总纲） | 否（战斗经验另算） | 战斗检定 |
| 攻击伤害 | — | 武器伤害骰 + 力量调整值（不掷 d20、不入检定） | 否 | 战斗检定 |
| 锻造 | 力量（精细可智力） | 材料档位→DC10/15/20 | 是 | 锻造检定 |
| 施法 | 智力 | 法术等级→DC（按等级递增） | 是 | 施法检定 | 不持杖施法检定承受劣势；智力双职责与 MP 体系见「法术总纲」，习得路径见「学习检定」+「法术总纲」第七节，恢复路径见「法术总纲」第八节（长休+药水） |
| 技能/法术习得 | 场景映射（学习检定·主属性场景映射） | DC10/15/20；法术习得按法术书等级递增 | 否（习得不发检定经验） | 学习检定 |
| 战利品投骰 | — | d20 范围（1-10 折半 / 11-20 全获） | 否（不掷 d20 vs DC） | 战利品检定 |
| 品相判定 | — | d20 范围（1-7 普通 / 8-15 完好 / 16-20 上品） | 否 | 战利品检定 |
| 容器状态 | — | d20 范围（1-6 空 / 7-18 未触碰 / 19 上锁 / 20 陷阱） | 否 | 战利品检定 |
| 通用检定 | 场景属性 | 任意 DC | 是 | —（本条目 §1~§7） |
| 对抗检定 | 双方各自主属性 | 总值高者占优，平局发起者胜 | 否（叙事获益，按「经验与成长 §2」） | 各场景条目 + 本条目 §5 |
| 社交/谈判 | 魅力（对 NPC 说服/请求/交易时） | 按「关系系统·社交判定分流表」三分类路由（档位 DC / 对抗 / 免检定） | 是 | 关系系统（分流表为唯一路由权威源） |

- 「攻击伤害」「战利品投骰」「品相判定」「容器状态」**不是 d20 检定**，只借用 d20 骰子做范围掷取，不走「d20 + 调整值 + PB vs DC」公式，**不发检定经验**
- 「通用检定」覆盖关系/背包/任务/侦察/说服等所有非战斗/非制作的场景，DC 与主属性按场景（六维属性覆盖领域见「属性系统」）
- 「给检定经验」列仅作路由标记（是/否/另计）；经验数值、非档位插值、类型粒度与不发放清单的唯一权威源为「经验与成长 §2」
- DC 档位严格三档（普通 10 / 困难 15 / 极难 20），任何场景偏离 ±5 视为异常需标注理由；施法与法术习得检定的 DC 按法术（书）等级递增，走「施法检定」「学习检定」覆盖场景，不走三档默认值

---

## §1 检定公式与触发

- <user> 要进行的所有存在失败可能的操作，均需 d20 检定；成功后事情按预期发展，失败后承担后果（不顺但可挽回，禁写成绝对失败）
- 检定公式：`d20 + 调整值（(属性值−10)/2 向下取整）+ 熟练加值 PB` vs DC，**总值 ≥ DC 即成功**（平值成功，与命中规则口径一致）；PB 仅在角色拥有该技能熟练时加成（详见「技能总纲」）
- 检定示例：【撬开一把锈锁】`d20 + 敏捷调整值` vs DC10；【辨认矿石成色】`d20 + 智力调整值` vs DC15；【掰开锈死的窗闩】`d20 + 力量调整值` vs DC10
- 无需检定的例外：极度简单的事（开无锁的门、回忆基本常识）；时间充裕且可反复试错的事；碾压性优势的事（壮汉与孩童扳手腕、老猎人辨识常见兽迹）

## §2 DC 难度三档

- 普通10，常人专注即可（默认）；困难15，需专业训练或有利条件；极难20，精英水平

## §3 优势/劣势与特质优势

- 优势/劣势：掷两次取高/低（各耗两枚骰子池骰子）；仅客观情况明显有利/不利时应用；多个优势合并为一次优势，劣势同理；优劣并存则相抵，普通掷骰
- 特质优势：角色铭刻的「特质」在对应场景检定中自动获优势（按通用检定 §3 多源合并为 1 重，不叠加）。9 项特质与检定路径对照如下：

| 特质 | 对应检定条目 | 主属性 | 优势触发场景 |
|---|---|---|---|
| 武艺 | 战斗检定 | 敏捷 | 持大师级武器/武器专精 |
| 学识 | 学习检定 | 智力 | 精灵种族/书斋环境/鉴定魔法物品 |
| 工艺 | 锻造检定 | 力量/智力 | 持工具（锻造锤/炼金工具）/矮人种族/工坊环境 |
| 潜行 | 通用检定（本条目 §1）| 敏捷 | 黑暗/遮蔽环境/猫人种族 |
| 警觉 | 通用检定（本条目 §1）| 感知 | 犬人种族（灵敏嗅觉 +5 固定加值）/主动侦察 |
| 交涉 | 关系系统（社交分流表）| 魅力 | 好感 +30（友好档）/ NPC 信赖 |
| 巧手 | 通用检定（本条目 §1）| 敏捷 | 持开锁工具/隐秘环境 |
| 攀爬 | 通用检定（本条目 §1）| 力量/敏捷 | 羊人种族（山地适应）/绳索辅助 |
| 医疗 | 通用检定（本条目 §1）| 感知/智力 | 持医疗包/友好 NPC 协助 |

- 未铭刻特质 ≠ 不能做对应动作；未铭刻只是**不获优势**，仍按普通 d20 检定结算
- 多源优势合并：特质优势 + 种族优势 + 工具优势 + 状态优势 = 仍为 1 重优势（d20 掷 2 取高）
- 特质铭刻上限 2 项（开场白锐刻），第 3 项自动消除

## §4 大成功/大失败

- 天然掷出20，完美达成或额外收益；天然掷出1，受挫且代价加重，骰子裁定的后果不可靠叙事豁免；**致死/致残仅在剧情已至绝境时触发**，普通情境的失败仍留余地、可挽回

## §5 对抗检定

- 对抗检定：双方各掷 `d20 + 调整值`，总值高者占优，相同则发起者占优；用于双方意图拉扯的场合
- 对抗示例：【说服铁匠赊账】`d20 + 魅力调整值` vs 铁匠的 `d20 + 魅力调整值`；【与酒馆老板拼酒】`d20 + 体质调整值` vs 老板的 `d20 + 体质调整值`；【潜行绕过哨兵】`d20 + 敏捷调整值` vs 哨兵的 `d20 + 感知调整值`；【黑市强买违禁品】`d20 + 魅力调整值 + PB` vs 卖家 `d20 + 魅力调整值 + PB`（按 §交易/讲价 强买强卖）
- 对方无具体数值时，按「NPC生成规则」取该 NPC 属性参与对抗

## §6 骰子来源

- 检定 d20 一律从「骰子池」条目的 d20 宏结果依次取用（第一枚用于第一次检定），不得凭空编造；战斗伤害骰（d4/d6/d8/d10/d12）按当前武器伤害骰面数从骰子池对应骰型依次取用；**额外随机骰**同样从骰子池对应骰型取用——锻造词条强度掷 d10、战利品品相质量附加掷 d6、锻造过程事件与战利品隐藏掉落掷 d20（细则见「锻造检定」「战利品检定」），多次掷骰依次取用多个宏；检定过程在正文中展示数值计算（骰值 + 调整值 = 总值 vs DC）；骰值与 DC 属神域，剧中角色永不可见

## §7 命运点与检定经验

- 命运点：每游戏日恢复1点；花1点可重骰任意一次检定，取新结果；<user> 明示使用时生效
- 检定经验：数值档位、非档位插值、类型粒度、次数上限与不发放清单的唯一权威源见「经验与成长 §2」，本条目不再定义数值

## 客观公正

- 允许任何人（包括主角与 NPC）因骰子而失败、伤残、死亡；命中与后果以骰子裁定为准，不刻意保全主角也不刻意杀主角，成败由骰值与情境共同决定

# 检定输出格式

`<check>` 标签的字面格式与字段说明见「输出规范-检定」条目；本规则条目只讲机制，不重抄排版。
