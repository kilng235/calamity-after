# 战斗检定（战斗场景检定特化）

> 本条目为战斗场景检定权威源。d20 检定公式、优势/劣势合并、大成功/大失败后果按「通用检定 §0 场景调度表 + §1~§7」执行，本条目不重抄；战斗非检定机制（耐久/双持/回合/状态/面板）见「战斗规则」。

## 命中与伤害

- 命中检定：`d20 + 敏捷调整值 + 武器命中加成（如有）` vs 目标 AC（按通用检定 §1 + §0 调度表「战斗命中」行）；近战与远程均用敏捷调整值
- 目标 AC：主角 = 10 + 敏捷调整值 + 护甲 AC 加成（锁甲/板甲/全罩盔等笨重护甲不获敏捷调整值，按「装备总纲」护甲限制列）；敌人 = 生物总纲危险等级表防御值；双方均加环境修正（如有）
- 环境修正：半掩体（矮墙/树桩/断墙）AC +3；全掩体（拐角/战壕/厚墙）AC +8；移动出掩体当回合仍享修正；环境修正与护甲 AC 加成并列累加（锁甲/板甲/全罩盔不获敏捷调整值，但环境修正照常生效）
- 伤害：按当前武器伤害骰（1d4/1d6/1d8/1d10/1d12，按装备武器表）+ 力量调整值（近战）；远程不加属性调整值；灵巧武器（匕首/短剑等）可用敏捷调整值替代力量调整值；从骰子池对应骰型依次取用掷取
- 暴击/大失败（执行锚点）：
  - **天然20 = 重击**：无视 AC 自动命中；伤害骰结果×2（**仅骰面部分，不含属性调整值**；多骰型如 2d6 两骰皆×2——多骰型仅指单次攻击天然含多枚伤害骰（大体型敌人等），**双持是两次独立攻击、各自结算重击，不合并为多骰型**，字面格式见「输出格式·战斗」多骰型条）；正文与 `<battle>` 摘要必须标注「重击」；同时触发叙事优势（仅叙事层呈现，按结算协议 §4.B + 通用检定 §4，不另叠数值）
  - **天然1 = 大失败**：无视命中检定自动失手；触发「暴露破绽」：**自己下一回合的所有攻击检定 + 力量/敏捷/体质相关检定劣势**；武器耐久额外 −5；正文与 `<battle>` 摘要必须标注「破绽」；同时触发叙事加重（仅叙事层呈现）
  - **优势/劣势与天然20/1**：优势下天然20 仍按重击判定（天然值优先）；劣势下天然1 仍按大失败判定（天然值不可被优势挽救）
  - **部位瞄准与重击/大失败**：瞄准不改变天然20/1 判定；瞄准核心 + 重击可叠加（重击骰面×2 后再 ×1.5 部位加成，向下取整）；瞄准 + 大失败仍按大失败
  - 两者不可漏标（按结算协议 §6 输出复查）
  - **战斗内非攻击 d20 检定**（闪避/挣脱/抵御恐惧等，借机动作触发）：天然20/1 按通用检定 §4 大成功/大失败处理（完美达成或额外收益 / 受挫加重不可豁免）；**不触发**「重击/暴露破绽」机制，「暴露破绽」**仅适用于攻击检定**

## 部位瞄准（玩家声明时应用）

- 瞄准头部或核心弱点：命中 −4，命中后伤害 ×1.5（向下取整）
- 瞄准四肢：命中 −2，成功可能导致残废（对应肢体动作劣势，按「状态列表」叙事裁定）
- 未声明瞄准则按普通命中结算；瞄准不改变重击/大失败判定

## 先攻检定

- 先攻：战斗开始时所有参与者掷先攻 `d20 + 敏捷调整值`，按降序行动；先攻顺序整场战斗保持不变
- 同值处理：先攻相同则敏捷属性高者优先，仍相同再各自掷 d20 决定；偷袭/伏击方在先攻检定获优势
- 新加入：战斗中后入场的参与者掷先攻后插入当前顺序
