# 学习检定（技能/法术习得场景检定特化）

> 本条目为习得场景检定权威源。d20 检定公式、优势/劣势合并、大成功/大失败后果按「通用检定 §0 场景调度表 + §1~§7」执行；习得触发来源（五来源）、等级体系与表结构见「技能总纲」「法术总纲」，本条目不重抄。

## 技能习得检定

- **习得检定口径**：`d20 + 主属性调整值 + PB` vs DC（按通用检定 §0 调度表「技能/法术习得」行 + §1）；技能习得场景下 PB 总是计入（角色必然拥有该技能熟练，否则不触发习得判定）；不发检定经验（列入「经验与成长 §2」不发放清单）
- **DC 档位**（按通用检定 §2 三档映射）：
  - DC10 基础动作
  - DC15 熟练动作
  - DC20 精通动作
- **主属性场景映射**（权威源：本条目）：
  - 武器场景（剑/斧/弓/锤/偷袭）→ 敏捷（远程）或力量（近战）
  - 治疗场景 → 智力
  - 工艺场景（锻造/炼金）→ 智力或力量
  - 社交场景（说服/领导/交易）→ 魅力
  - 观察场景（追踪/侦查/聆听）→ 感知
  - 战利品场景 → 智力

## 法术习得检定

- **习得判定公式**：`d20 + 智力调整值 + PB` vs DC
- **DC 档位**（按法术书等级，不走三档默认值）：1 级=DC12 / 2 级=DC15 / 3 级=DC18 / 4 级=DC20 / 5 级=DC22
- **智力未达解锁等级**：研读检定 DC+10（智力 8 看 2 级书 = DC25，实际无法命中）；智力双职责（可学等级上限 + MP 上限）见「法术总纲」
- **大成功**（天然 20 或总值 ≥ DC+10）：习得 + 解锁该法术「强化变体」（伤害+1d6 或效果+1 轮）
- **失败**：载体保留，可重试；每次失败消耗 1 颗对应学派宝石；宝石耗尽 = 书籍作废
- **卷轴**：不需研读检定（内置引导）；施法检定与失败后果见「施法检定」条目
- 随机 NPC 战斗模仿：`d20+智力 vs DC12+法术书等级`（失败=仅习得 1 轮临时法术，次日遗忘）；旁观学习：`d20+智力 vs DC15+法术书等级`（失败=仅获「法术线索」，下次可重试）；触发场景见「法术总纲」五来源表；二者为**非正式习得**（角色不熟练该施法过程），刻意不加 PB——与研读习得「PB 总计入」口径相区分
</LearningCheck>
