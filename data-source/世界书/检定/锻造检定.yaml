# 锻造检定（锻造场景检定特化）

> 本条目为锻造场景检定权威源。d20 检定公式、优势/劣势合并、大成功/大失败后果按「通用检定 §0 场景调度表 + §1~§7」执行；材料价格/产地、词缀生成、改装件、铁匠代工等非检定机制见「锻造规则」，本条目不重抄。

## 工具优劣

- **持对应工具** → 锻造检定获优势（按「通用检定 §3·优势/劣势」）
- **无工具徒手** → 锻造检定承受劣势（只能做基础件，如木柄/皮件）
- 工具种类（铁匠工具/炼金工具）与对应属性、占槽、借用见「锻造规则·工匠工具机制」

## 核心检定

- **检定公式**：`d20 + 调整值（力量用于钝器/护甲/重型武器/匕首，精细细工可智力；智力用于药剂/法杖/施法媒介）` vs DC（按通用检定 §1 + §0 调度表「锻造」行）；种族特质优势（矮人「锻造之心」、精灵「自然之眼」等）、工具优势、工坊环境优势合并为一次优势（按通用检定 §3）
- **DC 选择**（按通用检定 §2 三档映射）：

| 材料档位 | DC | 适用材料 |
|----------|-----|---------|
| 一阶 | DC10 | 铁/铜/锡/焦木/燃煤/焦炭 |
| 二阶 | DC15 | 精铁/银/骨白岩/龙骨化石/黑曜石/硫磺矿 |
| 三阶 | DC20 | 秘银/黑曜铁/血晶石/星铁 |

> 锻造难度分级独立于材料稀有度标签

- **骰子来源**：从「骰子池」依次取用，不得编造；检定过程在正文展示 `d20({骰值}) + {调整值} = {总值} vs DC{数值}`

### 炼金复用（补漏）

> 药剂炼制走本条目的**智力 + 炼金工具分支**（不使用力量锤锻造）：`d20 + 智力调整 + 持炼金工具优势`。**配方 DC 不按上表材料档，而是按「炼金配方表」每行驶出的档位**（一阶 DC10 / 二阶 DC15 / 三阶 DC20，对应成品档位即既往法力药水 DC 口径）。成败档、药效强度骰、品级爬升见「炼金规则」，本条目不重抄。

## 成果分级（品质档）

> 成功不再只有一种产出，按富余值（总值−DC）拆分成品品质档。分级只换词条池不换词条数，仅影响词条池选择，不输出独立标签。词条池见「词缀表·品质分级池」。

| 富余值（总值−DC） | 品质档 | 词条池 | 叙事基调 |
|------------------|--------|--------|---------|
| `< 0` | 失败 | 瑕疵词缀（沿用） | 材料部分消耗、留瑕疵 |
| `0 ~ +4` | 普通 | 主题池（既有基准） | 基准 |
| `+5 ~ +9` | **良品** | 良品池 | 光泽微起 |
| `≥ +10` | **杰出** | 杰出池 | 淬火如镜，匠人侧目 |

- **天然 20** → 品质档自动上移一档（普通→良品；若本已良品则升杰出）；**天然 1** → 强制失败档（沿用大失败瑕疵）
- 词条数仍按装备品质（普通1/罕见2/稀有2/史诗3/传说3），分级只换池不换数，防止词条膨胀
- 分级结果以一句叙事呈现，不引入额外状态或标签

## 过程事件（成功抽词前）

> 锻造检定通过、抽词条之前，从「骰子池」掷一枚 d20，决定本次锻造的过程变化。过程事件只影响词条**数量**，不改变已定的品质档。

| d20 | 过程事件 | 对词条的影响 |
|-----|---------|-------------|
| 1 | 火候骤变 | 词条 −1（至少保留 1） |
| 2 ~ 15 | 平稳 | 无修正 |
| 16 ~ 19 | 灵光一现 | 词条 +1（上限不超该品质档上限） |
| 20 | 天时地利 | 品质档低于良品时直接提升至良品（跳过爬升）；已达良品/杰出则维持原档 |

- 词条 ±1 在 AI 按于对应池抽词时执行，结果的词条数不超出「词缀表·装备品质决定词条数」的上限
- 过程事件为纯叙事+数量修正，不输出独立标签，过程骰值与结果并入锻造叙事
