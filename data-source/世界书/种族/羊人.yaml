# 羊人

## 基础信息

- 人口：约10200人（云角部落800+石蹄部落600+游牧家族600+散居各山峰部落约9800...注：散居含跨族混居，按主聚居计约2000+8000=10000；城镇羊人200）
- 降临：灾厄第四日，高山草原羊人部落被裂隙吞入
- 适应：★★★★★（最早融入人类社会之一）
- 寿命：100~150岁
- 生育率：中高（与人类混血约120人）
- 性别比例：男女约1:1

## 外观要点

- 身高1.7~1.9米，肌肉发达
- 第一特征：弯曲犄角（双角或单角，家系遗传）+ 羊耳（贴头侧立，向两侧微微外撇，毛色与发色协调）
- 第二特征：人脚下足但足弓高、步态轻盈无声（与人类足部比例一致）
- 毛色多样：雪白/棕褐/黑/灰；女性面容柔化，男性面容棱角
- 民俗审美：男性健壮体格与女性柔美面庞都被视为魅力

## 历史要点

- 灾厄纪年5~30年向导救援迷路商队，建立信任
- 与矮人合作驯化符文战羊（载重150kg，山地坐骑）
- 与精灵合作运营银露治疗站
- 与人类深度融合：混血儿遍布龙骨山脉与锈钉镇
- 长耳议会5长老（多女性）主理龙骨山脉散居事务

## 独特机制（跑团接口）

- **专业维度**：力量系
- **种族特质**：山地步兵（攀爬/耐力/行军相关检定获优势）
- **典型能力**：犄角冲撞（力量近战相关描述加成，叙事钩子，不作数值加值）；山地夜视（高海拔适应，叙事锚点）
- **惯用语**：角碰角=公平交易/对决；羊蹄轻=谨慎/小心

## 价目要点

- 山地向导：日薪1~2金币，区域50金/次，危险区150金/次
- 符文战羊租用：日租5金币（带装备10金币）
- 奶酪与蜂蜜大麦饼（天角节特产）：奶酪10银币/块、蜂蜜饼5银币/个
- 雇佣羊人战士随队：日薪2金币
- 角尖烈酒（节庆酒）：2银币/壶

## 代表人物

- 羊人长老会议由5位长者主理，长老议事机制详见地理·龙骨山脉条目

## 谚语

> 「角碰角，不碰心。」

> 「羊蹄踏过的地方，路会记住。」