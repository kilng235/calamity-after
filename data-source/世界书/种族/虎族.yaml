# 虎族

## 基础信息

- 人口：约1200人（烈焰氏族800+佣兵虎族散居各地400）
- 降临：灾厄第四日，荒原虎族游牧民被裂隙吞入
- 适应：★★★（雇佣兵融入深，但保留氏族荣誉感）
- 寿命：90~130岁
- 生育率：中（与人类混血约400人，继承虎纹与力量）
- 性别比例：男女约1:1

## 外观要点

- 身高1.8~2.0米，肌肉线条极为明显
- 第一特征：橙黄色虎纹（面颊/肩背/四肢，强度因家系而异）
- 第二特征：竖瞳金眼，夜间反光
- 犬齿略长于人类但非夸张；耳廓短圆近头部
- 民俗审美：虎纹与肌肉线条被认可为力量美学

## 历史要点

- 灾厄后立即加入佣兵联盟，担任追踪与清剿任务
- 与犬人形成「视觉 vs 嗅觉」友好竞争
- 烈焰氏族主居魔法荒原边缘，月夜狩猎变异生物
- 佣兵虎族散布各势力，是五大势力争抢的追踪人才

## 独特机制（跑团接口）

- **专业维度**：力量系
- **种族特质**：猎手（视觉追踪+近战搏斗检定获优势）
- **典型能力**：虎啸（短距威吓，叙事钩子）；伏击本能（偷袭/伏击情境下相关检定获优势）
- **惯用语**：以「爪痕」表示战斗经验；「月满则狩」指满月狩猎

## 价目要点

- 佣兵日薪：3~4金币（资深者5金币）
- 视觉追踪任务：50金/次，危险区150金/次，长期300金/月
- 月夜狩猎向导（满月满团出动）：150金/次
- 虎族皮甲（自产）：30~60金币（产量低，多自用）
- 雇佣虎族双人护卫：日薪8金币

## 代表人物

- 虎族烈焰氏族长由五大势力之一的虎族本族推举，居于魔法荒原边缘，主理全族狩猎与对外雇佣协议

## 谚语

> 「爪痕不在身上，在记忆里。」

> 「月满则狩，狩满则歌。」