# 兔耳族

## 基础信息

- 人口：约5000人（草原营地3000+城镇散居2000）
- 降临：灾厄第四日午后，灰烬森林与魔法荒原间草原部落被裂隙吞入
- 适应：★★★★（深度融入，军事与运输价值高）
- 寿命：110~140岁
- 生育率：中等（每对2~3个子女；与人类混血约1000人）
- 性别比例：女性70%，男性30%（婚配压力，部分兔耳娘与人类结合）

## 外观要点

- 身高1.5~1.7米，纤细修长，腿部线条优美（腿长约占身高60%）
- 第一特征：长兔耳（可独立转动180度）；**第二特征**：蓬松小圆兔尾5~8cm（开心时快速抖动）
- **耳型三型**（遗传多样性，与性格能力无关）：
  - 立耳型60%：长18~25cm竖立，听觉方向性最强（男性80%立耳）
  - 垂耳型35%：长20~28cm下垂贴颊（视觉上更显幼态、听觉范围广；女性40%垂耳）
  - 短耳型5%：长10~15cm，灵活稀有
- 女性发色浅色系、面容甜美；男性深色系、清秀偏中性

## 历史要点

- 灾厄纪年3年：50名走投无路的兔耳娘逃到锈钉镇，维克多·金牙庇护，成立兔脚斥候队
- 5~10年派出寻找队利用听觉与跳跃找回失散族人，350人重聚，建草原营地
- 10~50年误解与偏见（「繁殖快」「胆小如兔」），斥候队与运输队以战功破除
- 50年后完全融入：斥候是各势力争夺人才，运输队覆盖全废土

## 独特机制（跑团接口）

- **专业维度**：力量系
- **种族特质**：超级跳跃（跳跃/闪避/载重奔跑相关检定获优势；连跳距离与闪避时机相关检定获优势）
- **典型能力**：超级跳跃（垂直3米/精英4米+、水平8米、连跳5次）；冲刺爆发（2.5倍速30秒，冷却5分钟）；腿功战技（月兔踢/跃空踢/连环踢/兔蹬）
- **发情期**：每年春/秋各一次（7~10天，16~50岁），体温略升/耳红发热/散发草本信息素/情绪波动；社会已有「发情期假」+ 月兔宁静剂（20金/剂，抑制4~6小时）
- **惯用语**：跳得高=看得远；兔脚快=速度；月兔舞=优雅灵活

## 价目要点

- 兔脚斥候队（队长银月·跃空）：区域侦查50金/次、危险区150金/次、长期300金/月
- 兔跃运输队（队长风行·疾足）：标准货物20金/50km、紧急50金/50km
- 月影·战兔腿功道场：基础30金/课程、高级100金
- 胡萝卜饼5银/个、胡萝卜炖肉15银/份
- 雇佣兔耳族斥候随队：日薪2金币

## 代表人物

- 银月·跃空（兔脚斥候队队长）
- 风行·疾足（兔跃运输队队长）

## 谚语

> 「跳得高，看得远。」

> 「耳朵听到危险，双腿带来生机。」