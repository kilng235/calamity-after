# 灵耳族

## 基础信息

- 人口：约3800人（地下鼠巢3000+城镇散居800）
- 降临：灾厄第五日，旧王城废墟地下灵耳族地下城被传送而来
- 适应：★★★★（精密工艺/遗迹挖掘融入深）
- 寿命：70~100岁
- 生育率：高（与人类混血约1500人，继承部分听觉与精密操作）
- 性别比例：男女约1:1

## 外观要点

- 身高1.4~1.6米，纤细娇小
- 第一特征：大耳朵（听觉范围极广，能捕捉次声频段）
- 第二特征：柔长鼠尾（平衡辅助，奔跑时摆动幅度大）
- 毛色多样：灰/棕/奶白；面容小巧，动作灵活
- 民俗审美：大耳朵与娇小体型被认可为萌点

## 历史要点

- 灾厄纪年5~30年救治瘟疫患者，打破「害虫」刻板印象
- 与矮人合作精密符文陷阱，与犬人形成「听觉 vs 嗅觉」友好竞争
- 地下鼠巢（旧王城废墟地下）是灵耳族主城，城内为精密工坊+隧道网
- 废墟探索标配成员（听觉导航+灵敏操作）

## 独特机制（跑团接口）

- **专业维度**：敏捷系
- **种族特质**：耳语机巧（听觉定位+精密操作如开锁/陷阱/机关检定获优势）
- **典型能力**：隧道直觉（地下环境感知，叙事锚点）；废品直觉（垃圾堆里翻出有用物，叙事钩子）
- **惯用语**：耳朵听到=获得情报；藏起来=保密；垃圾变宝藏=废物利用

## 价目要点

- 精密开锁/机关调试：5~10金币/次（按复杂度）
- 废墟探索向导：日薪3金币，长期任务300金/月
- 符文陷阱定制：50~200金币（与矮人合作）
- 灵耳工匠代制精密件：材料费×1.5 + 工费10~30金币
- 雇佣灵耳斥候随队：日薪2金币

## 代表人物

- 鸦·灰渡者（深渊裂隙引路人，半精灵，详见 NPC 条目）

## 谚语

> 「垃圾变宝藏，是耳朵先听到。」

> 「藏起来的东西，迟早有人找出来。」