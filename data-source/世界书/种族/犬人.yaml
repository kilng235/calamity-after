# 犬人

## 基础信息

- 人口：约1700人（铃尾部落1200+城镇信使500）
- 降临：灾厄第四日，锈钉镇东南草原犬人部落被裂隙吞入
- 适应：★★★★★（信使网络融入最深）
- 寿命：80~120岁
- 生育率：中（与人类混血尚未出现，生理差异较大）
- 性别比例：男女约1:1

## 外观要点

- 身高1.6~1.8米，体态匀称偏瘦
- 第一特征：犬耳（可转动近270度，听觉范围极广）
- 第二特征：蓬松犬尾（情绪晴雨表，开心时快速摇动，紧张时夹紧）
- 犬齿略外露，鼻头灵敏，肤色偏赭红
- 民俗审美：犬耳与犬尾被认可为日漫审美萌点

## 历史要点

- 灾厄纪年5~30年信使挽救被困佣兵队
- 与矮人合作建立信使站，与精灵合作加密通讯术
- 铃尾部落主营地（锈钉镇东南草原）+ 城镇散居信使约500人
- 与兔耳族形成「爆发 vs 耐力」友好竞争
- 铃尾信使网络覆盖全废土，是当前最稳定的跨区通讯手段

## 独特机制（跑团接口）

- **专业维度**：敏捷系
- **种族特质**：嗅觉追踪+短程爆发相关检定获优势；信使任务相关检定获优势
- **典型能力**：铃声暗号（铃尾部落用铃声传远距信号，叙事锚点）；追迹记忆（一次嗅过的气味可追踪数日，叙事钩子）
- **惯用语**：铃声响起=消息/信件到达；尾巴不会说谎=诚实/真心；嗅出真相=发现隐藏事实

## 价目要点

- 信使费用：标准信件1银币/50km，紧急信件5银币/50km
- 嗅觉追踪任务：50金/次，危险区150金/次
- 雇佣犬人斥候随队：日薪2金币
- 铃尾信使长期合约：300金/月（覆盖全废土跨区通讯）

## 代表人物

- 莉娜·灰袍（漂泊者议会联络人，犬人，详见 NPC 条目）
- 薇拉·夜莺（漂泊者议会暗影指挥官，犬人，详见 NPC 条目）

## 谚语

> 「尾巴不会说谎，但人会让尾巴沉默。」

> 「铃声响起时，真相已上路。」