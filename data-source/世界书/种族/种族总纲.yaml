## 跨种族关系（速查）

| 关系类型 | 种族对 |
|----------|--------|
| 深度友好 | 羊人↔犬人、羊人↔兔耳族、兔耳族↔羊人 |
| 深度合作 | 猫人↔漂泊者议会（夜间探索）、犬人↔佣兵联盟（信使网络）、犬人↔漂泊者议会（搜救）、灵耳族↔旧日遗民（遗迹挖掘）、灵耳族↔深渊之子（废墟探索）、兔耳族↔佣兵联盟（斥候队） |
| 技术互补 | 矮人↔精灵（符文药剂）、矮人↔羊人（符文战羊）、矮人↔灵耳族（精密陷阱）、虎族↔佣兵联盟（雇佣）、猫人↔虎族（同科亲近）、精灵↔羊人（草药与银露治疗站） |
| 友好竞争 | 犬人↔虎族（嗅觉 vs 视觉）、犬人↔灵耳族（嗅觉 vs 听觉）、兔耳族↔犬人（爆发 vs 耐力） |
| 对立但理性 | 猫人↔犬人（天性对立，仍共处） |

## 技术融合产物

- **符文战羊**（500金币）：矮人护甲+羊人驯化+精灵祝福，山地载重150kg的披甲坐骑
- **银露治疗站**：精灵药剂师+人类医师+羊人草药师联合的综合医疗中心
- **深层探索套装**：矮人精工护甲+精灵暗视药剂+羊人绳索+人类弩机，深渊探索标配
- **铃尾信使网络**：犬人信使+矮人信使站+精灵加密术，覆盖全废土通讯
- **精密符文陷阱**：矮人符文+灵耳族精密机械，高级陷阱装置
- **废墟探索套装**：灵耳族听觉导航+犬人嗅觉追踪+矮人装甲，深层废墟标配

## 语言谚语（日常使用）

- 矮人：「卡兹隆」= 坚固/可靠；「多姆拉」= 地下/深层
- 羊人：「角碰角」= 公平交易/对决；「羊蹄轻」= 谨慎
- 犬人：「铃声响起」= 消息/信件到达；「尾巴不会说谎」= 诚实/真心；「嗅出真相」= 发现隐藏事实
- 灵耳族：「耳朵听到」= 获得情报；「藏起来」= 保密；「垃圾变宝藏」= 废物利用
- 兔耳族：「跳得高，看得远」= 眼光长远；「兔脚快」= 速度；「月兔舞」= 优雅灵活
- 猫人：「猫一样」= 敏捷/神秘；「夜猫子」= 夜间活动者；「猫步」= 无声行走
- 精灵：流线型藤蔓纹饰、「灰烬吟游」催生废土诗歌流派

