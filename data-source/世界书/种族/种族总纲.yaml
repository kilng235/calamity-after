# 种族总纲（八大异世界种族 + 人类）

## 位面融合：灾厄的隐藏真相

- 神明陨落同时打穿了位面壁障，灾厄第二至五日多个异世界种族被裂隙吞入此界
- **灾厄第二日**：一座矮人矿山城市被整体传送至地下裂谷
- **灾厄第三日**：一片精灵森林（约5公里直径）被移植到灰烬森林边缘，世界树已成焦黑枯木
- **灾厄第四日**：羊人部落（高山草原）、虎族游牧民（荒原）、犬人部落（锈钉镇东南草原）、兔耳族部落（灰烬森林边缘草原）、猫人族（旧王城废墟城墙）先后被裂隙吞入
- **灾厄第五日**：灵耳族的地下城被传送至旧王城废墟地下

## 人类与异族的关系演变

- 灾厄纪年1~10年：人类深陷灾厄创伤，异族被误认为「地下怪物/变异兽人」，冲突频发
- 灾厄纪年5~30年：矮人修复锈钉镇城墙、精灵治疗灰烬瘟疫、灵耳族救治患者、羊人向导救援商队、犬人信使挽救佣兵队，务实商人与佣兵开始雇佣异族
- 灾厄纪年30~50年：五大势力与异族建立正式合作，锈钉镇开「异族居住区」，跨种族贸易正常化，首批混血儿出生（约纪年40年）
- 灾厄纪年50年至今：完全融合，异族已是废土社会的日常部分；主要矛盾从「人类 vs 异族」转向「各势力利益冲突」
- 仅圣火骑士团部分保守派仍持偏见

## 生物学与社会态度

- 无生殖隔离，所有异族与人类可繁衍混血后代；当前总混血人口约3400人
- 异族外貌设计符合人类审美（深渊之子推测为位面壁障的「刻意引导」）
- 跨种族婚恋不再禁忌；混血儿被普遍视为「新时代的象征」
- 矮人对混血最保守（生育率低且文化保守）；犬人-人类混血尚未出现（生理差异较大）

## 种族特质（检定/跑团用）

> 各种族有对应**专业维度**的属性上浮（无名 NPC 按 NPC 生成规则取值时套用，有档案 NPC 按条目数值）。特质适用相关检定获优势（按通用检定 §3）。

| 种族 | 专业维度 | 种族特质 | 适用检定 |
|------|----------|----------|----------|
| 人类 | 魅力 | 适应力：社交/交易/领导任何情境不劣势 | 跨种族社交、跨势力交涉 |
| 矮人 | 力量 | 锻造之心：金属与矿石鉴定、护甲相关检定获优势；负重检定获优势 | 锻造、鉴定、负重、防御 |
| 精灵 | 智力 | 自然之眼：草本与魔法鉴定、暗视相关检定获优势 | 药剂、魔法、遗迹鉴定 |
| 羊人 | 力量 | 山地步兵：山地通行与攀爬相关检定获优势；体力检定获优势 | 攀爬、耐力、行军 |
| 虎族 | 力量 | 猎手：视觉追踪与近战搏斗检定获优势 | 狩猎、近战、追击 |
| 犬人 | 敏捷 | 嗅觉追踪与短程爆发相关检定获优势；信使任务相关检定获优势 | 追踪、信使、侦查 |
| 灵耳族 | 敏捷 | 耳语机巧：听觉定位与精密操作（开锁/陷阱/机关）检定获优势 | 潜行、开锁、陷阱、隐秘行动 |
| 兔耳族 | 力量 | 超级跳跃：跳跃、闪避、载重奔跑相关检定获优势；连跳距离与闪避时机相关检定获优势 | 跳跃、闪避、斥候侦查、运输 |
| 猫人 | 敏捷 | 夜目：夜间视觉与平衡相关检定获优势；猫步（无声行走）相关检定获优势 | 夜间行动、潜行、平衡 |

> 混血儿继承双方部分特质，相应检定获一半优势（按情境裁定）。

