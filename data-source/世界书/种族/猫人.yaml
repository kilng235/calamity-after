# 猫人

## 基础信息

- 人口：约2800人（旧王城废墟周边1000+其他据点800+城镇屋顶散居1000）
- 降临：灾厄第四日，旧王城废墟城墙猫人族被裂隙吞入
- 适应：★★★（夜间活动融入深，白天稀出）
- 寿命：90~130岁
- 生育率：中（与人类混血约200人，继承部分暗视与平衡感）
- 性别比例：女性60%，男性40%

## 外观要点

- 身高1.6~1.8米，体态纤细
- 第一特征：猫耳（可独立转动，外耳廓能动近180度）
- 第二特征：猫尾（约40~50cm，平衡与情绪表达）
- 竖瞳金/绿/蓝眼，夜间反光；脚掌肉垫，行走无声
- 民俗审美：猫耳猫尾与竖瞳被认可为神秘优雅

## 历史要点

- 与漂泊者议会形成战略盟友（夜间探索合作）
- 与虎族亲近（同为猫科）
- 与犬人相处保持距离
- 与灵耳族友好（猫捕小型啮兽本能在三百年的共存中已淡化）
- 与精灵有共同语言（精灵将重大决定编入藤结留存，猫人把重要时刻叼回一枚羽毛压在小盒里）
- 月光集会：每月满月回旧王城城墙顶聚会，月光浴+信息交流+歌舞

## 独特机制（跑团接口）

- **专业维度**：敏捷系
- **种族特质**：夜目（夜间视觉与平衡相关检定获优势）；猫步（无声行走相关检定获优势）
- **典型能力**：夜视（夜间/微光环境正常行动）；猫步（无声行走，叙事钩子）；夜感（察觉暗中危险，叙事锚点）
- **惯用语**：猫一样=敏捷/神秘；夜猫子=夜间活动者；猫步=无声行走

## 价目要点

- 夜间潜行向导：日薪3金币（夜间任务加50%）
- 情报掮客（情报搜集）：50金/次，按情报等级浮动
- 雇佣猫人斥候随队（仅限夜战/夜潜任务）：日薪3金币
- 猫族制品（皮毛/皮件自用为主）：流通少，多以服务费形式结算
- 屋顶驿站住宿：5银币/晚（仅猫人客栈，月光集散地）

## 代表人物

- 薇拉·夜莺（漂泊者议会暗影指挥官，猫人，详见 NPC 条目）

## 谚语

> 「夜里的猫，听得见月光落地。」

> 「九命不是用来冒险的，是用来等的。」