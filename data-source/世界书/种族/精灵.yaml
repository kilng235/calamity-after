# 精灵

## 基础信息

- 人口：约1620人（银叶营地1200+城镇散居120+流浪精灵300）
- 降临：灾厄第三日，一片精灵森林（约5公里直径）被移植到灰烬森林边缘，世界树已成焦黑枯木
- 适应：★★★★（医疗/艺术融入深，保守派有冲突）
- 寿命：500~800岁
- 生育率：低（与人类混血约180人，混血儿寿命250岁左右）
- 主流派系：保守派（拒绝混血/反对融合加速）vs 改革派（接纳与合作）

## 外观要点

- 身高1.6~1.8米，身形修长
- 第一特征：尖耳（耳长约15~20cm，人类视为异国情调）
- 第二特征：灰褐肤色（灾厄后遗，灾厄前为浅金色）
- 银叶营地精灵仍保有森林装扮；城镇精灵着素色长袍

## 历史要点

- 灾厄纪年5~30年治疗灰烬瘟疫，证明善意，被人类接纳
- 世界树焦死后精灵发展出「重生哲学」：承认失去，将技艺根植新土地
- 与矮人合作符文药剂，与羊人合作银露治疗站
- 纹饰风格（流线型藤蔓图案）现为人类武器装饰新潮流

## 独特机制（跑团接口）

- **专业维度**：智力系
- **种族特质**：自然之眼（草本/魔法鉴定+暗视相关检定获优势）
- **典型能力**：银叶记忆（对灾厄前精灵世界保留口述历史，传承给下一代聆听者）
- **惯用语**：以「叶落归根」表示死亡；「长影」表示时光流逝

## 价目要点

- 治疗药水：2金币；银叶药剂：5金币（疗伤+4~6小时体力回复）
- 暗视药剂：3金币（夜视4小时）
- 银露治疗站诊费：草药师5银币/次，精灵医师2金币/次
- 符文药剂定制：30~150金币
- 雇佣精灵医师随队：日薪3~4金币

## 代表人物

- 艾拉·棘藤（灰烬森林隐士，精灵，详见 NPC 条目）
- 杜兰·碎星（流浪炼金术士，与精灵符文学派有交集，详见 NPC 条目）

## 谚语

> 「叶落不归空，树长向光。」

> 「听风的人最先听到悲伤。」