# 矮人

## 基础信息

- 人口：约1800人（铁根大厅1200+锈钉镇铁匠区600）
- 降临：灾厄第二日，整座矿山城市被传送至地下裂谷
- 适应：★★★★★（技术融入最深）
- 寿命：250~350岁
- 生育率：低（文化保守，对跨种族婚育不反对但不鼓励）
- 与人类混血：极罕见，不超过20人

## 外观要点

- 身高1.3~1.5米，身材匀称粗犷
- 第一特征：浓密胡须（被视为魅力，编辫或盘结）
- 第二特征：厚实手掌与宽肩膀，肌肉线条明显
- 肤色偏古铜，眼窝深邃；耳廓圆润，无尖耳

## 历史要点

- 灾厄纪年5~30年帮助修复锈钉镇城墙，技术实力获承认
- 铁根大厅（地下裂谷）仍是矮人主城，城内为锻造车间+家族洞府
- 与精灵合作符文药剂，与羊人合作符文战羊，与灵耳族合作精密陷阱
- 种族内工匠行会等级森严：学徒→匠师→宗师（认证后才有资格承接高阶精工订单）

## 独特机制（跑团接口）

- **专业维度**：力量系
- **种族特质**：锻造之心（金属/矿石鉴定+护甲相关检定获优势；负重检定获优势）
- **典型能力**：矿脉直觉（在矿点附近感知矿石品质，无机械效果，叙事锚点）
- **惯用语**：卡兹隆=坚固/可靠；多姆拉=地下/深层

## 价目要点

- 符文战羊：500金币（与羊人联合产品）
- 精工护甲定制：150~800金币（按工艺等级）
- 矿镐：3金币；精铁锭基准价40金币/公斤
- 矮人工匠代锻：按材料成本×1.5+加工费
- 雇佣铁匠随队：日薪2~3金币

## 代表人物

- 凯尔·拾灰者（旧日遗民首领，矮人，详见 NPC 条目）
- 杜兰·碎星（流浪炼金术士，犬人，详见 NPC 条目）

## 谚语

> 「卡兹隆的承诺不写在纸上，写在铁上。」

> 「石头不说话，但石头不撒谎。」