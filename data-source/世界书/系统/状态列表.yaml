# 状态列表（状态效果总表）

## 通用规则

- 状态不叠加：同名状态只有「有/无」两种情况；唯一例外是力竭（可分 1~3 级叠层）
- **主角状态的获得与解除必须经 `<命令>` 区落地**：获得 `set 状态.{状态名} = true`（带来源/层级时 `set 状态.中毒 = {"来源":"狼咬"}`、`set 状态.力竭.层级 = 2`）；解除 `delete 状态.{状态名}`。仅主角状态入命令区；敌人状态由 battle 卡状态栏呈现，不入命令区
- 状态赋予的优势/劣势按「通用检定 §3」掷二取一执行（各耗两枚骰子池骰子）；「自动失败」的检定直接失败，不掷骰
- 状态来源标注于产生它的武器词缀、法术（按「法术总纲」各法术效果）或环境；多重状态并存时各自独立生效（优劣相抵按通用检定 §3处理）
- 不做每回合数值记账：状态的存在与解除由叙事和下表裁定；敌人当前状态显示于 `<battle>` 标签内对应角色回合块的状态栏
- 主角的持久状态（如力竭层次、失明）随剧情如实延续，不凭空消失，也不无限拖延剧情

## 负面状态表

| 状态 | 效果 | 解除 |
|------|------|------|
| 目盲 | 需视觉的检定自动失败；自身命中与行动检定劣势，敌方对其命中检定优势 | 恢复视力 |
| 耳聋 | 需听觉的检定自动失败；社交类检定劣势 | 恢复听力 |
| 失能 | 无法行动（跳过其行动轮），无法言语与施法 | 来源结束 |
| 昏迷 | 失能且倒地；对昏迷者的近战命中视为大成功（伤害骰×2） | 受击或被摇晃后掷检定苏醒 |
| 麻痹 | 失能且无法移动；敌方对其命中检定优势 | 来源结束 |
| 震慑 | 失能约一回合；敌方对其命中检定优势（规范名「震慑」，命令写 `set 状态.震慑`；旧写法「击晕」仅叙事描述） | 时效自然结束 |
| 石化 | 失能且无法移动，躯体如雕像；受到的伤害减半 | 解石化手段（火焰/物理破坏/移除诅咒） |
| 中毒 | 自身所有检定劣势 | 时效过去或服用解毒剂 |
| 恐慌 | 恐惧源在视线内时自身全部检定劣势；无法主动靠近恐惧源 | 脱离视线，或掷检定克服 |
| 魅惑 | 无法伤害或敌视魅惑源；魅惑源对其魅力类检定优势 | 魅惑源受伤害，或时效结束 |
| 受擒 | 无法移动；对擒抱者以外的目标检定劣势 | 对抗力量检定挣脱，或擒抱者倒下 |
| 束缚 | 无法移动；自身检定劣势，敌方对其命中检定优势 | 割断/破坏束缚物，或掷检定挣脱 |
| 倒地 | 自身检定劣势；近战对其优势、远程对其劣势 | 用一次机会行动起身 |
| 力竭 | 唯一可叠层：1~3 级，每级所有检定总值 −1（计入检定公式）；满 3 级陷入昏迷 | 每游戏日完整休息 −1 级 |
| 燃烧 | 每轮末从骰子池取一枚 d6 作伤害，直至扑灭；战斗外按叙事弱化 | 用主行动扑灭，或环境熄灭 |
| 出血 | 每轮末从骰子池取一枚 d4 作伤害，直至包扎；战斗外按叙事弱化 | 用主行动包扎 |
| 残废 | 对应肢体动作检定劣势（持握/移动/攀爬/奔跑等） | 战斗外治疗或完整休息后恢复，重伤情由叙事裁定 |
| 失衡 | 防御失稳：对该目标的下一次攻击检定获优势 | 被命中后移除，或回合结束自行恢复 |
| 减速 | 移动/闪避/先攻检定劣势 | 来源结束或时效自然结束 |
| 侵蚀 | 护甲 AC 加成 −1（可叠 2 层，每层 −1） | 战斗结束恢复 |
| 寒冷 | 每轮末从骰子池取一枚 d4 作伤害；遇水/湿环境升级为「麻痹」 | 脱离寒冷来源或取暖 |
| 感电 | 敏捷相关检定劣势；遇水/湿环境升级为「麻痹」 | 时效自然结束（约一回合） |
| 超重 | 引擎派生状态（总重 > 负重上限 10+力量×2 时自动落地，极端超重 2 层）；**勿用命令增删**，卸载物品自动解除；力量相关检定劣势 | 卸载物品后引擎自动解除 |

## 有利状态表

| 状态 | 效果 | 结束 |
|------|------|------|
| 隐形 | 敌方对其命中检定劣势；其命中与潜行检定优势 | 发动攻击后显形，或时效结束 |
| 加速 | 移动/闪避/先攻检定优势；免疫「减速」 | 时效结束，或被「减速」抵消 |
| 耀眼 | 魅力/社交类检定优势 | 离开对应场景 |
| 灵巧 | 巧手/开锁/精密操作类检定优势 | 离开对应场景 |
| 专注 | 对应领域检定优势；免疫「恐慌」的检定劣势 | 离开对应场景或时效结束 |
| 护体 | 所受劈砍/穿刺/钝击伤害减半（向下取整） | 1 轮后自动结束 |

## 元素交互（状态与环境的转化）

- **水熄**：燃烧目标进入水域或被水系攻击命中 → 燃烧立即解除
- **毒燃**：火焰命中中毒目标 → 中毒解除并转为「燃烧」（毒雾引燃）
- **寒凝**：寒冷目标处于水/湿环境再受攻击或寒冷 → 升级为「麻痹」（冻僵）
- **电涌**：感电目标处于水/湿环境 → 升级为「麻痹」（电流贯通）
- **寒火互克**：寒冷命中燃烧目标 → 燃烧解除转为「寒冷」；火焰命中寒冷目标 → 寒冷解除
- **速滞互消**：「加速」与「减速」同时存在时两者立即同时移除

## 判定提示

- 赋予状态的命中（淬毒刃、锋锐刃、点燃法术、击晕锤击等）同一命中只附加一种状态，由叙事择最贴切者
- 解除条件不明确时，从宽按一轮战斗或一个场景裁定结束；宁可早解，不拖死剧情
