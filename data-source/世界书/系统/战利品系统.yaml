# 战利品系统（DND 跑团 + 现状接口衔接）

> 投骰体系（1-10 折半/11-20 全获）、品相判定（1-7/8-15/16-20）、容器搜刮三层 d20（状态/侦察/丰度）等掷骰映射的权威源为「战利品检定」条目；d20 骰子来源按「通用检定 §0 场景调度表 + §6 骰子来源」执行。本条目只写稀有度、产出格式、收购与流程，不重抄掷骰范围。

## 通用规则

- 击败生物后战利品记入背包，经验按「生物总纲」危险等级表发放；各生物掉落材料以对应条目「战利品与材料」为准
- 材料价格以「世界观-经济」为权威源，本系统不报价

## 稀有度五档

- 普通（白）/ 罕见（绿）/ 稀有（蓝）/ 史诗（紫）/ 传说（橙）
- 按生物危险等级软映射：低=普通 / 中=普通+偶发罕见 / 中高=罕见+稀有种 / 高=稀有+偶发史诗 / 极高=史诗+传说契约物
- 实际物品稀有度由各生物条目「战利品与材料」节标注（DND 标色仅作呈现辅助，不进入计算）

## 量化产出

- 生物条目「战利品与材料」节统一三字段格式：`物品名（数量骰面，如 1d4 / 2d6+1 / 50% 概率/1）/ 用途 / 收购价（按「世界观-经济」零售价或「矿物与材料总纲」定价）`
- 现有 22 个生物条目保持现状可逐步迁移，新条目按此格式写

## 势力收购

- 五大势力差异化收购（对齐「关系系统」声望映射；按势力声望档位判断是否接触）：

| 势力 | 专长 | 倍率 |
|------|------|------|
| 深渊之子 | 灾厄遗物、异常材料、空间扭曲产物 | ×3 |
| 旧日遗民 | 灾厄前文物、古币、完好器具 | ×2.5 |
| 圣火骑士团 | 军用物资、变异样本 | 基准 |
| 漂泊者议会 | 药品、护符、救伤类材料 | ×1.2 |
| 自由佣兵联盟 | 各类杂物 | 基准 |

- 势力收购需对应声望档位（崇敬/友善才有专门收购途径，仇视/死敌拒收）
- 公共收购走世界城锈钉镇（基准倍率为「按零售价×50%」）

## 法术载体（书籍/卷轴入战利品）

> 施法者 NPC / 法术遗物 / 灾厄前遗迹搜刮可产出法术载体。价格与习得规则见「法术总纲」第七节，此处只规定投骰范围。

- **施法者 NPC 掉落**：击杀后 d20：1-10 无 / 11-15 卷轴（1~2 级，按学派随机） / 16-19 法术书（1~2 级） / 20 法术书（3 级）
- **灾厄前遗迹搜刮**（容器 d20 稀有/独特档）：法术书（按区域学派倾向）或卷轴（1~3 级）
- **卷轴**：一次性载体（读后消失），不需研读检定（施法检定见「施法检定」条目）
- **法术书**：永久载体，需智力 ≥ 书籍品级 + 研读检定（见「法术总纲」第七节）
- 习得法术计入主角表 `spell_count`（INSERT +1，升级不变），不入 `skill_annual_count`（法术不设年度限制）

## 任务凭证

- 猎杀类任务：完成凭证=战利品本身（残骸/器官/鳞片/腺体）
- 侦察/寻物类：书面报告或指定物品本身
- 救援类：被救对象签名或遗体标记
- 按市价结算型任务走「势力收购」或「公共收购」节，高危/灾厄级任务凭证需品相完好以上

## 隐藏掉落骰（中高/高/极高·生物类）

> 额外随机层，增强战利品惊喜与风险。从「骰子池」d20 取用，**仅生物类战利品、且生物威胁为 中高/高/极高** 时掷一次；低/中威胁、施法者遗物（见上「法术载体」d20）与容器搜刮（走「战利品检定·容器搜刮」三层）不掷此骰。

| d20 | 分支 | 效果 |
|-----|------|------|
| 1 | 危险陷阱 | 战利品掺有陷阱/被污染/是诱饵 → 触发一次感知 vs DC 对抗（走「通用检定 §1」）；失败计陷阱伤害或污染 |
| 2~17 | 正常 | 按既有投骰与品相结算 |
| 18~19 | 额外掉落 | 追加 1 件同位额外材料（覆盖生物条目 50% 概率项的落空）|
| 20 | 珍稀发现 | 稀有度上浮一档（罕见→稀有等，上限传说），并附带一条剧情钩子/线索 |

- 隐藏骰发生在投骰之后、记入背包之前；分支结果不影响品相 d20 与质量附加 d6
- 大失败（1）非凭空惩罚：仍给感知对抗机会，符合「客观公正」条款
- 大成功（20）引导叙事钩子而非纯数值膨胀

## 拾取流程

- 战后自动结算：经验写主角表、金币与收购到背包表（按「背包系统」槽位与重量）
- 玩家主动搜刮：机会行动（不强制 AP 计数），按「背包系统」规则拾取与整理
- 首领级（高/极高威胁）必掉契约物/传承装备：自动入账，备注剧情钩子

