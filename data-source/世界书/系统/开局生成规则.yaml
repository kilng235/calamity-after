# 开局生成规则

## 触发时机

- 玩家发送【登记档案】后：先按主角表建档（row_id=1 唯一一行，六维/姓名/种族/身份/特质按档案填写，区域「佣兵镇·锈钉」，时间「300年 11月12日 07:10」，金币 15，HP 100/100，命运点 1，等级 1），随即生成开局叙事作为第一幕
- 玩家未填档案直接开场：引导其完成登记，或先以默认值（人类佣兵/全 10 六维）开场，等待玩家补登

## 固定锚点

- 时间：300年 11月12日 07:10（清晨）
- 地点：佣兵镇·锈钉，佣兵公会大厅（主街尽头）
- 初始状态：金币 15，铁剑（主手，耐久 80/80），HP 100/100，命运点 1；AC 与负重按六维派生
- 初始委托：灰烬森林材料狩猎（佣兵公会发布，时限 3 天，按市价结算加公会声望+5，佣金抽 10%）

## 统一场景流程

1. 清晨感官：铁匠铺锤声、镇外灰烬雾、铁锈与隔夜麦酒味（按玩家种族/身份微调细节）
2. 佣兵公会大厅：接待员登记寒暄，按身份调整称呼与对话细节，简短带出主角档案
3. 委托板：接取灰烬森林材料狩猎，按任务模板完整呈现（名称/类型/发布者/目标区域/描述/凭证/时限/奖励/备注）
4. 出城方向：可含整备/集市片段，不强制
5. 收束：命运感收尾，开放式（接下来往哪走由玩家决定）

## 身份差异化（统一场景内）

| 身份 | 开场细节 |
|------|----------|
| 佣兵 | 来公会报到登记，接待员递上登记表 |
| 拾荒者 | 顺路兑战利品，顺手接单 |
| 学者 | 雇向导查资料，接单作野外保障 |
| 猎人 | 卖猎物顺带问行情，接单 |
| 商贩 | 谈供货押运，接单 |
| 工匠 | 交订单修装备，接单 |
| 医师 | 收药材卖药剂，接单 |

## 主线钩子与可选支线

- 告示板角落泛黄旧单「老维特失踪」（墨迹洇开、铁钉生锈，赏金待定）：无时限，玩家主动询问才展开，不主动推进不剧透
- 出城沿途可选事件（求救马车、拾荒者痕迹、迷路的商队，三选一随机）：玩家忽略即不展开，不强制
- 初始委托为主轴，钩子与支线一律等待玩家选择

## 叙事要求

- 第二人称「你」，第三人称冷峻叙事，废土西幻文风（感官细节、破损美学、灰烬意象）
- 开局叙事 200~400 字；孤身开局，无固定伙伴
- 不剧透主线，不强制推进支线，不代玩家做决定
- 结尾开放式，落点在「接下来」的选择感上

## 示范开局（风格参考，以佣兵身份为例）

锈钉镇的清晨比想象中醒得早。天还没全亮，铁匠铺的锤声就隔着两条街传过来，一下一下，像给整座镇子敲着起床的鼓点。你裹着旧斗篷穿过主街，灰烬雾还没散，空气里混着铁锈、隔夜麦酒和木柴烧过的味道。三百年了，这座镇子就这样醒过来，日复一日。

佣兵公会在主街尽头，门脸不大，一块铁牌歪歪斜斜钉在门框上，写着「自由佣兵联盟」几个褪色的字。推门进去，炭火盆的暖意扑面而来，大厅里已经坐了三两拨人。柜台后一个矮人女人抬起头，把登记簿推过来，蘸了墨的羽毛笔搁在一边：「新面孔。名字、种族、特质，自己填，填完盖手印。」

你填完表，她扫了一眼，从柜台下抽出一张皱巴巴的纸：「正好，昨晚上新贴的。灰烬森林材料狩猎，灰烬狼皮三张，焦木蜥鳞片两片，三天限期，按市价收。狼皮一张三金，鳞片一片五金，公会抽一成。接不接？」

告示板的角落里，还钉着一张边角泛黄的旧单子，墨迹被潮气洇开大半，只隐约能认出几个字：老维特，失踪，赏金待定。铁钉已经生锈，像是钉在那里很久了。

你把材料狩猎的单子从木钉上取下来，卷好，塞进斗篷内袋。出城时铁匠铺门口的矮人铁匠看了一眼你腰间的铁剑，咧嘴一笑：「新来的吧，第一单活？」你没答话，他也不再问，回身继续敲他的铁。镇门口的老守门人叼着烟斗，扫过你的登记凭证，摆摆手：「灰烬森林别往深了走，天黑前回来。」

公会大门在你身后合上，灰烬雾正从镇外漫进来。灰烬森林的方向，天边泛着一层灰白。

接下来，往哪走，是你自己的事了。

