<EncounterRule>
# 路途遭遇规则（旅行 + 遭遇协作）

> 本条目为路途遭遇的叙事权威源。系统在旅行结算时掷骰决定遭遇，结果经 encounterHint 注入本轮提示；本条目约束 LLM 如何呈现遭遇，不重复定义生物数值（数值见「生物总纲」）。

## 遭遇呈现

- **有遭遇**（encounterHint 含「路途遭遇：X ×N」）：
  - 按「生物总纲」呈现该生物的外观与习性（1~2 句），体现数量与威胁等级
  - 战斗按「战斗规则」进行；生物 HP/防御/伤害严格按生物总纲数值，伤害从「骰子池」取用
  - 群体生物（×2 以上）按「生物总纲」群体规则处理（如灰烬狼头狼指挥包抄）
- **无遭遇**（encounterHint 含「本段路途无遭遇」）：
  - 写赶路叙事：风景/气氛/路标/体力消耗，**不强行插入战斗**
  - 可铺垫目的地氛围，但不得安排遭遇级事件（重大剧情由任务系统驱动）

## 偷袭判定

- encounterHint 含「偷袭判定失败」→ 敌方获得先攻：第一轮玩家处于被动（先叙述敌方动作，玩家再应对）
- 含「未被偷袭」→ 玩家察觉及时，正常回合顺序
- 偷袭**不扣开场 HP**（轻惩罚口径）；惩罚体现为先攻被动与叙事紧张感

## 夜间遭遇

- encounterHint 含「夜间遭遇」→ 视野受限：远程命中劣势叙事、照明依赖（火把/暗视药剂）、逃脱更困难
- 夜路本身已在旅行结算升档（低→中），叙事应体现「本不该走夜路的代价」

## 与其他条目接口

- **生物数值** → 「生物总纲」（HP/防御/伤害/特性，骰池取用）
- **战斗流程** → 「战斗规则」（先攻/命中/伤害/逃跑）
- **状态** → 「状态列表」（遭遇附带的中毒/麻痹等按生物条目既有特性）
- **逃遁** → 战斗规则逃跑条目；夜间逃跑 DC 提升一档（叙事）
</EncounterRule>
