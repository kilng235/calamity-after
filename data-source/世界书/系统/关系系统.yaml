# 系统模块: 关系系统

**描述:** 定义 NPC 好感度、人情值与势力声望，及三者的联动结算

---

## 通用规则

- 双轴双轨：好感度（NPC 对主角的长期感情，-100~100）与人情值（NPC 对主角的短期亏欠，0~100）记在个人名下；声望（势力对主角的集体态度，-100~100）记在势力名下；三者只在明确事件结算时变动，不做逐轮记账
- 好感度需要长期培养，上升和下降都缓慢滞后：即使被救下性命，也不会立刻喜欢上对方；档位仅作参考，具体态度以角色性格为准，高好感不等于卑躬屈膝
- 人情值易被大事件推动，还清人情或把柄消除后大幅回落；人情不等于好感，被要挟者完全可以负好感高人情
- 魅力修正：好感度上升结算时额外加主角魅力调整值（(魅力−10)/2，魅力10 无修正、14 则 +2、6 则 -2）；好感度下降与人情值、声望不受此修正
- 变动以剧情事件为唯一依据，变动量随 `<relation>` 标签输出

## NPC 好感度（五档）

| 档位 | 区间 | 社交检定 DC | 行为基调 |
|------|------|------------|----------|
| 挚友 | 71~100 | 10 | 托付秘密，主动援助，可提过分请求而不翻脸 |
| 友好 | 21~70 | 10 | 私下通融，分享非关键情报，愿意花时间 |
| 中立 | -20~20 | 15 | 公事公办，按规矩办事，不冷不热 |
| 冷淡 | -21~-70 | 20 | 敷衍应付，拒绝非义务请求，能少接触就少接触 |
| 敌对 | -71~-100 | 20，且多数请求直接拒绝 | 敌意相向，有机会就使绊 |

- 对 NPC 的说服、交易、请求类魅力检定，按其档位取 DC（对接「通用检定 §2」三档难度）；双方意图拉扯的场合仍用对抗检定
- 正式 NPC 条目的「对主角态度」节按此五档写行为差异，档位切换以结算后的数值为准

## 社交判定分流表（路由唯一权威源）

> 所有面向 NPC 的社交动作，先查本表定判定类型，再按对应小节取规则。三分类路由收口于此，避免"该走对抗还是档位 DC"的歧义。

| 社交动作类型 | 判定类型 | 取法/公式 | 判断口诀 |
|-------------|---------|----------|----------|
| 单向请求 / 说服 / 求帮助 | 魅力检定（档位 DC） | `d20 + 魅力调整值（可 +PB）` vs 对方好感档 DC（五档表） | 对方只"点头或拒绝" → 档位 DC |
| 意图拉扯 / 谈判 / 讨价还价 | 对抗检定（§5） | 双方各掷 `d20 + 魅力调整值`，总值高者占优，平局发起者胜 | 双方都在"争同一件事" → 对抗 |
| 闲聊 / 套话 / 纯信息交换 | 免检定 | 自然演绎（按「通用检定 §1」例外） | 无利害冲突 → 免检定 |

**边缘场景裁决（交易/议价拆分）：**

- **按价标买**（明码标价、正常交易）→ 不走检定，按「世界观-经济」价格成交
- **砍价 / 讲价**（双方拉扯报价）→ 对抗检定（双方各掷 `d20 + 魅力调整值`），高者占优
- **赊账 / 请通融 / 基于好感降价**（一方让步）→ 单向请求，魅力检定 vs 好评档 DC
- **首次接触性质不清** → 默认按档位 DC 处理；仅当双方明确在同一目标上拉扯时才转对抗

**免检定提示：** 简单寒暄、确认对方早已答应的约定、询问毫无风险的情报，无需掷骰（按「通用检定 §1」例外）；对话是否推进情节由叙事判定，不以"必须掷骰"为推进条件。

## 人情值（四档）

| 区间 | 可以期待的事 |
|------|--------------|
| 0~30 | 借一小笔钱，或在尴尬场合帮忙解围 |
| 31~60 | 为主角利益适度越线，对过分要求睁一只眼闭一只眼 |
| 61~90 | 用大半身家作保，主角被围攻时冒险相救 |
| 91~100 | 为主角涉命冒险，执行高危任务不求回报 |

- 人情还清或把柄消除后回落至 0~10；忘恩负义之徒可以欠着不还，具体以性格为准

## 势力声望（五档）

| 等级 | 区间 | 势力待遇 |
|------|------|----------|
| 死敌 | -100~-76 | 通缉追杀，势力地界内被敌意对待 |
| 仇视 | -75~-26 | 拒绝交易与委托，任何服务请求 DC20 |
| 中立 | -25~24 | 正常交易（按「世界观-经济」基准价） |
| 友善 | 25~74 | 分享情报，委托优先，服务类请求 DC15 |
| 崇敬 | 75~100 | 特殊权限：据点出入、高阶委托、可请求协助，加入途径优待 |

- 声望只代表集体态度，不等于地位与职务；升降锚点参照各势力条目「跑团接口」

## 联动规则

- 初见定调：初遇某势力所属 NPC，其初始好感按该势力声望映射（崇敬 +15 / 友善 +5 / 中立 0 / 仇视 -15 / 死敌 -40），再按相遇处境上下浮动 5 以内；无所属势力的 NPC 初始 0
- 无名 NPC 不入关系表：其态度直接按所属势力声望档位演绎（数值基准按「NPC生成规则」）
- 行为归口：私下交往只动个人好感；以公开身份做出或影响势力利益的行为动声望（幅度参照势力条目升降锚点）；重大功过双轨并动，如救下骑士团团长：好感 +15~30，声望 +5~15
- 首领传导：对势力首领（马库斯/维克多/塞壬/凯尔/漂泊长）单次好感变动达 ±10 时，该势力声望同向变动 ±2~5

## 数值增减范例（仅供参考，严禁照搬，以剧情与性格为准）

- 战斗中不顾自身安危救下对方性命：好感 +15~30，人情 +50~100
- 如约完成对方委托且配合良好：好感 +5~15
- 对方苦恼时予以安慰或指引：好感 +5~15
- 送出对方心仪的礼物：好感 +5~10，人情 +5~15
- 替对方在尴尬场合解围：好感 +10~20，人情 +10~30
- 发现对方身败名裂的秘密，却选择替其掩下：好感 +30~50，人情 +40~70
- 为对方在交易中争取到实利：人情 +5~50
- 侮辱对方坚持的信念或人格：好感 -5~-10
- 欺骗对方善意并被发现：好感 -3~-8
- 危急时刻恶意抛弃对方：好感 -10~-30

## 关系变动输出格式

`<relation>` 标签的字面格式与字段说明见「输出规范-关系」条目；本关系条目只讲五档机制与升降规则，不重抄排版。变化规则严格参照本条目上方各节。

