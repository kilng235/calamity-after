## 工艺改装件

- 给已有装备加装可更换的工艺部件；每条改装件三字段：`[效果][价格/自装DC][应用装备]`
- **改造槽位**：每件武器 2 个改装槽、每件护甲 2 个改装槽；槽位是上限，「禁止混装」（同类效果取一）是槽内约束，两者叠加生效
- **与词缀的关系**：两者可共存（如「精铁·锋锐·铁剑」+ 锐刃打磨，数值效果来自改装件，词缀只出状态）
- **安装方式**：铁匠代工安装（按「铁匠代工」价格基准），或自装（锻造检定 vs DC：按改装件复杂度取 10/15/20；失败不毁装备，改装件材料消耗）
- **拆卸**：自拆走 DC10 锻造检定，失败则该改装件损毁（武器完好）；铁匠代拆保成功，工费 1 金/件
- **背包接口**：已安装的改装件不占槽（并入武器）；备用未装的改装件占背包 1 槽；弹药无改装槽；双持时主副手武器各算各的 2 槽

