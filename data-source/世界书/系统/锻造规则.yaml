# 锻造规则（DND 制作玩法，一次检定定成败）

## 工匠工具机制（DND 5e）

- 锻造需持对应工匠工具，否则徒手做基础件有劣势：

| 工具 | 用途 | 对应属性 | 价格来源 |
|------|------|----------|----------|
| 铁匠工具 | 钝器/护甲/重型武器/匕首等精细锻造 | 力量（精细细工可智力） | 世界观-经济 |
| 炼金工具 | 药剂、法杖、施法媒介 | 智力 | 世界观-经济 |

- 持工具优势/徒手劣势与检定细则见「锻造检定·工具优劣」
- 工具占背包 1 槽（按「背包系统·物品分类」）；工具可借用铁匠铺（借铺费按「铁匠代工」基准价）；工具价格按「世界观-经济」取用

## 核心检定

> 检定公式（力量/智力分工）、DC 三档材料映射（一阶10/二阶15/三阶20）、优势合并（种族特质+工具+工坊）、骰子来源的权威源为「锻造检定」条目；d20 检定公式、优势/劣势合并、大成功/大失败后果按「通用检定 §0 场景调度表 + §1~§7」执行，本节不重抄。

> 材料 → 价格 / 作用映射见「矿物与材料总纲」；本规则只规定锻造 DC 分级与材料成本口径，不重复定义材料价格与产地。

## 材料成本

- 自锻原材料 = 成品基准价 ÷2（示例：铁剑 15→7.5 金，锁甲 70→35 金，匕首 3→1.5 金）
- 稀有/传说材料按「世界观-经济·收购与任务」零售价另计，不套 ÷2
- 代工价按「铁匠代工」表百分比浮动（基准价为基础）

## 词缀规则（v2 随机词条）

- **词条数 = 装备品质**（普通 1 / 罕见 2 / 稀有 2 / 史诗 3 / 传说 3；详见「词缀表」）
- **生成流程**：锻造 DC 检定成功后，AI 按材料主题倾向从对应词条池抽 N 个**不重复状态**→自由起 2~4 字废土冷峻风叙事名→写 1~2 句叙事→标注状态效果
- **成果分级**：成功按富余值（总值−DC）分档，只换词条池不换词条数；阈值与词条池见「锻造检定·成果分级」「词缀表·品质分级池」
- **过程事件**：抽词前掷 d20 定过程变化，只改词条数量不改品质档；细则见「锻造检定·过程事件」
- **词条强度骰**：每词条抽定后掷 d10 定强度；强度只量化状态自身强度、**不引入独立伤害数值层**（附加伤害数值仍归「§工艺改装件」），且强度档**不记入机械名**（命名仍按「§装备命名规则」）；分布与细则见「词缀表·词条强度骰」
- **机制效果**：一律以状态表达（效果唯一：一词条一状态，硬约束见「词缀表」）；状态效果/解除按「状态列表」
- **大失败（d20=1）**：词条失效（叙事化处理：锻造瑕疵）；详见下方「失败后果与瑕疵词缀」

> 词条与工艺改装件可共存（按「§工艺改装件」）；AI 词条生成 CoT 详见「词缀表」。

## 失败后果与瑕疵词缀

- **失败装备仍可用**：材料部分消耗（叙事化，按材料类型浮动），装备可继续穿戴或出售，但叙事描写带瑕疵
- **瑕疵词缀示例**：卷刃（攻击叙事描写有迟滞感）、错缝（护甲穿戴感不佳）、重量偏沉（力量相关检定劣势）、金属疲劳（耐久下降）
- **修复**：再次锻造检定可修复瑕疵（按原 DC +2）；天然词缀保持不变
- **二次失败**：连续两次失败的装备视为「不可靠装备」，出售价减半

