### 改装限制

- **禁止混装**：同类效果改装件不叠加，同类取一：「伤害骰档位调整」组（锐刃打磨/弓弦强化/配重锤头/锻打矛尖/弩臂强化/短柄改造）；「射程增幅」组（配重调整管投掷/角木复合弓臂管弓，按应用自然分开）；「检定优势」类（弩机校准/铆钉加固/握柄改造的先攻优势）；「护甲耐久」类（镫铁镀层/皮革补强）
- **自查合理性**：按中世纪锻造工艺与装备形态自查（法杖不能装锐刃、弓不能装镫铁镀层、皮甲不能装镫铁镀层）
- **不超废土世界科技水平**：禁现代科技部件（电池/电路板/塑料/合成橡胶/燃油引擎/火药武器/望远镜/钟表齿轮等），保留符文与中世纪工艺；星铁可替代电气但不引入电子概念
- **效果数值**：
  - 伤害骰 +1 档上限 1d12
  - 耐久上限调整计入装备耐久
  - 检定优势按「通用检定 §3·优势/劣势」
  - **平衡注记**：极值口径：战锤+配重锤头+淬火重锋+瞄准核心+天然 20 时骰面倍率最高 ×4.5，受双门槛（天然 20 + 瞄准 −4）锁定触发率，视为史诗时刻上限不另设硬顶；火油浸刃与词缀「火焰」边界：火油是命中即附加伤害打完即止，词缀是挂「燃烧」状态每轮持续

## 材料加成公式

> 武器伤害按材料档位自动加成，玩家在单文件「基础数值·材料加成公式」表可直接查到 4 档潜力。
> **新造与换材料**共用同一套公式与检定（DC 按材料档）。新造=选材料锻造；换材料=对已有装备走相同流程。

- **公式结构**：每个武器有「铁→精铁→秘银→灾厄」4 档材料伤害公式（1dX 或 1dX+Y）
- **新造/换材料统一检定**：选材料 → 走锻造检定（DC 10/15/20）→ 装备按对应公式生效；失败=消耗材料不毁装备；大失败=留瑕疵
- **材料加成与词缀独立**：公式决定伤害骰（例：1d4+1），词缀挂状态伤害（例：出血 d4/轮末）。两者不叠加计算
- **灾厄金属（黑曜铁/血晶石/星铁）**：需势力授权或特定 NPC 代工（与「铁匠代工」表配合）
- **耐久上限不随材料变化**：每件装备耐久上限固定（按单文件）；材料仅影响伤害公式

### 护甲材料加成公式

护甲与武器共用 4 档材料表（铁/精铁/秘银/灾厄），但**加成方向不同**：护甲加 AC（防御值），武器加伤害。

| 护甲类型 | 一阶 | 二阶 | 三阶 | 灾厄 | 升档上限 |
|---------|------|------|------|------|---------|
| **重型**（板甲/锁甲）| 基础 | +1 | +2 | +3 | +9 |
| **中型**（皮甲/头盔/全罩盔/盾牌）| 基础 | +1 | +2 | +3 | +5 |
| **小件**（手套/护腿/肩甲/铁靴）| 基础 | +1 | +1 | +2 | +2 |

- **重甲不获敏捷调整值惩罚**：锁甲/板甲/全罩盔穿戴者不获敏捷调整值（与 AC 公式互补）
- **价格按材料比例提升**：一阶基准价 1×，二阶 2~3×，三阶 8~15×，灾厄 30~80×（按「矿物与材料总纲」单价 + 加工费系数）
- **局部防护件规则**：手套/护腿/肩甲/铁靴只升 2 档：面积小，加成空间有限
- **材料加成与词缀独立**：公式决定 AC 加成，词缀挂状态（护体/加速等）。两者叠加生效

### 武器材料加成公式（参考对照）

> 已在各武器单文件「材料加成公式」表完整列出，此处仅概述：武器按材料升档决定伤害骰（1d4→1d6+1→1d8+1→1d10+2），与护甲的 AC 加成并不同步。

## 装备命名规则（双轨制：机械名 + 叙事名）

**机械名**（结算/背包/交易数据用）：

- **无词条**：`{材料}·{基础名}`（例：「精铁·铁剑」「焦木·短矛」）
- **有词条**：`{材料}·{叙事名1}·{叙事名2}·{基础名}`（例：「精铁·灰啖·瞄心·铁剑」「焦木·土面·短矛」）；多词条（混合材料）叙事名中点顺连
- **饰品命名**：`{宝石名}·{部位}`（例：「祖母绿·挂坠」「猫眼石·戒指」）
- **带改装件**：末尾圆括号、多件「+」连接：`{材料}·{词缀}·{基础名}（{改装件}）`（例：「精铁·锋锐·铁剑（锐刃打磨+镀银层）」）；无词缀时 `{材料}·{基础名}（{改装件}）`（例：「铁·短矛（配重调整）」）

**叙事名**（挣来的名字，展示用）：

- **触发时机**（有故事才命名，普通武器保持机械名）：更换材料成功 / 锻造大成功获得稀有条 / 标志性战斗（重击击杀高危险等级目标、大成功救场等，叙事择机）/ 玩家主动提出
- **命名规范**：2~4 字为主或「X的Y」短句式；废土冷峻风：从材质/伤痕/战绩/来历取意象（灰、锈、烬、喙、断、誓）；禁浮夸堆砌；名字必须与武器实际经历挂钩（AI 从上下文取材，不凭空造）
- **好坏示例**：好：「灰喙」「拾荒者之礼」「断念」（设计参考来历：射穿灰烬狼颅的焦木猎弓 / 赛拉斯代工的第一把精铁剑 / 锻造失败留瑕疵的战锤）；坏：「弑神灭世至尊剑」「精铁神剑·无双版」
- **显示格式**：叙事名独立呈现：「灰喙」，**不在名字后附加括号来历注释**（来历融入叙事正文，不挂在名字上）；需要结算对照时用「灰喙」即「精铁·锋锐·铁剑（锐刃打磨）」；叙事正文与面板优先用叙事名，结算数据用机械名
- **唯一与继承**：一把武器一个叙事名；更换材料保留原名；加装/更换改装件不改名

## 与其他条目接口

- **规则接口**：检定公式/优势走「锻造检定」，成品伤害骰被「战斗规则」读取，材料与基准价按「装备总纲」，工具占槽按「背包系统」，核心 NPC 属性按「NPC生成规则」
- **货币纪律**：所有价格按「世界观-经济」取用，正文银币先折算为金币（1 金 = 10 银）再记入金币

