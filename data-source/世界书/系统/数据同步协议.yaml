**精确组合优先**：`角色.名字` → `character.name`（避免泛化拼接出中文字段名）。

---

## 4. 联动纪律（命令后自动校准）

以下规则在命令全部应用后统一执行（本地收口钳制）：

### 4.1 经验与升级

- `exp` 超过 `expToNextLevel` 时连续升级：
  - `exp -= expToNextLevel`
  - `expToNextLevel = floor(expToNextLevel × 1.5)`
  - `level += 1`
  - `hp.max += 5`，`hp.current += 5`（升级奖励生命）
  - 每 4 级：`proficiencyBonus += 1`

### 4.2 数值钳制

- **hp.current** ∈ `[0, hp.max]`
- **fatePoints.current** ∈ `[0, fatePoints.max]`（上限固定 1）
- **currency.gold** ≥ 0（非负）
- **attributes.{六维}** ∈ `[1, 30]`
- **relationships.{NPC}.好感度** 建议 `[-100, 100]`（引擎钳制）

### 4.3 时间规范化

- **year** ∈ `[1, 999]`
- **month** ∈ `[1, 12]`
- **day** ∈ `[1, 31]`（简化历法，不校验 2 月 31 日）
- **hour** ∈ `[0, 23]`
- **minute** ∈ `[0, 59]`
- **season** ∈ `['春','夏','秋','冬']`

### 4.4 AC 重算

基础 `AC = 10 + 敏捷调整值`；装备加成由战斗系统在用时叠加（本地 equipment-system 计算）。

### 4.5 背包条目形状

`inventory` 数组每个元素必须是对象，至少含 `name` 字段；缺失时本地补全默认形状。

---

## 5. 命令写作纪律

### 5.1 正文写了什么，命令就同步什么

- 正文未发生的事不提前写命令。
- 命令保持最小路径更新：`set 时间.时 = 15`，不写 `set gameTime = {...}`。
- 一条命令只改一个明确路径，必须能逐条映射"正文事实 → 变量变化"。

### 5.2 对象创建先整后分

- 写 `关系.老约翰.好感度` 前，若 `关系.老约翰` 未定义，先 `set 关系.老约翰 = {"好感度":0}`。
- 数组索引更新前，确保数组已有该元素。

### 5.3 失败改道

- 若候选命令不合法，必须先改写剧情为可执行分支，再输出合法命令。
- 若证据不足，只保留可证部分，让命令停留在已确认事实内。
- 若无合法命令，`<命令>` 标签内写 `无`，但正文必须体现"条件不足未执行"。

---

## 6. 协议边界

- 时间推进口径以「结算协议」为准。
- 数值公式与战力公式分别以对应专项协议为准（「经验与成长」/「战斗规则」/「属性系统」）。
- 检定/战斗的结果展示在 `<check>` / `<battle>` 标签，数值落地在 `<命令>` 区。

</DataSyncProtocol>
