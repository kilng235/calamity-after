# 数据同步协议（变量更新规则与字段定义）

## 0. 职责边界

- 本协议定义"命令如何合法落地变量"：可写根路径、字段类型/范围、别名表、联动纪律。
- 标签结构、正文行规则、命令顺序，统一以「输出格式」为准。
- 命令只维护前台已成事实的可写状态；长期剧情承接、世界后台演变收束到「结算协议」的剧情规划环节，不在这里直接维护。
- 世界事实（实体当前态/变更史）与悬念走「输出格式」的记忆账本块（[实体更新]/[悬念]/[悬念核销]），**不属于命令白名单**，也不要试图用命令把它们写进任何可写根。

---

## 1. 可写根路径（AI 权限白名单）

AI 只可写以下 15 个顶层根：

- **character**（角色基础）
- **attributes**（六维属性）
- **backgrounds**（背景特长数组）
- **fatePoints**（命运点）
- **hp**（生命值）
- **equipment**（装备 10 槽位）
- **inventory**（背包数组）
- **currency**（金币）
- **progress**（进度：位置/已完成任务/已解锁地点/当前场所）
- **conditions**（主角状态：状态名 → true 或 {层级, 来源}；白名单见「状态列表」）
- **relationships**（关系对象：NPC 名 → {好感度, 关系状态, ...}）
- **gameTime**（灾厄纪年：年/月/日/时/分/季节）
- **tone**（剧情基调字符串）
- **skills**（技能列表数组）
- **spells**（法术列表数组）

（`quests` 任务容器由任务块协议专门维护，不通过命令直写；任务块格式（[新任务]/[任务完成]/[任务失败]）见「输出格式」条目「任务块」节。）

**本地保留域（AI 一律不可写）**：
- **stats**（统计：总检定数/成功数/大成功/大失败/战斗胜场/死亡次数）
- **meta**（元数据：版本/创建时间/存档时间/游戏时长）

白名单外命令一律拒绝并记录警告。

---

## 2. 字段类型与范围表

### 2.1 character（角色基础）

| 字段 | 类型 | 范围 | 默认值 | 说明 |
|---|---|---|---|---|
| name | string | - | '旅行者' | 角色名 |
| race | string | - | '人类' | 种族 |
| gender | string | '男'/'女' | '男' | 性别 |
| age | number | 1-999 | 25 | 年龄 |
| level | number | ≥1 | 1 | 等级 |
| exp | number | ≥0 | 0 | 当前经验 |
| expToNextLevel | number | ≥1 | 100 | 升级所需经验 |
| proficiencyBonus | number | ≥0 | 2 | 熟练加值（4级/次+1） |
| ac | number | ≥0 | 10 | 护甲等级（10+敏捷调整值+装备AC） |

### 2.2 attributes（六维属性）

| 字段 | 类型 | 范围 | 默认值 |
|---|---|---|---|
| 力量 | number | 1-30 | 10 |
| 敏捷 | number | 1-30 | 10 |
| 体质 | number | 1-30 | 10 |
| 感知 | number | 1-30 | 10 |
| 智力 | number | 1-30 | 10 |
| 魅力 | number | 1-30 | 10 |

调整值计算公式：`Math.floor((属性值 - 10) / 2)`

### 2.3 backgrounds（背景特长）

- **类型**：`string[]`（数组）
- **示例**：`["佣兵", "野外求生者"]`
- **写入**：`push 背景特长 = "炼金学徒"`

### 2.4 fatePoints（命运点）

| 字段 | 类型 | 范围 | 默认值 | 说明 |
|---|---|---|---|---|
| current | number | 0-max | 1 | 当前命运点 |
| max | number | ≥0 | 3 | 上限（固定 3；达成「身份时刻」可由 AI 结算增加 current，见「身份体系」） |
| lastRefreshDate | string/null | - | null | 上次刷新日期（游戏日） |

**刷新规则**：上限 3；每游戏日开始时若为 0 则补至 1。消耗时 `add 命运点 = -1`（引擎兜底钳制不会变负）；「身份时刻」结算 `add 命运点 = 1`（引擎钳制不超过 max）。

### 2.5 hp（生命值）

| 字段 | 类型 | 范围 | 默认值 |
|---|---|---|---|
| current | number | 0-max | 10 |
| max | number | ≥1 | 10 |

**升级加成**：每升一级 `max` +5，`current` 同步+5（引擎后处理）。

### 2.6 equipment（装备 10 槽位）

槽位名（所有值均可为 `null` 或装备对象）：

- **mainHand**（主手）
- **offHand**（副手）
- **body**（身体护甲）
- **head**（头部）
- **hands**（手部）
- **legs**（腿部）
- **feet**（脚部）
- **shoulders**（肩部）
- **accessory1**（饰品1）
- **accessory2**（饰品2）

装备对象字段示例：
```json
{
  "name": "铁剑",
  "type": "weapon",
  "damage": "1d6",
  "durability": 50,
  "maxDurability": 50
}
```

### 2.7 inventory（背包）

- **类型**：`object[]`（对象数组）
- **字段**：`{ name: string, type: string, count?: number, ... }`
- **写入**：`push 背包 = {"name":"治疗药水","type":"consumable","count":2}`
- **删除**：`delete 背包[0]`（索引从 0 起）

### 2.8 currency（金币）

| 字段 | 类型 | 范围 | 默认值 |
|---|---|---|---|
| gold | number | ≥0 | 50 |

单一金币制（金币非负，引擎钳制）。

### 2.9 progress（进度）

| 字段 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| currentLocation | string | '锈钉镇' | 当前位置（区域·据点，如"佣兵镇·锈钉"） |
| currentPlace | string | '' | 当前具体场所（如"佣兵公会大厅""铁匠铺"）；进入新场景或场景内移动时更新，离开据点时清空 |
| completedQuests | string[] | [] | 已完成任务 ID 数组 |
| unlockedLocations | string[] | ['锈钉镇'] | 已解锁地点数组 |
| backstory | string | '' | 角色背景故事 |

### 2.9b conditions（主角状态）

| 字段 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| {状态名} | true 或 object | —（无状态时 conditions 为 `{}`） | 键为状态名（白名单见「状态列表」28 条）；力竭值为 `{层级: 1~3}`，侵蚀值为 `{层级: 1~2}`；其他状态可为 true 或 `{来源}` |

**规则**：
- 获得：`set 状态.中毒 = {"来源":"感染撕咬"}`；解除：`delete 状态.燃烧`
- 力竭层级钳制 1~3、侵蚀层级钳制 1~2（引擎硬保证）；力竭达 3 层时 AI 应同时 `set 状态.昏迷 = true`
- **仅主角状态入此根**；敌人状态由 battle 卡状态栏呈现，不入命令区
- 元素交互转化（如中毒遇火转燃烧）由 AI 按状态列表执行：先 delete 旧状态，再 set 新状态

### 2.10 relationships（关系）

- **类型**：`object`（对象，键为 NPC 名）
- **值字段示例**：
  ```json
  {
    "好感度": 10,
    "关系状态": "熟人",
    "人情": 0,
    "记忆": "..."
  }
  ```
- **写入**：`set 关系.老约翰.好感度 = 5`（深合并）
- **范围**：`好感度` 建议 -100 至 100（引擎钳制）

### 2.11 gameTime（灾厄纪年）

| 字段 | 类型 | 范围 | 默认值 |
|---|---|---|---|
| year | number | 1-999 | 303 |
| month | number | 1-12 | 5 |
| day | number | 1-31 | 12 |
| hour | number | 0-23 | 14 |
| minute | number | 0-59 | 0 |
| season | string | 春/夏/秋/冬 | '春' |

**时间推进口径**：按「结算协议」规定（通常 1 互动 = 15-30 分钟）。

### 2.12 tone（剧情基调）

- **类型**：`string`
- **用途**：一两个词概括当前氛围（如"紧张"/"温馨"/"诡异"），供 BGM 与叙事风格参考。

### 2.13 skills（技能列表）

- **类型**：`object[]`（对象数组，字段见「技能总纲」）
- **字段**：`{ name: string, level: number(1-3), source: string, learnedAt?: string }`
- **写入**：`push 技能列表 = {"name":"箭术","level":1,"source":"老猎人"}`
- **升级**：`delete 技能列表[索引]` + `push 技能列表 = {"name":"箭术·精通","level":2,...}`（Lv 上限 3，超出静默拒绝）
- **纪律**：同名技能只保留一条；改名升级时同步更新 `name`/`level`/`source`。

### 2.14 spells（法术列表）

- **类型**：`object[]`（对象数组，字段见「法术总纲」）
- **字段**：`{ name: string, school: string, level: number(1-3), source: string, learnedAt?: string }`
- **写入**：`push 法术列表 = {"name":"火球术","school":"火焰","level":1,"source":"卷轴"}`
- **升级**：`delete 法术列表[索引]` + `push 法术列表 = {"name":"火球术·精通","level":2,...}`（Lv 上限 3，超出静默拒绝）
- **纪律**：同名法术只保留一条；升级改名时同步更新 `name`/`level`/`source`；学派 ∈ 火焰/寒冰/咒法/防护/暗影/通用。

