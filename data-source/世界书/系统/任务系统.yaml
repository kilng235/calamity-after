# 任务系统

## 任务信息模板格式（每条任务必须按此格式呈现与维护）

- 任务名称：一句话（例：「灰烬森林材料狩猎」）
- 任务类型：佣兵委托 / 势力任务 / 个人请求 / 主线钩子（四选一枚举）
- 发布者：NPC 名 / 势力名 / 佣兵公会
- 目标区域：对齐地理总纲区域名（例：「灰烬森林」「旧王城废墟」）
- 任务描述：做什么、目标物、数量（禁含糊表述，禁「收集一些材料」类）
- 完成凭证：按类型，猎杀类=变异生物残骸样本（鳞片/腺体/爪牙）；侦察调查类=书面报告或口头汇报；寻物类=指定物品本身；救援类=被救对象确认或签名
- 当前进度：未接取 / 进行中 / 已完成 / 失败（四态枚举）
- 任务时限：如「3天」或「无」
- 奖励：金币按经济条目档位（杂务0.5~5/日常10~50/危险50~150/高危150~300/灾厄级300~500金），可含物品/声望；按市价结算型任务（如材料狩猎）按经济条目收购价结算，不受档位约束
- 备注：关键节点 / 后续钩子一句话

### 示例（信息页呈现格式）

【任务名称】灰烬森林材料狩猎
【任务类型】佣兵委托
【发布者】佣兵公会
【目标区域】灰烬森林
【任务描述】收集灰烬狼皮×3、焦木蜥鳞片×2（毒腺仅沼泽巨蜥出产，不在本次范围），按市价收购
【完成凭证】材料交付（灰烬狼皮/鳞片当面点验）
【当前进度】进行中
【任务时限】3天
【奖励】按市价结算（狼皮3金/张、鳞片5金/张）+公会声望+5
【备注】出发前可整备装备；灰烬森林夜间危险

## 任务等级（五档，对齐经济条目经济尺度）

| 档位 | 基础奖励 | 声望 | 经济锚点 | 典型内容（参考，鼓励自由发挥） |
|------|----------|------|----------|------|
| 杂务委托 | 0.5~5 金 | +1~3 | 苦力日工钱 3~7 银币（0.3~0.7 金），5 金约半个月工钱 | 锈钉镇内跑腿送信；帮铁匠铺搬货/打扫；采集黑面包级小物件；镇外捡拾基础材料 |
| 日常委托 | 10~50 金 | +2~5 | 普通佣兵月进（300~600 金/年，月均 25~50） | 清剿锈钉镇周边灰烬狼群（≤5 只）；押运一车补给到山脚营地；采集指定草药/矿石样本 |
| 危险任务 | 50~150 金 | +5~10 | 佣兵一到两个月进项（经济条目判断标准速查） | 猎杀一只焦木巨蜥并带回鳞片；护送商人穿越灰烬森林；调查地下裂谷入口的异常动静 |
| 高危任务 | 150~300 金 | +8~15 | 佣兵一季到半年进项 | 深入旧王城废墟回收一件已知位置的遗物；清剿一处变异生物巢穴；护送深渊之子探索队至裂隙边缘 |
| 灾厄级 | 300~500 金 | +10~15 | 灾厄级全款，够置临街铺面（经济条目判断标准速查） | 猎杀首领级变异生物；进入沉没之城深层带回旧王国文物；阻止势力间的灭口行动 |

> 奖励金币一律按「世界观-经济」币制结算（1 金=10 银）；最低档杂务委托允许银币找零，写入主角表时按 1 金=10 银折算为金币（可含小数，如 3 银币=0.3 金）；超过 5 金的任务按金币整数写入主角表。

## 任务来源与接取

- **佣兵公会**（锈钉镇主街尽头）：公开悬赏，按**佣兵等阶**设接取档位上限（等阶 = 角色等级，五阶对照见「经验与成长 §5」）；佣金抽成按「经济·服务与杂项」佣兵公会佣金行；越档接取需紧急征召或名人担保（AI 裁定，一次一单）
- **势力任务**：各势力发布（见势力条目「典型委托」节）；门槛=声望档位（中立可接基础委托，崇敬解锁高阶/内部委托，仇视拒绝一切委托）
- **个人请求**：NPC 直接委托（对话触发）；友好以上才会托付重要事务
- **主线钩子**：剧情关键任务（如老维特失踪），触发后推动主线，通常无时限
- 接取：任务信息按模板格式呈现 → 确认接取 → 进度「未接取」→「进行中」；同时活跃任务建议不超过 3 条

## 进度判定

- **进行中**：任务执行中，目标未达成
- **已完成**：完成凭证交付并核验（猎杀类=残骸样本点验；侦察类=汇报记录；寻物类=物品交付；救援类=确认签名）
- **失败**：超过任务时限未完成 / 放弃 / 关键条件破坏（如目标物被毁）；失败后可再谈或取消
- 进度四态只可填枚举值，不写其他状态

## 结算规则

- **完成后**：按奖励字段结算：金币记入主角（佣兵公会委托扣 10% 佣金）；奖励物品记入背包；声望奖励更新势力声望（对应势力）
- **任务记录维护**：当前活跃任务在正文任务面板/状态栏展示，由正文维护并随上下文呈现
- **战利品判定**：按市价结算型任务与猎杀类任务的凭证判定、品相、势力收购见「战利品系统」条目（不重复定义）
- **声望联动**：任务完成声望变动触发势力条目「关系上升/下降」规则；个人请求完成提升对应 NPC 好感档位（关系表）

