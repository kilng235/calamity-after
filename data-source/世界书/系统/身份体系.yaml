# 系统模块: 身份体系

**描述:** 定义主角身份（佣兵/拾荒者/学者/猎人/商贩/工匠/医师）的持续玩法——身份时刻奖励命运点，让身份成为贯穿全程的扮演引擎

---

## 通用规则

- 身份在创角（登记档案）时选定，是持续的扮演框架而非一次性标签；系统已按身份落库差异化开局包（金币/装备/随身物品，见「开局生成规则·身份差异化」）
- 身份不提供数值加成：涉及身份领域的叙事按专业视角演绎，检定数值一视同仁（领域检定优势为后续扩展，见条目末尾标注）

## 身份时刻（命运点奖励循环）

- **判定**：玩家行为高度契合当前身份人设、且对剧情产生实际效果（有结果、有转折、有收益）时，判定为一次「身份时刻」，在 `<命令>` 区结算 `add 命运点 = 1`
- **各身份示例**（启发式列举，同类行为同等判定）：
  - 佣兵：明知艰险仍正面接下高危委托，或以战力为弱者解围
  - 拾荒者：从废墟杂物中淘出高价值或关键时刻救急的物品
  - 学者：解读文献、遗迹线索或知识考证推动剧情
  - 猎人：追踪、野外生存立功，或猎获高价值猎物
  - 商贩：识破定价破绽赚到实际差价，或促成一笔划算的供货/押运
  - 工匠：修复关键装备器械使剧情推进，或打造出超预期的物件
  - 医师：救治伤员、处置疫病中毒，且救治产生剧情转折
- **频控（三条同时满足才结算）**：
  1. 每游戏日每主角最多结算 1 次「身份时刻」
  2. 同一场景内同类型行为不重复触发（连续救治多名伤员只算 1 次）
  3. 命运点当前值 < 上限（3）时才结算；已达上限则只做叙事肯定，不发点
- **叙事要求**：结算时正文用一句话自然点出身份契合（如「这正是医师的本分」），禁止生硬播报系统奖励或跳出角色
- **非身份行为不奖励**：与身份无关的善举/壮举走正常剧情结算，不触发本机制

（扩展预留：身份领域叙事视角与领域检定优势将在本条目后续版本定义）
