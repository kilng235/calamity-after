## `<check>` 检定卡（可嵌入 `<content>` 正文）

**格式**：框线版纯文字，直接在正文中显示。

```
<check>
╔═══════════════════════════════╗
║  ⚡ 感知检定                    ║
╠═══════════════════════════════╣
║  骰值: d20(14)                 ║
║  调整: +2 (属性) +2 (熟练)     ║
║  总计: 18                      ║
║  难度: DC 15                   ║
║  结果: ✧ 成功 ✧                ║
╚═══════════════════════════════╝
</check>
```

**排版规则**：
- 使用 Unicode 框线字符：`╔═╗╠╣╚╝║`。
- 每行用 `║` 包围，内容左对齐，尾部用空格填充到统一宽度。
- 顶部显示技能图标 + 技能名。
- 结果行：成功用 `✧ 成功 ✧`，失败用 `✗ 失败 ✗`。
- 大成功：`✧✧ 大成功！ ✧✧`，大失败：`✗✗ 大失败！ ✗✗`。

**技能图标映射**：
- 感知 → ⚡  运动 → 🏃  调查 → 🔍  隐匿 → 🥷
- 说服 → 💬  威吓 → 😠  敏捷 → 🎯  力量 → 💪
- 魅力 → ✨  智力 → 📚  其他 → 🎲
- **reroll**：可选字段，命运点重骰时包含 `{"roll": 新骰值, "total": 新总值}`。

**对抗检定**：`type` 为 `"opposed"`，增加字段：
```json
{
  "type": "opposed",
  "skill": "魅力",
  "yourRoll": 12,
  "yourModifier": 1,
  "yourPB": 2,
  "yourTotal": 15,
  "opponentRoll": 10,
  "opponentModifier": 2,
  "opponentPB": 0,
  "opponentTotal": 12,
  "success": true
}
```

**与 `<命令>` 的关系**：
- `<check>` 只做展示卡，不更新状态。
- 检定消耗的命运点、获得的经验、成功后的奖励必须在 `<命令>` 区体现。

---

## `<battle>` 战斗卡（可嵌入 `<content>` 正文）

**格式**：框线版纯文字，直接在正文中显示战斗过程。

```
<battle>

╔═══════════════════════════════════════════════╗
║          ⚔️  战斗开始  ⚔️                    ║
╚═══════════════════════════════════════════════╝
先攻顺序：凛夏（15） → 灰烬狼A（12） → 灰烬狼B（8）
交战距离：10米

━━━━━ 第1回合 ━━━━━

【凛夏的回合】
行动：使用铁剑攻击灰烬狼A
[ 攻击检定：d20(14) + 3 = 17 vs AC 13 ]
✓ 命中
[ 伤害：5 ]
[ 灰烬狼A HP：19/24 ]

【灰烬狼A的回合】
行动：撕咬凛夏
[ 攻击检定：d20(8) + 2 = 10 vs AC 15 ]
✗ 未命中

━━━━━ 第2回合 ━━━━━

【凛夏的回合】
行动：挥剑横扫
[ 攻击检定：d20(19) + 3 = 22 vs AC 13 ]
✓ 命中
💥 重击！伤害翻倍！
[ 伤害：12 ]
[ 灰烬狼A HP：7/24 ]

╔═══════════════════════════════════════════════╗
║          ⚔️  战斗结束  ⚔️                    ║
╚═══════════════════════════════════════════════╝
胜利！击败灰烬狼A、灰烬狼B。

</battle>
```

**排版规则**：
- 使用 Unicode 框线字符标记战斗开始/结束。
- 使用 `━━━━━ 第N回合 ━━━━━` 分隔回合。
- 每个行动者的回合用 `【名字的回合】` 标记。
- 攻击检定用 `[ 攻击检定：... ]` 格式。
- 命中/未命中用 `✓ 命中` / `✗ 未命中`。
- 重击用 `💥 重击！伤害翻倍！`。
- 伤害用 `[ 伤害：数值 ]` 格式。
- **敌人 HP 行**：敌人受到伤害后，紧随伤害行输出其剩余生命 `[ 名称 HP：剩余/上限 ]`（仅 HP 发生变化的敌人输出；主角 HP 不写入战斗卡，由 `<命令>` 区维护）。

**耐久损耗规则**：
- 武器耐久：命中 −1 / 大失败额外 −5。
- 防具耐久：被命中 −伤害等额。
- 耐久变动必须在 `<命令>` 区体现（`add 装备.主手.耐久 = -1`）。

**与 `<命令>` 的关系**：
- `<battle>` 只做展示卡，不更新状态。
- 战斗结束后的 HP 变化、经验获得、战利品进背包、武器/防具耐久损耗必须在 `<命令>` 区体现。
- 战斗中玩家 HP 归零时，`<命令>` 区写 `set 生命值 = 0`；游戏逻辑由前端处理（显示死亡界面或复活选项）。

---

## `<SUMMARY>` 摘要

每轮回复末尾必须输出一句话摘要（15-30 字），概括本轮核心事件：

```
<SUMMARY>
你在锈钉镇酒馆完成了与老约翰的谈判，老约翰同意提供铁矿镇护送任务。
</SUMMARY>
```

摘要供记忆系统的编年史与检索使用，必须客观陈述，避免主观评价；必须包含具体人名、物品名、地点名与事件结果，禁止"发生了冲突""有所进展"等没有动作和结果的概括。

---

## 时间标记规范

每轮回复首行必须是灾厄纪年时间标记：

```
----- ✦ {灾厄纪年}年{月}{日} {时}:{分} ✦ -----
```

格式示例：`----- ✦ 灾厄303年5月12日 14:30 ✦ -----`

时间推进口径按「结算协议」与「数据同步协议」规定；时间变动必须在 `<命令>` 区体现：

```
<命令>
set 时间.时 = 15
set 时间.分 = 0
</命令>
```

---

## 与其他条目的关系

- **通用检定**（通用检定.yaml）只讲机制（d20 + 调整值 + PB vs DC），不重抄 `<check>` 排版。
- **战斗规则**（战斗规则.yaml）只讲机制（命中/伤害/耐久/双持/先攻），不重抄 `<battle>` 排版。
- **关系系统**（关系系统.yaml）只讲五档机制与升降规则；关系变动通过 `<命令>` 区 `set 关系.{NPC名}.好感度` 体现。
- **技能总纲**（技能总纲.yaml）只讲习得机制与等级规则；技能变动通过 `<命令>` 区 `push 技能列表` 体现。
- **经验与成长**（经验与成长.yaml）只讲升级公式与经验发放规则；经验/等级变动通过 `<命令>` 区 `add 经验` 体现。
- **数据同步协议**（数据同步协议.yaml）定义可写根路径、字段类型、别名表、联动纪律；本文件引用但不重复定义。

</OutputFormat>
