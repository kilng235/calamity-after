# 系统指令：输出格式（整体骨架与所有标签的字面排版）

**描述**：本条目是输出规则的唯一 source of truth。所有标签的字面格式、时间标记框架、标签位置规则统一在此维护。其他系统条目（通用检定/战斗规则/关系系统等）只讲机制，不重抄排版。

---

## 回复整体结构

每轮回复必须按以下顺序输出：

```
----- ✦ {灾厄纪年}年{月}{日} {时}:{分} ✦ -----

<content>

[叙事正文]
（战斗时嵌入 <battle>，检定时嵌入 <check>）

</content>

<命令>
[状态更新命令，见下节]
</命令>

<SUMMARY>
[本轮一句话摘要]
</SUMMARY>
```

**重要**：
- `<content>` 与 `</content>` 是必需的闭合标签，包裹叙事正文。
- `<命令>` 与 `</命令>` 是必需的闭合标签，包裹状态更新命令；无变化时标签内写 `无`。
- `<SUMMARY>` 与 `</SUMMARY>` 是必需的闭合标签，包裹本轮一句话摘要。
- `<check>` 和 `<battle>` 可嵌入 `<content>` 正文任意位置，用于渲染检定卡/战斗卡。
- 所有值标签（`<relation>`/`<skill>`/`<exp>`/`<gold>`/`<task>` 等）已废弃，不得输出。

---

## `<命令>` 区：状态更新的唯一权威

**核心原则**：`<命令>` 区是数值变动的唯一权威；正文描述与命令不一致时，以命令落地结果为准。正文不得承诺标签外的数值变化。

### 命令写法

支持三种写法：

**1. 行式写法（推荐）**：

```
<命令>
add 金币 = 20
set 时间.时 = 15
set 关系.老约翰.好感度 = 5
push 背包 = {"name":"治疗药水","type":"consumable","count":2}
delete 背包[0]
</命令>
```

**2. JSON 数组写法**：

```
<命令>
[
  {"action":"add", "key":"金币", "value":20},
  {"action":"set", "key":"时间.时", "value":15}
]
</命令>
```

**3. 对象映射写法**：

```
<命令>
{
  "set": {"金币":100, "时间.日":13},
  "push": {"背包":{"name":"绷带","count":1}}
}
</命令>
```

### 动作类型

- **set**（设置/设为/写入）：覆盖式赋值；对象字段走深合并。
- **add**（增加/新增/累加）：数值加法；非数字视为 0。
- **push**（追加/插入）：向数组末尾追加元素。
- **delete**（删除/移除）：删除字段或数组元素（索引从 0 起）。

### 中文别名

命令支持中文路径别名（完整映射见「数据同步协议」）：

- 金币/金钱 → `currency.gold`
- 生命值/生命/HP → `hp.current`
- 经验/经验值 → `character.exp`
- 等级 → `character.level`
- 时间.时/时间.日 → `gameTime.hour` / `gameTime.day`
- 位置/当前位置 → `progress.currentLocation`
- 关系.{NPC名}.好感度 → `relationships.{NPC名}.好感度`
- 背包 → `inventory`

### 命令顺序纪律

**严格要求**：
1. 先 `set` / `add`
2. 再 `push`
3. 最后 `delete`
4. 同数组多个 `delete` 时，索引从大到小排列（避免索引漂移）

**禁止事项**：
- 禁止伪索引：`背包[-1]` / `背包[last]` 无效。
- 禁止整根覆盖：`set 角色 = {...}` 非法，必须最小路径更新。
- 禁止非法路径：`stats` / `meta` 为本地保留域，AI 不可写。

### 无变化时

```
<命令>
无
</命令>
```

