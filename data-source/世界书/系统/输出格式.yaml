## 任务块：任务变动的唯一上报通道

**核心原则**：任务的新增 / 完成 / 失败一律通过任务块上报，由前端任务面板展示与维护。正文只做剧情化呈现（接单对话、交付场景），**禁止在正文输出 markdown 任务面板、任务清单或【任务名称】格式的信息页**——玩家界面的任务状态不由正文维护。

任务块放在 `<content>` 正文之外（`</content>` 之后、`<命令>` 区之前或之后均可），解析器会从全文提取并从展示文本中剥离。多个任务变动时并列输出多个块。

### 新增任务（玩家接取或剧情触发新任务时）

```
[新任务]
名称：枯萎的焦木
类型：个人请求
发布者：艾莉丝
等级：杂务
描述：采集质地坚硬、未完全沙化的焦木树心×4
目标：
- 采集焦木树心 0/4
奖励：4 金币
[/新任务]
```

- `[新任务]` 与 `[/新任务]` 必须成对闭合（也可用 `<新任务>`…`</新任务>` 写法）。
- 字段：**名称**（必需，缺名称整块无效）/ 类型（佣兵委托/势力任务/个人请求/主线钩子四选一）/ 发布者 / 等级（杂务/日常/危险/高危/灾厄级）/ 描述 / 目标 / 奖励。
- 目标写在「目标：」之后，每行一个、以 `- ` 开头，可带 `0/N` 进度；已完成的目标写成 `- [x] 目标名`。
- 奖励中的金币/经验按数字解析（如 `4 金币`、`50 经验`）。

### 任务完成 / 任务失败

```
[任务完成]
名称：灰烬森林材料狩猎
[/任务完成]
```

```
[任务失败]
名称：灰烬森林材料狩猎
[/任务失败]
```

- 只需写「名称」，按名称匹配当前任务并移入对应状态。
- 进度变化（目标从 0/4 变 2/4）不块报，任务面板由下一节时间线刷新；仅新增/完成/失败需要块。

