# 词缀表（随机词条系统·AI 自由生成）

> 本节为词条数据字典。词条效果一律以「状态」表达；状态的效果/解除统一按「状态列表」裁定，本节不重抄；状态赋予的优势/劣势按「通用检定 §3」掷二取一执行。
>
> **核心变更（v2 随机词条）**：词条不再由材料→固定映射，而是「材料→主题倾向→AI 随机抽 1~N 个→自由起名」。锻造完成时由 AI 现场生成。

## 总则

- **词条分类**：
  - **攻击词条**：武器命中目标时挂载负面状态（或自伤类 buff）；未命中不挂载
  - **穿戴词条**：穿戴者进入对应场景时自身获得有利状态，离开场景即结束
- **效果唯一性（硬约束）**：
  - 每件装备的所有词条不重复同一状态（沿用状态池「不叠加」原则）
  - 同一命中只附加一种状态（按「状态列表·判定提示」）

## 装备品质决定词条数

| 品质 | 词条数 | 触发条件 |
|------|--------|---------|
| 普通（白）| 1 | 一阶材料 + 锻造 DC 成功 |
| 罕见（绿）| 2 | 二阶材料 + DC15 成功 |
| 稀有（蓝）| 2 | 三阶材料 + DC20 成功 |
| 史诗（紫）| 3 | 史诗材料（灾厄金属）+ DC20 成功 |
| 传说（橙）| 3 | 传说材料（星铁/完美钻石）+ DC20 成功 |

## 材料→主题倾向（5 大主题 + 通用）

锻造完成后，AI 按主要材料读出主题，从对应池抽词条。多材料混合取 1 主 + 1 副（副主题可渗入 1 个词条）。

| 材料 | 主题 | 主调状态 | 候选状态池 |
|------|------|---------|-----------|
| 黑曜石 | 火焰 | 燃烧 | 燃烧、减速（烟呛）、目盲（闪光）、感电（电光） |
| 硫磺矿 | 毒素 | 中毒 | 中毒、侵蚀、减速（毒雾）、失衡（迷乱） |
| 精铁 | 锋锐 | 出血 | 出血、失衡、护体（穿刺穿透）、燃烧（摩擦生热） |
| 秘银 | 精准 | 失衡 | 失衡、灵巧、专注、加速 |
| 血晶石 | 深渊 | 恐慌 | 恐慌、震慑、失能（灵魂震慑）、护体（深渊抗性） |
| 星铁 | 星辉 | 加速 | 加速、护体、灵巧、耀眼（星光反射） |
| 焦木 | 朴素 | 减速 | 减速、目盲、力竭（负重）、燃烧（焦灼） |
| 宝石镶嵌 | 灵光 | 灵巧 | 灵巧、专注、耀眼、加速 |
| 其他材料 | 通用 | — | 上述 8 池均匀分布 |

> **混合规则**：精铁 + 宝石镶嵌 = 锋锐主 + 灵光副；星铁 + 血晶石 = 星辉主 + 深渊副（罕见跨界组合）。史诗/传说装备跨 2~3 主题的概率提升。

## 6 大主题池（AI 自由取词）

> 每个池是「候选状态」+「候选叙事意象」的参考库。AI 不限于取字面，可自由组合，但效果必须从「状态列表」28 状态内取。

### 火焰池
- 候选状态：燃烧、减速（烟呛）、目盲（闪光）、感电、燃烧升级（叠加高温）
- 叙事意象：灰烬、炭渣、焦痕、烟缕、烤骨、火舌、炭晶、烬纹、火咬

### 毒素池
- 候选状态：中毒、侵蚀、减速（毒雾）、失衡（迷乱）、麻痹（神经毒）
- 叙事意象：苦胆、瘴纹、毒涎、蚀痕、腐皮、疽脉、霉咒、锈胆、苦刺

### 锋锐池
- 候选状态：出血、失衡、护体（穿刺穿透）、燃烧（摩擦）、残废（切割）
- 叙事意象：血脊、刃霜、破痕、断骨、刃鸣、白痕、铁吻、裂肤、利齿

### 精准池
- 候选状态：失衡、灵巧、专注、加速、目盲（瞄准）、加速（手感）
- 叙事意象：针眼、定针、瞄心、星瞄、准星、瞬息、一发、几何、丝准

### 深渊池
- 候选状态：恐慌、震慑、失能（灵魂震慑）、护体（深渊抗性）、魅惑（低语）
- 叙事意象：渊语、低回、丧钟、丧爪、噬名、丧心、渊啮、丧誓、渊眼

### 星辉池
- 候选状态：加速、护体、灵巧、耀眼、专注、感电（静电）
- 叙事意象：星痕、星霜、光翼、星眸、银羽、星喙、晨星、辉纹、流光

### 通用池（无明确主材时）
- 候选状态：上述 8 池均匀分布
- 叙事意象：灰啖、锈誓、拾荒、枯骨、土面、苦旅、断念、灰喙、锈脊、蚀痕

## 品质分级池（良品/杰出）

> 锻造成果分级命中「良品/杰出」档后（见「锻造检定·成果分级」），在主题池基础上追加此二级池候选。品质分级池与主题池**正交**：不替代主题池，只扩充候选状态，用于抬升高级装备词条的下限。抽词数仍按「装备品质决定词条数」，只换池不换数。词条仍恪守「一出状态」——见下方"强度骰"第三条。

| 品质档 | 触发 | 追加候选（在 28 状态内取） | 特征 |
|--------|------|--------------------------|------|
| 良品 | 锻造分级 `≥+5` | 护体、加速、灵巧、专注、耀眼（有机会进上品级状态） | 主题池去除最弱项、加权到中上级 |
| 杰出 | 锻造分级 `≥+10` | 护体（深渊抗性）、震慑、目盲（闪光）、麻痹（神经毒） | 进稀有级状态，含 2+ 主题跨界组合倾向 |

- 良品/杰出池仅在对应档位启用；普通档（`0~+4`）与失败档仍只走主题池/瑕疵词缀
- 池内候选仍从「状态列表」28 状态取，不新增状态；AI 按 CoT 抽 N 个不重复状态

## 词条强度骰（抽词后）

> 词条状态抽定后，再掷一枚 d10 决定该词条**效果强度**。**强度只量化"状态自身"强度**（DOT 骰面、附加持续回合、护体承伤），**不引入独立伤害数值层**——附加伤害等数值仍归「锻造规则·工艺改装件」，与「词条不加数值」纪律一致。强度档不记入机械名，仅影响叙事与结算。

| d10 | 强度档 | 效果量 |
|-----|--------|--------|
| 1~2 | 弱 | 状态持效减弱（DOT 骰面 −1 档 / 持续 −1 轮） |
| 3~7 | 标准 | 基准（按状态列表原值） |
| 8~9 | 强 | 状态增强（DOT 骰面 +1 档 / 持续 +1 轮） |
| 10 | 完美 | 状态触顶（DOT 骰面 +2 档封顶 / 持续 +2 轮） |

- 每一词条各掷一枚 d10，从「骰子池」d10 依次取用
- 强度只作为叙事与质量分档依据；机械名不体现强度（如仍为「精铁·灰啖·铁剑」，不写「精铁·强·灰啖·铁剑」）
- 良品/杰出池的候选倾向高强度档，普通池倾向标准/弱档，AI 综合池与强度骰产出最终效果

## AI 词条生成 CoT（5 步）

```
1. 读材料 → 主题（多材料取 1 主 + 1 副；主材≥2 个时副主题可渗入 1 个词条）
2. 读装备品质 → 词条数 N（普通 1 / 罕见 2 / 稀有 2 / 史诗 3 / 传说 3）
3. 从主题池（主+副）中抽 N 个「不重复状态」，硬校验「效果唯一性」
4. 每个词条：
   a. 起 2~4 字废土冷峻风叙事名（材质/伤痕/战绩取意象）
   b. 写 1~2 句叙事描写（场景化、贴合装备部位）
   c. 标注状态引用（按「状态列表」 §判定提示）
5. 输出格式：「{叙事名}：{叙事描写}（{状态名}·{效果概要}）」
   例：灰啖：剑锋划过如灰烬冷却，伤口迟迟不愈（出血·每轮末 d4）
```

## 词条名风格指南（AI 命名参考）

### 命名三派

- **材质派**（从材料/形态取意象）：灰啖、黑棱、枯骨、白痕、土面、炭晶、锈脊
- **伤痕派**（从效果取意象）：血脊、烧骨、断筋、焦纹、瘀痕、刃霜、裂肤
- **战绩派**（从故事取意象）：拾荒者之礼、断念、苦旅、灰喙、锈誓、渊语、星眸

### 好示例（AI 参考）

> 灰啖、断念、灰喙、锈誓、拾荒者之礼、苦旅、白痕、枯骨、烧骨、焦纹、渊语、星眸、星霜、断筋、瘀痕、土面、刃霜、裂肤、黑棱、炭晶、锈脊、血脊、利齿、针眼、定针、瞄心、准星、一发、几何、丝准、噬名、丧钟、丧爪、渊啮、丧心、渊眼、低回、光翼、银羽、星喙、晨星、辉纹、流光、苦胆、瘴纹、毒涎、蚀痕、腐皮、疽脉、霉咒、锈胆、苦刺、刃鸣、铁吻、破痕、断骨

### 坏示例（AI 避免）

> 弑神灭世至尊剑、傲天狂战、终极无敌、最强神器、神王之怒、毁天灭地、一击必杀、无双战神、至尊杀神、绝世神兵、霸天绝地、九天雷动、万古第一

## 触发总则（沿用既有）

- 攻击词条在**命中**时挂载，未命中不挂载；武器带多个攻击词条时，同一命中只附加一种状态，由叙事择最贴切者（按「状态列表·判定提示」）
- 穿戴词条在**进入对应场景**时生效，离开即结束；与种族特质/工具优势并存时按「通用检定 §3」合并为一次优势（掷二取高，不叠加）
- 状态间的元素交互（水熄燃烧、毒遇火转燃烧、寒冷/感电遇湿升级麻痹等）按「状态列表·元素交互」
- 检定仍从「骰子池」取 d20，正文展示 `d20({骰值}) + {属性值} = {总值} vs DC{数值}`

## 状态列表引用

> 词条效果全部从既有 28 状态池取，本节不重抄。28 状态详见「状态列表」条目。

负面 22 种：目盲、耳聋、失能、昏迷、麻痹、震慑、加速（用于负向变体）、中毒、恐慌、魅惑、受擒、束缚、倒地、力竭、燃烧、出血、残废、失衡、减速、侵蚀、寒冷、感电
有利 6 种：隐形、加速、耀眼、灵巧、专注、护体