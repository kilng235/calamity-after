# 背包系统（物品收纳与携带规则）

## 三维容量

- **背包槽位**：默认 12 槽（不含装备穿的 7 槽）
- **重量上限**：10 + 力量 × 2 公斤（力量 10 → 上限 30 公斤）
- **大件单独计**：驮马/披甲战羊/战利品（变异生物尸体/大型木箱/废墟构件）等大件不占槽位但占特殊运力

## 物品分类（占槽/占重）

| 类别 | 示例 | 占槽 | 占重 | 备注 |
|------|------|------|------|------|
| 装备 | 武器/护甲/工具 | 不占（穿身上）| 重量计入「穿戴总重」 | 按 7 槽位装备系统 |
| 消耗品 | 治疗药水/解毒剂/烟幕弹 | 1 槽/件 | 0.1 公斤/件 | 小型物品 |
| 材料 | 矿石/木材/皮革 | 1 槽/份 | 按材料类型（铁 1 公斤/块、精铁 1 公斤/块、星铁 0.5 公斤/块）| 锻造原料 |
| 弹药 | 箭矢/弩矢 | 1 槽/20 支 | 0.5 公斤/份 | 战斗消耗 |
| 工具 | 开锁工具/炼金工具 | 1 槽/件 | 1~3 公斤/件 | 任务消耗 |
| 文档 | 信件/地图/委托书 | 1 槽/份 | 0.05 公斤/份 | 可忽略计重 |
| 杂物 | 食物/杂物 | 1 槽/份 | 0.5~2 公斤/份 | 杂物类 |
| 战利品 | 变异生物皮革/牙齿/腺体 | 1 槽/份 | 0.5~5 公斤/份 | 按大小浮动 |
| 货币 | 金币/银币 | 不占 | 不计 | 直接记入主角金币 |

## 超重规则（引擎自动结算）

- **负重上限**：10 + 力量 × 2 公斤；总重 = 装备 10 槽 + 背包物品（weight × 数量），由**前端引擎自动计算**，每回合命令结算后刷新
- **超重**：总重超过上限时，引擎自动为主角落地「超重」状态（面板红标）；**不要用命令写/删 超重**，卸载物品后引擎自动解除
- **极端超重**：总重超过上限 1.5 倍时，「超重」状态升为 2 层，行动受限（剧情中表现为「行走困难/无法奔跑」）
- **AI 职责**：按当前负重值演出后果——超重时力量相关检定（近战/攀爬/行军/跳跃）劣势；新物品入包时建议在命令中带 `weight` 字段（公斤/件，按下方重量表估），未带时引擎按物品类别自动估算

## 战利品结算（战后）

- **收购价**：零售价 ×50%（按「世界观-经济」条目基准）
- **结算时点**：战斗结束（一方消灭/逃跑/无力化）后战利品记入背包，金币记入主角
- **常见战利品价目**（参考经济条目）：
  - 灰烬狼皮 3 金/张；焦木蜥鳞片 5 金/张；毒腺 1 金/个
  - 矿石按类型零售价卖出；遗物/旧王国钱币 5~50 金按品相

## 存库服务

- **酒馆寄存**：1 银/件/月（按物品数计，不分大小类）
- **家宅寄存**：3 银/件/月（私人物品，安全等级高）
- **深渊之子据点**：免费但有信息交换要求（剧情钩子）

## 物品管理动作

| 动作 | 规则 | 备注 |
|------|------|------|
| 拾取 | 拾取时计入背包槽位与重量；超重时禁止拾取 | 叙事描述需与槽位/重量一致 |
| 丢弃 | 立即释放槽位与重量，无视地点（叙事描写丢弃物品） | 贵重物品丢弃不补回 |
| 转移 | 物品从背包转给同伴/NPC；交易价按双方议定或市集收购价 50% | 涉及交易走「经济条目」货币纪律 |
| 使用 | 消耗品使用立即生效（治疗药水+20 HP 等即时扣减对应数值（生命/背包槽位）） | 不消耗槽位（物品消失） |
| 装备/卸下 | 装备物品移入/移出 7 槽位；卸下装备入背包占槽位与重量 | 卸下后失去 AC 加成 |

## 装备原则（与「装备总纲」一致）

- 装备不占背包槽位（穿在身上走 7 槽位系统），但重量计入「穿戴总重」并影响超重判断
- 卸下装备入背包占 1 槽（如铁剑 1 槽、皮甲 1 槽）
- 修理装备走「世界观-经济·装备修理」基准价（2~5 金/件起）
