## 七、法术习得路径（五来源 + 书籍/卷轴载体特化）

> 本节为法术习得场景数据。习得判定公式（d20+智力+PB vs DC）、DC 档位（按法术书等级 12/15/18/20/22）、大成功强化变体、失败后果（宝石消耗）、智力未达 +10、卷轴免检定的权威源为「学习检定」条目；d20 检定公式、优势/劣势合并、大成功/大失败后果按「通用检定 §0 场景调度表 + §1~§7」执行，本节不重抄。

### 习得核心规则

- **智力双职责**：① 可学等级上限（智力 8=1 级 / 10=1~2 级 / 12=1~3 级 / 14=1~4 级 / 16~20=1~5 级）② MP 上限
- 习得检定按「学习检定·法术习得检定」执行

### 五来源触发条件（与「技能总纲」五来源平行）

| 来源 | 触发场景 | 法术习得判例 |
|------|---------|------------|
| 1. 正式 NPC 教学 | 与 14 名有档案 NPC 关系友好以上 + 关键检定大成功 → NPC 主动传授 | NPC 拥有该法术 + 玩家智力 ≥ 法术书解锁等级 + 关键检定通过 |
| 2. 随机 NPC 战斗模仿 | 击败无名施法者 NPC → 战后模仿检定 | 检定按「学习检定」（DC12+法术书等级）；失败 = 仅习得 1 轮临时法术（次日遗忘）|
| 3. 随机 NPC 社交获得 | 帮无名 NPC 完成某事 → NPC 主动感谢传授 | 同源 1，NPC 不入关系表（仅记入法术表 source/learn_log）|
| 4. 随机 NPC 旁观学习 | 路遇高手演示法术（非战斗演示）→ 旁观检定 | 检定按「学习检定」（DC15+法术书等级）；失败 = 仅获「法术线索」（下次可重试）|
| 5. 战利品习得（核心：书籍与卷轴） | 拾取法术书/卷轴 → 研读检定 / 直接读卷轴 | 见下方「书籍与卷轴习得」专节 |

### 书籍与卷轴习得（第五来源特化）

#### 卷轴施法（一次性）

- **形态**：羊皮纸/竹简，刻单条法术
- **适用等级**：1~3 级（罕见 4 级，**5 级无卷轴**）
- **使用次数**：1 次（读完后消失）
- **智力门框**：**无**：卷轴内置引导，智力低也能放
- **检定**：不需研读检定；施法检定按「施法检定」条目（`d20+智力` vs 该法术 DC），失败卷轴消失（卷轴破损）
- **价格**：一阶 30 金 / 二阶 80 金 / 三阶 150 金
- **来源**：商店 / 战利品 / NPC 任务奖励

#### 书籍习得（永久读物）

| 品级 | 形态 | 适用等级 | 稀有度 | 基准价（金）|
|------|------|---------|--------|-------------|
| 一阶（入门法术书） | 入门法术书 | 1 级 | 普通 | 30 |
| 二阶（进阶法术书） | 进阶法术书 | 1~2 级 | 罕见 | 80 |
| 三阶（高阶法术书） | 高阶法术书 | 2~3 级 | 稀有 | 150 |
| 四阶（大师法术书） | 大师法术书 | 3~4 级 | 史诗 | 400 |
| 五阶（传奇法术书） | 传奇法术书 | 4~5 级 | 传说 | 1200+ |

**习得检定**：按「学习检定·法术习得检定」执行
- **智力未达解锁等级**：研读检定 DC+10（智力 8 看 2 级书 = DC25，实际无法命中）
- **大成功**（天然 20 或总值 ≥ DC+10）：习得 + 解锁「强化变体」
- **失败**：载体保留，可重试；每次失败消耗 1 颗对应学派宝石；宝石耗尽 = 书籍作废
- **来源**：NPC 教学 / 商店 / 战利品 / 抄录（同 NPC 提供）

### 重复习得三段式（与技能三段式对齐）

- 第二次习得同法术：原名 + `·精通`（例：火球术·精通），记入 Lv2
- 第三次习得同法术：原名 + `·奥义`（例：火球术·奥义），记入 Lv3
- Lv3 后再次习得同法术：**静默拒绝**（不提示、不计数、不写入）
- Lv2/Lv3 触发强化效果（叙事层面，由 AI 按学派特性裁定，如「·精通」伤害+1d6、「·奥义」效果+1 轮）

### 数据库：法术表 sheet_spells

> 法术明细存于独立的「法术表 sheet_spells」（与 sheet_skills 平级，每项法术一行；数据库表格通用化，不绑本卡）；主角表仅保留总数。

| 表 | 列 | 类型 | 含义 |
|----|----|------|------|
| sheet_spells | `spell_name` | TEXT (UNIQUE) | 法术名（升级改名时同步更新） |
| sheet_spells | `school` | TEXT | 学派（火焰/寒冰/咒法/防护/暗影/通用） |
| sheet_spells | `level` | INTEGER | 法术书等级 1~3（MVP 范围） |
| sheet_spells | `tier` | INTEGER | 习得等级 Lv1~3 |
| sheet_spells | `source` | TEXT | 最近一次习得/升级的来源（书籍名/卷轴名/NPC 名） |
| sheet_spells | `learn_log` | TEXT | 累计习得与升级日志（每条含等级、来源、检定、时间） |
| sheet_main | `spell_count` | INTEGER | 主角已习得法术数（不区分 Lv，仅计总数） |

### AI 行为（CoT 步骤「法术习得判定」）

1. **触发检测**（五来源任一触发 + 载体识别）
2. **前置校验**：①智力 ≥ 该法术书解锁等级？②是否有对应学派宝石 ≥ 1（书籍习得）？
3. **习得判定**：
   - 查法术表该法术名所在行：无行 = 未习得；有行读 tier
   - 若未习得 → 法术表 INSERT 新行（Lv1），写入 source/learn_log
   - 若已习得 Lv1 → 法术表 UPDATE 该行：按改名规则更新 spell_name、tier=2、source=新来源、learn_log 追加
   - 若已习得 Lv2 → 法术表 UPDATE 该行：按改名规则更新 spell_name、tier=3、source=新来源、learn_log 追加
   - 若已习得 Lv3 → 静默拒绝（不计数、不提示、不写表）
4. **输出格式**：「法术习得：{法术名} Lv{X}→Lv{Y}（来源：{书籍名/卷轴名/NPC 名}）」
5. **副作用**：
   - 升级触发 Lv2/Lv3 强化效果（叙事层面）
   - NPC 教学好感 +5~+10（NPC 投入情感）
   - 卷轴习得：载体消失（一次性消耗）
   - 主角表 `spell_count` 同步更新（仅 INSERT 时 +1，UPDATE 不变）

### 与战利品的对应

- 战利品习得需 AI 根据物品类型判定可习得法术类别（按「战利品系统」投骰 + 物品描述）
- 高阶物品（大师法术书、传奇法术书）需配套 NPC 指导或势力声望（如皇室宝库、大教堂密室）
- 战利品习得不消耗主角表 `spell_annual_count`（本表暂无年度限制，与技能 `skill_annual_count` ≤5/年 不同）

### 与检定的衔接

- 法术使用时的检定：按「施法检定」条目：`d20 + 智力调整值 + PB` vs DC（按法术等级递增）
- 法术习得检定：按「学习检定·法术习得检定」执行（DC 由法术书等级决定，习得场景不走施法行的法术等级 DC）
- **不持杖**：法术检定承受劣势（掷两次取低，见「施法检定」）

### 输出格式

法术习得/升级事件按 `<spell>` 标签输出（字面格式与字段说明见「输出格式」条目 `<spell>`（法术习得/升级）模板；习得一旦升级则不在 `<check>` 重复表达）；本条目只讲机制，不重抄排版。重复习得改名（·精通/·奥义）与最高 Lv3 后静默拒绝见本节七。

---

## 八、法力恢复路径（长休 + 药水）

> 本节为法力恢复场景特化。法力上限与消耗按本节上方「法力值体系」（MP 每日池）；**法力药水配方与价格的权威源为「炼金配方表·法力类」**（自本节迁出，原散在「矿物与材料总纲·法力恢复消耗品」的配方指向一并收拢到炼金配方表）；本节只讲恢复路径与纪律。

### 三档恢复路径

| 档位 | 方式 | 恢复量 | 触发条件 | 代价 |
|------|------|--------|---------|------|
| **主路径** | 每日首次长休 | MP 全满（每日 1 次） | 角色进行 6+ 小时完整睡眠 | 0 金（剧情节奏点）|
| **药水恢复** | 消耗品 | +5/+15/+30/全满（按档位） | 任意时刻可用 | 按道具价格（5/25/80/200+ 金）|
| **短休部分恢复** | — | 不恢复（明确划开血条与蓝条） | — | — |

### 药水纪律（急救包定位）

- **药水不受短休次数限制**（任意时刻可使用，无休息节律约束）
- **药水恢复不消耗介质**（介质是施法消耗，不是法力补充消耗）
- **药水恢复不触发大失败**（纯资源补充，与检定无关）
- 药水**不叠加上限**：使用后 MP 超过上限时，多余部分作废（不会出现「溢出 24 小时」）

### 道具分类与配方（权威源「炼金配方表·法力类」）

> 4 档法力药水（低阶 +5 MP / 中阶 +15 MP / 高阶 +30 MP / 传奇全满）的**原料、制作 DC、价格、强度影响以「炼金配方表·法力类」为准**，本节不重列配方；恢复量与档位速查见上方「三档恢复路径」表。

### 道具获得途径

- **炼金制作**：主角拥有「药剂炼制」技能（按「技能总纲」工艺场景六类关键词现场习得）→ 按「炼金规则」一次判定定成败（走锻造检定智力分支 vs 配方 DC），成功掷药效强度骰定档；成本 = 基准价 ÷2、失败材料全耗
- **商人购买**：城市药水商（公会/聚落商店按「世界观-经济」第 89 行零售价）；偏远聚落上浮 20~50%
- **战利品**：击杀魔法生物、搜查施法者遗物（按「战利品系统」d20 投骰）
- **NPC 赠予**：任务奖励 / 关系友好以上 NPC 主动给予（与 14 名有档案 NPC 联动）

---

## 接口与权威

- **唯一权威源**：本条目。法术效果全部走既有机制（检定/伤害/状态/元素交互），不重抄
- **与词缀系统联动**：词缀「火焰/淬毒/符文精通」与对应法术效果有边界：词缀是装备常驻触发，法术是一次性主动
- **与法杖联动**：法杖是施法媒介（推荐持杖，可不持但劣势），物理 1d4 钝击；耐久扣减按「法杖」节
- **与改造件联动**：护甲改装件「铆钉加固」的格挡优势覆盖法术攻击（火球/冰风暴也走命中 vs AC）
- **与状态池联动**：本表法术触及的「燃烧/中毒/寒冷/减速/束缚/石化/隐形/护体/恐慌/加速」全部为既有 28 状态池内状态，无新增
- **法术习得路径**：见本节七（五来源 + 书籍卷轴特化；与「技能总纲」五来源平行）
- **法力恢复路径**：见本节八（长休全满 + 药水消耗；法力药水配方/价格走「炼金配方表·法力类」）
