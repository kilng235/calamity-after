## 一、火焰学派（3 条）

> 核心：伤害 + 燃烧 DoT + 热效应；与燃烧状态、元素交互「水熄/毒燃」联动

### 【火把】火焰·1 级
- 动作：主行动｜接触｜即时
- 检定：按「施法检定」 vs DC12
- MP：5
- 效果：点燃一盏火把/篝火/蜡烛/火绒；野外场景必备
- 载体：卷轴（一阶 30 金/卷）/ 书籍习得

### 【火焰箭】火焰·2 级
- 动作：主行动｜远程 30m｜即时
- 检定：按「施法检定」 vs DC15
- MP：10
- 效果：2d6 火焰伤害；可与词缀「火焰」叠加
- 载体：卷轴（二阶 80 金/卷）/ 书籍习得

### 【火球术】火焰·3 级
- 动作：主行动｜远程 40m·半径 5m｜即时
- 检定：按「施法检定」 vs DC18
- MP：15
- 效果：中心点 3d6 火焰伤害，边缘 1d6；命中目标挂「燃烧」（元素交互毒燃联动）
- 载体：卷轴（三阶 150 金/卷）/ 书籍习得

