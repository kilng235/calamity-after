# 法术总纲（5 学派·18 法术·MVP 版·1~3 级）

> 本节为法术数据词典。施法检定（公式/DC/施法顺序/不持杖劣势/卷轴施法）见「施法检定」条目；法术习得检定见「学习检定」条目；法术效果的状态/元素交互按「状态列表」裁定；法术伤害走「战斗规则·伤害类型」。本节不重抄检定机制。
> **MVP 范围**：6 学派 × 3 条 = 18 条法术，覆盖 1~3 级。4~5 级法术后续扩展。

## 总则

- **智力域**：魔法、炼金、药剂、鉴定、学问（按「属性系统·六维总览」）
- **施法媒介**：推荐持法杖（按「法杖」），不持杖施法检定承受劣势（见「施法检定」）
- **法术书等级体系**（5 档制，本版覆盖 1~3 级）：
  - **1 级（初阶）**：日常仪式、点火、侦察、辅助：智力 8 能看懂，5 MP
  - **2 级（中阶）**：战斗辅助、范围法术、治疗：智力 10 解锁，10 MP
  - **3 级（高阶）**：主力伤害、控制场、终结技：智力 12 解锁，15 MP
  - **4 级（大师）**：未来扩展：智力 14 解锁，15 MP（与 3 级持平）
  - **5 级（传奇）**：未来扩展：智力 16 解锁，15 MP（封顶）
- **智力双职责**：
  1. **可学等级上限**：智力 8=只能学 1 级；智力 10=1~2 级；智力 12=1~3 级；智力 14=1~4 级；智力 16~20=1~5 级
  2. **MP 上限**：决定每日可施法的总池大小（按下方速查表）
- **法力值体系（MP）**：
  - **MP 上限 = 智力 × 5**（8=40，10=50，12=60，14=70，16=80，18=90，20=100）
  - **施法顺序**：扣 MP → 消耗介质（卷轴）/ 无（书籍习得后）→ 施法检定（见「施法检定」）
  - **MP 不足**：法术不可用（不进入检定阶段）；恢复方式 = 每日首次长休（MP 全满）+ 4 档药水道具
  - **短休不恢复 MP**（避免与血条混淆；只有长休 + 药水能恢复）
- **5 级封顶**：5 级法术固定扣 15 MP，与智力档位无关（4 级也扣 15，3 级也扣 15）
- **法杖规则**：
  - **持杖**：标准流程，无修正
  - **不持杖**：法术检定承受劣势（掷两次取低，见「施法检定」）；叙事「徒手施法勉强维持，效力大打折扣」
  - 法杖耐久 −5 / 大失败（d20=1）= 沿用既有规则
- **法术获得路径**：见下方 §习得路径：五来源（书籍习得为核心；卷轴施法不需习得；NPC 教学/模仿/社交/旁观与技能五来源平行）

