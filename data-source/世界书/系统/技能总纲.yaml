# 技能系统（DND 检定随机习得）

## 三层能力边界（避免 AI 混淆）

- **种族特质**（自动获得）：来自种族条目，检定获优势；不存主角表
- **背景特质**（最多 2 项）：开场白自选，主角表 sheet_main.talents；检定获优势
- **技能**（无数量上限）：五来源习得，技能表 sheet_skills（每项技能一行）；含等级 Lv1~3

三者**同源**（都按通用检定触发优势或加值），但叠加规则不同：
- 同动作同时有种族特质 + 背景特质 → 仍为一次优势（不叠加）
- 同动作同时有特质 + 技能 → 优势（来自特质）+ PB 加值（来自技能）= 两套独立加值可叠加

## 习得机制

> 习得检定口径（d20+主属性+PB vs DC、PB 总计入、不发检定经验）、DC 档位（10 基础/15 熟练/20 精通）与主属性场景映射（6 类）的权威源为「学习检定」条目；d20 检定公式、优势/劣势合并、大成功/大失败后果按「通用检定 §0 场景调度表 + §1~§7」执行，本节只写触发来源，不重抄检定细则。

### 五来源触发条件（任一即触发习得判定）

1. **正式 NPC 教学**：与 14 名有档案 NPC 关系友好以上 + 关键检定大成功（天然 20 或总值≥DC+10）→ NPC 主动传授
2. **随机 NPC 战斗模仿**：击败无名 NPC（按 NPC生成规则生成）→ 战后模仿检定
3. **随机 NPC 社交获得**：帮无名 NPC 完成某事 → NPC 主动感谢传授
4. **随机 NPC 旁观学习**：路遇高手演示动作（不一定是战斗）→ 旁观检定
5. **战利品习得**：拾取特定物品/书籍/卷轴 → 研读检定或长期持有渗透

## 现场生成规则（AI 必须按此生成技能名）

### 命名格式

`{场景关键词}+{动作动词}`

### 六类场景关键词

- **武器**：剑术斩击 / 斧术劈砍 / 弓术连射 / 锤术重击 / 长枪穿刺 / 匕首暗刺
- **治疗**：草药熬制 / 伤口缝合 / 急救包扎 / 净化解毒
- **工艺**：金属锻造 / 药剂炼制 / 皮革缝制 / 木工雕刻 / 织物编织
- **社交**：讨价还价 / 言语说服 / 威吓压制 / 鼓舞士气 / 暗中观察 / 伪装身份
- **观察**：视觉追踪 / 听觉定位 / 痕迹辨识 / 地形记忆
- **战利品**：物品名 + 「掌握」/「精通」/「亲和」（例：灾厄金属·亲和、神陨碎片·解读）

### 重复习得改名规则

- 第二次习得：原名 + `·精通`（例：剑术斩击·精通）
- 第三次习得：原名 + `·奥义`（例：剑术斩击·奥义）
- 改名后视为同一技能，再次习得触发升级判定

## 等级系统（每项技能 Lv1~3 上限）

| 等级 | 触发 | 加值 | 备注 |
|------|------|------|------|
| Lv1 | 首次习得 | +PB | 基础加值 |
| Lv2 | 重复习得（同技能名） | +PB+2 | 部分技能解锁强化效果 |
| Lv3 | 第三次习得 | +PB+4 | 全部技能解锁完整强化 |

**上限后行为**：Lv3 后再次习得同技能 → **静默拒绝**（不提示、不计数、不写入）

## PB 公式

按「属性系统 §能力值汇总索引 + 通用检定 §1」：`PB = 1 + ⌈等级/4⌉`（DND 5e 标准，Lv1~4=+2/Lv5~8=+3/Lv9~12=+4）；本卡升级节奏按「经验与成长 §4·等级进度总表」一行查全。

## 字段映射（数据库表格）

技能明细存于独立的「技能表 sheet_skills」（每项技能一行；数据库表格为通用模板，不绑定本卡）；主角表仅保留年度计数。

| 表 | 列 | 类型 | 含义 |
|----|----|------|------|
| sheet_skills | `skill_name` | TEXT (UNIQUE) | 技能名（唯一定位键；升级改名时同步更新） |
| sheet_skills | `level` | INTEGER | 等级 Lv1~3 |
| sheet_skills | `source` | TEXT | 最近一次习得/升级的来源（NPC 名/模仿对象/物品） |
| sheet_skills | `learn_log` | TEXT | 累计习得与升级日志（每条含等级、来源、检定、时间） |
| sheet_main | `skill_annual_count` | INTEGER | 本年度随机 NPC 来源习得次数（≤5/年） |

## AI 行为（CoT 步骤「技能习得判定」）

1. **触发检测**（五来源任一）
2. **习得判定**：
   - 查技能表该技能名所在行：无行 = 未习得；有行读 level
   - 若未习得 → 技能表 INSERT 新行（Lv1），写入来源与习得记录
   - 若已习得 Lv1 → 技能表 UPDATE 该行：按改名规则更新技能名、level=2、source=新来源、learn_log 追加
   - 若已习得 Lv2 → 技能表 UPDATE 该行：按改名规则更新技能名、level=3、source=新来源、learn_log 追加
   - 若已习得 Lv3 → 静默拒绝（不计数、不提示、不写表）
3. **输出格式**：「技能习得：{技能名} Lv{X}→Lv{Y}（来源：{...}）」
4. **副作用**：
   - 升级触发 Lv2/Lv3 强化效果（叙事层面）
   - NPC 教学好感 +5~+10（NPC 投入情感）
   - 随机 NPC 来源同步更新主角表 `skill_annual_count`（≤5/年）

## 与 NPC 的关系

- 14 名正式 NPC 的可教技能**不在本条目列出**，由检定场景现场生成
- 同一 NPC 一生只教 1 项技能（避免重复刷技能）
- 不同 NPC 教同名技能可视为「重复习得」→ 触发升级
- 无名 NPC 不入关系表；其教学行为仅记入技能表（source/learn_log）

## 与战利品的对应

- 战利品习得需 AI 根据物品类型判定可习得技能类别
- 高阶物品（灾厄金属成品、神陨碎片、符文学派武器）需配套 NPC 指导或势力声望
- 战利品习得不消耗主角表 `skill_annual_count`（不计入年度限制）

## 与检定的衔接

- 技能使用时的检定：按「通用检定 §1」：`d20 + 调整值 + PB` vs DC
- 技能习得检定：按「学习检定·技能习得检定」执行
- 技能 vs 特质 vs 种族特质的叠加规则见本条目第 1 段

## 输出格式

技能习得/升级事件按 `<skill>` 标签输出（字面格式与字段说明见「输出规范-技能」条目）；本条目只讲机制，不重抄排版。

