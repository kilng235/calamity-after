# 炼金规则（药剂炼制独立玩法）

> 本条目为炼金玩法权威源。炼金把分散的「药剂/消耗品/炼金工具/药水」材料整合为可自炼循环。d20 检定公式、优势/劣势合并、大成功/大失败后果按「通用检定 §0 场景调度表 + §1~§7」执行；具体配方（原料/DC/基线药效/强度影响）见「炼金配方表」。

## 定位与判定接口

- **主属性**：智力（炼制、鉴定、调配，按「属性系统·六维总览」智力覆盖「魔法、炼金、药剂、鉴定、学问」）
- **判定复用「锻造检定」**：不新建检定条目；炼金走锻造检定的智力 + 炼金工具分支，公式 `d20 + 智力调整 + 持炼金工具优势` vs 配方 DC
- **DC 按成品档位**：一阶 DC10 / 二阶 DC15 / 三阶 DC20（对应法力药水 5/25/80/200+ 金档，明细以「炼金配方表·法力类」为准），DC 权威源在「炼金配方表」每行
- **骰子来源**：从「骰子池」取用，不编造；检定过程在正文展示 `d20({骰值}) + {智力调整} = {总值} vs DC{配方DC}`

## 工匠工具

- **炼金工具**：用途=药剂、法杖、施法媒介；对应属性=智力；价格/占槽按「世界观-经济」「背包系统·物品分类」；持工具获优势、徒手劣势，按「锻造检定·工具优劣」
- 工具可借用（借铺费按「炼金代工」基准价）；炼金工具 1 槽/件

## 成-败-大失败（一次检定定成败）

> 炼金成败只有三档：**失败直接材料打水漂，零产出**（与锻造"失败留可用件"不同）。

| 结果 | 判断 | 材料 | 产出 |
|------|------|------|------|
| **成功** | 总值 ≥ 配方 DC | 消耗 | 掷药效强度骰 → 弱/标准/强/完美档成品 |
| **失败** | 总值 < 配方 DC（非天然1）| 消耗、**不返还** | **无成品**（不产出、不可用） |
| **大失败** | 天然 1 或总值大幅未达标（按叙事自查，参考通用检定 §4）| 消耗、**不返还** | 无成品 + **事故物**（带「杂质/不稳定/剧毒」负面瑕疵词条）+ 事故叙事 |

- **失败代价**：原料成本 = 成品基准价 ÷2 全额亏损，玩家自担——因此**低 DC 稳妥配方**与**高 DC 博档配方**的取舍是炼金的核心决策
- **天然 1** → 强制大失败；**天然 20** → 品质档上移一档（见「品级爬升」），且视为炼成成功
- 大失败事故物处理：可丢弃、可出售（价被压至基准价成数，按「世界观-经济」议价）、不建议使用（按诊断瑕疵词条叙事）

### 失败瑕疵词条（事故物）

- 杂质（药效混乱、副作用）、不稳定（碰撤易炸、需即时使用）、剧毒（误用中毒）等；AI 从配方背景诊断，写 1~2 句事故叙事
- 瑕疵物**不可修复**（炼药不可二次精炼回正；对锻造"失败可修"的差异说明，防止混用）

## 药效强度骰

> 成功必出货，但药效强弱由强度骰决定。成功炼成后从「骰子池」掷一枚 d10，按档位确定这瓶（这批）药剂的最终药效。

| d10 | 强度档 | 药效表现 |
|-----|--------|---------|
| 1 ~ 2 | 弱 | 药效按配方基线一半（如治疗 20→10），或带轻微副作用 |
| 3 ~ 7 | 标准 | 按配方基线全效 |
| 8 ~ 9 | 强 | 药效按基线加倍，或附加 1 条增益状态 |
| 10 | 完美 | 药效上限 + 保留 1 个配方特质（如延长时效 / 药效可控） |

- 强度档只量化成品**自身药效强度**，不引入独立伤害数值层，强度档不记入配方名

## 品级爬升（复用锻造良品/杰出档）

> 炼金判定同样按富余值（总值−配方 DC）分品质档；只影响能否触发进阶特性，不改变药效强度骰结果。

| 富余值（总值−DC） | 品质档 | 成品特性 |
|------------------|--------|---------|
| `0 ~ +4` | 普通 | 无额外特性 |
| `+5 ~ +9` | **良品** | 强度骰结果 +1 档（弱→标准，标准→强）|
| `≥ +10` | **杰出** | 强度骰结果 +1 档 + 成品获得 1 条配方特质 |

- 天然 20 → 品质档上移一档（普通→良品；良品→杰出）
- 品质档以一句叙事呈现，不引入独立状态或标签

## 材料成本

- **自炼成本 = 成品基准价 ÷2**（示例：治疗药水 2 金 → 1 金；力量药剂 5 金 → 2.5 金）
- 稀有/传说原料（灾厄金属、能量晶簇等）按「世界观-经济·收购与任务」零售价另计，不套 ÷2
- 失败/大失败**不返还材料**
- 法力药水等资源类配方成本一致走 ÷2，恢复路径见「法术总纲·法力恢复路径」

## 炼金代工（对标铁匠代工）

| 炼金/工匠 | 位置 | 种族 | 擅长 | 价格区间 | 备注 |
|----------|------|------|------|----------|------|
| 杜兰·碎星 | 流浪（锈钉镇偶驻）| 犬人 | 稀有炼金、禁忌药剂、灾厄金属精炼 | +30~50% | 流浪炼金术士，唯一可加工禁术材料的铁匠 |
| 艾莉丝 | 锈钉镇「苔藓与露」药剂店 | 银叶精灵 | 银叶药剂、净化苔藓、草药 | 基准价 | 出售成品，不接代工 |
| 艾拉·棘藤 | 灰烬森林 | 精灵 | 草药工艺、自然系 | +20~40% | 银叶营地合作订单，自然系专精 |

- 代工价以「世界观-经济」药水零售价为锚，按百分比浮动；好感度折扣（冷淡+20%、友好−10%、信任亲密−20~30%）按「关系系统」档位
- **主角自炼** vs **找代工** 的取舍：自炼成本半价但承担失败亏损；代工按表价但稳出货

## 习得途径

- 主角需掌握「药剂炼制」技能才可自炼（缺失时只能按代工/购买）；习得走「技能总纲」工艺场景五来源现场习得 + 「学习检定」
- 无药剂炼制技能时：可持炼金工具做「仿制」检定（承受劣势），但大失败风险提升；写入塑造叙事

## 与其他条目接口

- **规则接口**：判定公式/工具走「锻造检定」，DC 与配方走「炼金配方表」，成败/强度/品级本节定义，材料与价格按「世界观-经济」「矿物与材料总纲」，工具占槽按「背包系统」，成品消耗品使用按「背包系统·使用」
- **产出品相**：成品品质档（普通/良品/杰出）不叠加收购品相骰（「战利品检定·品相」只管搜刮掉落，二者独立）
- **法力双源收口**：法力药水配方在「炼金配方表·法力类」，法术总纲只保留「恢复路径」引用，不重列配方与价格
- **货币纪律**：所有价格按「世界观-经济」取用，正文银币先折算为金币（1 金 = 10 银）再记入金币
