# 装备总纲（西幻 / 中世纪 / 废土 / 符文）

## 美学四原则

- **西幻**：武器涵盖剑/斧/弓/弩/锤/矛/匕首/法杖，材质以铁铜银为主，工艺来自王国锻造传统
- **中世纪**：皮甲/锁甲/板甲三阶防护，金属质感，铆钉/皮带/扣环细节，重视穿戴感与破损修补痕迹
- **废土**：废土世界特有的拼接破损美学，铁与皮革拼凑、变异生物皮革、符文补缝、焦木剑柄；不以「光鲜崭新」为美
- **符文**：藤蔓纹饰（精灵）、符文雕刻、血晶石/星铁的灾厄残留能量外溢；不以「金碧辉煌」为美，追求能量感与历史感

## 7 槽位定义

| 槽位 | 可放装备 | 备注 |
|------|----------|------|
| 主手武器 | 任一武器 | 双手武器占此槽（无双持槽） |
| 副手武器 | 盾牌 / 副手轻武器 | 双持时副手可填轻武器（匕首/短剑/短矛），结算见战斗规则·双持 |
| 头部 | 头盔 / 全罩盔 | — |
| 身体 | 皮甲 / 锁甲 / 板甲 / 手套 / 护腿 / 肩甲 | 手套/护腿/肩甲无专属槽归此 |
| 足部 | 铁靴 | — |
| 饰品1 | 戒指/护符/护腕/腰带/项链/挂坠/徽章 | 与饰品2 同类型可并存 |
| 饰品2 | 同上 | — |

## 装备原则

- **数值为战斗规则服务**：武器伤害骰被「战斗规则·伤害公式」直接读取；护甲 AC 加成被「战斗规则·AC」直接读取；本条目不另写「+1 命中/+2 伤害」式直接加值
- **双源为零**：装备数值仅出现在各武器/护甲单文件与「战斗规则」中；其他条目不复制数值
- **价格卡入经济条目**：所有装备价基准按「世界观-经济」条目取用，本表价格与经济条目一致
- **词缀以状态表达**：词缀不直接加数值（数值层只有工艺改装件）；攻击词缀命中挂负面状态（如「灰啖」匕首命中挂出血），穿戴词缀场景自获有利状态；词缀数 = 装备品质（普通 1 / 罕见 2 / 稀有 2 / 史诗 3 / 传说 3，见「词缀表」）；词缀生成由 AI 按材料主题随机抽取并自由起名
- **种族装备传统**：矮人工匠系（铁/秘银/黑曜铁锻造）、精灵符文学派（银/符文雕刻/符文学派）、犬人信使工具（铃尾信使网络/嗅觉追踪装备）、灵耳族精密件（开锁/陷阱/机关）、兔耳斥候装（轻皮甲/负重优化）、猫人夜行装（暗色皮甲/无声靴）等，各族装备沿用种族特质条目
- **废土变体**：焦木巨蜥皮甲、灰烬狼皮披风、变异生物皮革等废土变体视为「同型护甲+叙事词缀」，不单列数值
- **超重与笨重惩罚**：重量超过负重上限（按背包系统）的武器/护甲，相关力量/敏捷检定劣势（叙事化，不强制数值）；锁甲/板甲/全罩盔穿戴者不获敏捷调整值
