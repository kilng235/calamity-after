# 经验与成长（成长体系唯一权威源）

> 本条目管：XP/等级/属性点/佣兵等阶/属性训练。不管：技能 Lv（技能总纲）、法术习得阶与 MP（法术总纲）、装备品质与词缀（词缀表/锻造规则/炼金规则）、好感人情声望（关系系统）、金币（经济）、命运点（通用检定 §7）。

## §0 成长轴总览（一切"变强"走哪里，一张表回答）

| 成长轴 | 驱动资源 | 数值权威源 |
|--------|---------|-----------|
| 角色等级 | XP（本条目） | 本条目 §1~§4 |
| 属性值 | 属性点/训练/特殊事件 | 本条目 §6 + 属性系统 |
| 技能 Lv1~3 | 同技能重复习得 | 技能总纲（无 XP 参与） |
| 法术习得阶/MP | 智力属性值 | 法术总纲 |
| 装备品质/词缀 | 材料档位+锻造/炼金检定 | 词缀表/锻造规则/炼金规则 |
| 好感/人情/声望 | 关系事件 | 关系系统 |
| 佣兵等阶 | 角色等级 | 本条目 §4/§5 |

- 各轴并行、互不兑换：XP 换不来技能等级，好感换不来等级，金币只买训练与洗点服务（§6）不买经验
- 检定经验与检定所用属性无关，一律入全局经验池；升级属性点自由分配到任意六维

## §1 经验来源总表

| 来源 | 数值 | 数值权威 |
|------|------|---------|
| 战斗 | 按「生物总纲·危险等级表」击败经验列（低 5~10 / 中 15~25 / 中高 25~40 / 高 40~50 / 极高 50+） | 生物总纲 |
| 任务 | 杂务 5~10 / 日常 15~30 / 危险 30~60 / 高危 60~100 / 灾厄级 100~150 | 本条目 |
| 探索 | 发现隐藏 10~20 / 解开谜题 15~30 | 本条目 |
| 社交目标 | DC10 档目标 5 / DC15 档目标 10 / DC20 档目标 15 | 本条目 §3 |
| 创意解法 | 用非预设方式解决问题（AI 裁定）5~20 | 本条目 |
| 检定 | 按 §2 细则 | 本条目 |

- 任务/探索/战斗三类为经验三足鼎立（对齐神界原罪式来源结构），其余为补充调剂；所有经验结算后更新等级/属性点/最大生命值（按 §4）

## §2 检定经验细则

- **发放条件**：非重复检定**首次**成功。「同一类型」按**动作域**计——权威清单 = 「通用检定 §3」九特质域：武艺(敏)/学识(智)/工艺(力·智)/潜行(敏)/警觉·侦察(感)/交涉(魅)/巧手·撬锁(敏)/攀爬(力·敏)/医疗(感·智)。同域只在首次发，跨域各发一次；无法归域的检定由 AI 按最接近域裁定
- **次数上限**：每次结算（单次 <user> 行动的完整结算）最多发放 3 次检定经验
- **数值**：DC10 → 2 XP / DC15 → 5 XP / DC20 → 10 XP
- **非档位 DC 按就近低档计**：DC11~14 记 2 XP / DC16~19 记 5 XP / DC21+ 记 10 XP（覆盖施法 DC12/18/22、鉴定术 10/12/15/18/20、隐藏 DC、NPC 战斗模仿与旁观学习 DC 等非三档场景）
- **不发放清单**（以下均不发检定经验）：
  - 战斗命中检定（战斗经验由击败生物统一发放，见 §1）
  - 技能/法术习得检定
  - 战利品投骰/品相/容器/丰度（d20 范围掷取，非检定）
  - 对抗检定（对抗胜出的获益由叙事结算，不发经验）
  - 战斗内非攻击 d20 检定（借机闪避/挣脱/抵御恐惧等自救动作）
  - 属性成长检定（成功得属性 +1 本身即奖励，不叠加经验，见 §6）
- **大成功/大失败**：天然 20 不加发经验（额外收益仅叙事层，按通用检定 §4）；天然 1 无经验
- **设计声明**：战斗与社交类来源占比天然偏高、体质类玩法（抗毒/抗病/拼酒）多为对抗或自救而不入经验池，属刻意设计非遗漏

## §3 社交经验与检定经验的关系（语义切分，两类触发互斥）

- **单次社交检定**（说服/请求/交易等一次性成功）→ 按本条目 §2 检定经验发放；社交检定 DC 来自「关系系统」好感五档表（10/15/20，均在三档内）
- **社交目标完成**（跨场景的有难度社交目标：谈成长期契约、化解势力敌意、取得关键情报等）→ 按本条目 §1「社交目标」档发放 5/10/15 XP
- 目标完成结算时，过程中已按 §2 发放过的单次检定经验不追回、不重算

## §4 等级进度总表（升级/属性点/PB/等阶一行查全）

| 等级 | 累计 XP 达标 | 本级属性点 | 属性点累计 | PB | 佣兵等阶 |
|------|-------------|-----------|-----------|-----|---------|
| 1 | —（起始） | — | 0 | +2 | 见习 |
| 2 | 50 | +1 | 1 | +2 | 见习 |
| 3 | 150 | +1 | 2 | +2 | 正式 |
| 4 | 300 | +1+1（ASI） | 4 | +2 | 正式 |
| 5 | 500 | +1 | 5 | +3 | 精锐 |
| 6 | 750 | +1 | 6 | +3 | 精锐 |
| 7 | 1050 | +1 | 7 | +3 | 王牌 |
| 8 | 1400 | +1+1（ASI） | 9 | +3 | 王牌 |
| 9 | 1800 | +1 | 10 | +4 | 王牌 |
| 10 | 2250 | +1 | 11 | +4 | 传奇 |

- 10 级以上照公式延续：本级升级所需 = 当前等级 × 50；属性点每级 +1、每逢 4 级额外 +1（ASI 节奏，对标 D&D 5e）；PB 每 4 级 +1（Lv13 +5 / Lv17 +6）
- 经验每满阈值自动升 1 级，溢出经验保留到下一级；无硬等级上限
- 升级结算：最大生命值 +10（HP 上限 = 100 + 10×(等级−1)，派生权威「属性系统·属性派生」）；升级时输出升级行，跨等阶按 §5 叙事升阶

## §5 佣兵等阶（角色等级的公会映射）

> 佣兵等级 = 角色等级（XP 体系），不是独立成长线。佣兵公会在派发悬赏时按等阶设接取上限；野外自主冒险不受限，但越档冒险公会不背书（无任务保险与公会救济）。

| 等阶 | 角色等级 | 可接任务档位上限 | 对应待遇 |
|------|----------|------------------|---------|
| 见习佣兵 | Lv1~2 | 杂务/日常 | 基础悬赏板权限 |
| 正式佣兵 | Lv3~4 | 危险 | 可领公会预付金，优先选单 |
| 精锐佣兵 | Lv5~6 | 高危 | 独立悬赏板，可带新人组队，解锁公会洗点服务 |
| 王牌佣兵 | Lv7~9 | 灾厄级 | 公会直接委托 |
| 传奇佣兵 | Lv10+ | 不设限 | 势力级委托引荐，留名公会石碑 |

- 佣金抽成按等阶执行，数值唯一权威源为「经济·服务与杂项」佣兵公会佣金行
- 等阶门槛只约束**公会悬赏**；势力任务看声望档位、个人请求看好感档位（按「任务系统·任务来源与接取」），三条门槛互不替代
- 升级跨等阶时，正文叙事体现升阶（回锈钉镇公会换徽记、登记簿更新、熟识 NPC 态度微调）；未回公会办理前按旧等阶待遇执行
- 紧急征召/名人担保可越档接取一次（AI 裁定，需叙事合理化）

## §6 属性成长通道（属性值增长的全部途径，数值权威源）

> 属性值只经以下三条通道增长，别无他途；属性成长检定不发检定经验（见 §2 不发放清单）。经验体系之外不存在免费的属性成长。

| 通道 | 获取方式 | 成本/限制 |
|------|----------|-----------|
| 升级属性点 | 升级获得（节奏见 §4 等级进度总表），分配时机与存储见「属性系统·属性点分配」 | 属性上限 20，溢出属性点可存 10 点 |
| 训练成长 | 导师指点或训练设施自我训练：`d20 + 受训属性调整值` vs DC20，成功该属性 +1 | 每次半个游戏日；导师学费 2~5 金（熟练工匠日工钱 2~4 金尺度，见「经济·工钱锚」）；自我训练付设施日租 1~2 金且 DC+5；受训属性 ≥16 时 DC+5（越强越难涨）；同一属性每周至多 1 次 |
| 特殊事件 | 祭坛/奇遇/深渊残响（按区域条目触发）：同上检定，DC15 | AI 叙事触发，同一属性每周至多 1 次 |

- 训练来源：导师须专业维度匹配（矮人=力量、精灵=智力、犬人/猫人=敏捷等，按「种族总纲」）；设施=工坊/练武场/行会训练桩
- 属性成长检定的大成功/大失败按通用检定 §4 叙事处理，不加发任何经验、不连升属性
- 洗点：精锐等阶起可向公会申请重排已分配属性点，50 金/次（服务费锚「经济·服务与杂项」）；技能等级、等阶与已获经验不可重排

## §7 输出与结算时点

- 经验/等级/属性变动经 `<exp>` 标签输出（字面格式见「输出格式-经验」）：经验行、属性行、升级行按实际变动组合输出；属性 +1 与属性点分配均须输出属性行；结算时点按「结算协议 §G 审查」执行
