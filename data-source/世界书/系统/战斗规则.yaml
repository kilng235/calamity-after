# 战斗规则（轻量回合制）

> 命中/伤害/暴击大失败/部位瞄准/先攻等检定机制见「战斗检定」条目；d20 检定公式、优势/劣势、大成功/大失败后果按「通用检定 §0 场景调度表 + §1~§7」执行，本条目只讲战斗非检定机制（耐久/双持/回合/状态/面板），不重抄。

## 词缀状态挂载

- 词缀状态挂载：当前武器的攻击词缀命中时挂载对应负面状态（挂载表见「词缀表」，同一命中只附加一种状态）；穿戴词缀按场景自获有利状态

## 武器耐久度追踪（嵌入战斗结算）

- 每次武器命中：当前武器耐久 −1
- 每次武器射击（远程）：当前武器耐久 −1
- 大失败（天然掷出1）：攻击方武器额外 −5 耐久（仅武器，防具不受此影响）
- 武器耐久状态：
  - 51~上限：正常
  - 1~50：破损（攻击检定承受劣势）
  - 0：报废（不可用）

## 防具耐久度追踪

- 每次防具被命中：当前防具耐久 −伤害等额
- 防具耐久状态：
  - 51~上限：正常
  - 1~50：破损（AC 加成 −1）
  - 0：报废（不提供 AC 加成）

## 双持

- 双持条件：主手+副手各持一把轻武器（匕首/短剑/短矛，伤害骰≤1d6）；重武器与盾牌不可双持
- 主手攻击：主行动，命中与伤害按「战斗检定·命中与伤害」执行
- 副手攻击：机会行动，单独命中检定（按「战斗检定」）；命中后掷副手武器伤害骰，不加属性调整值（副手只吃伤害骰，灵巧武器的敏捷替代同样不生效）
- 骰子来源：主副手攻击分别从骰子池对应骰型依次取用；暴击/失手按命中规则各算各的
- 耐久：主副手武器各自按命中 −1 扣耐久；大失败（天然掷出1）触发该武器额外 −5
- 双持代价：不持盾（失去副手 AC 加成）；副手武器的词缀状态挂载不生效，只吃其伤害骰；**装「双持锁扣」改装件的副手武器除外**（词缀状态挂载恢复生效，按「锻造规则·工艺改装件」）

## 回合与行动

- 先攻顺序按「战斗检定·先攻检定」掷定，按降序行动；先攻顺序整场战斗保持不变
- 回合：按先攻顺序行动，简化为「一回合一个主行动 + 一次机会行动」（如攻击+移动 / 攻击+拾取），不强制 AP 计数；超量行动需力量/体质检定 vs DC12，过则完成

## 战斗节奏与收敛

- **时长基准**（按敌方最高威胁等级，超限即须启动收敛）：

| 敌方最高威胁 | 合理时长 | 收敛上限 |
|------|------|------|
| 低 / 中 | 2~3 回合 | 4 回合 |
| 中高 / 高 | 4~6 回合 | 8 回合 |
| 极高（首脑/领主级） | 6~10 回合 | 12 回合 |

- **收敛信号**（满足任一即应启动收敛，回合上限只是保险丝）：
  1. 敌方减员过半 → 士气动摇，按习性溃退、求饶或失去章法
  2. 敌人 HP < 25% 且非首脑级 → 转入脱离/求饶倾向（野外生物多不恋战）
  3. 僵局：连续 2 回合双方均无有效输出（互相打不中/打不动）→ 必须引入变化：环境事件、第三方介入、或叙事明示「这仗打不赢也耗不起」并给出替代出路
- **收敛手段**：士气溃退、求饶投降、脱离战场、环境介入（坍塌、援军、野兽过境）；收敛必须给出叙事动机（士气、习性、伤势），**禁止无因放弃或凭空消失**
- **主角撤退裁定**：
  - 玩家声明撤退即成立意图；裁定为对抗检定：主角敏捷调整值 vs 追击者最高敏捷调整值，高者胜（平局主角胜）
  - 自动成功：交战距离 ≥ 10 米、敌人全部处于不良状态、或敌人习性标注不追击
  - 失败后果：被追击一轮（追击者一次机会攻击），之后可再次尝试撤退；不上更重惩罚
  - 撤退后果：战场让渡（位置优势、掉落物放弃）；敌人盘踞如故，同一区域再遇不重置敌意
- **无望战斗提示义务**：敌方威胁显著碾压主角（如低等级闯入极高威胁区域）时，须在接敌前后给出明确的必败信号与活路选项（撤退路线、求饶、隐蔽通道）——允许死亡，但不允许不明不白地死

## 敌人面板

- 敌人面板：名称 ｜ HP ｜ MP（如施法）｜ AC ｜ 威胁等级 ｜ 状态 ｜ 武器耐久 ｜ 护甲耐久
  - 数值按生物总纲危险等级表生成，战斗期间在 battle 卡内维护，战斗结束移除
  - **MP 字段**：仅"施法 NPC"和"会施法的敌人"显示 MP；普通近战/野兽敌人无 MP 字段（省略整列，不写 `MP：—/—`）
  - **面板维护方式**：敌人 HP 变化时，在 battle 卡内以 `[ 名称 HP：剩余/上限 ]` 行体现（格式见「输出格式·战斗」），战斗结束移除

## 伤害类型与抗性

- 伤害类型：劈砍/穿刺/钝击（近战武器）/毒素/燃烧/冲击/流血（物理/特殊来源）；按武器或来源标注
- 抗性：对某伤害类型只受一半伤害（向下取整）；免疫：完全不受伤害；易伤：受双倍伤害
- 来源：生物/装备/词缀标注「XX 抗性/免疫/易伤」时应用；未标注默认无特殊抗性
- 优先级：标注「忽略抗性/免疫」的攻击无视目标的抗性与免疫，伤害照常结算

## 状态效果

- 状态附加：武器命中可附带状态（淬毒刃附中毒、锋锐刃附出血、点燃类附燃烧等，攻击词缀挂载表见「词缀表」），同一命中只附加一种，由叙事择最贴切者（按「状态列表」判定提示）；来源标注于产生它的武器词缀或环境
- 状态效果与解除：28 种状态的效果/解除统一按「状态列表」条目总表裁定（含力竭/燃烧/出血/失衡/侵蚀等），不做每回合数值记账；状态与环境的转化按「状态列表·元素交互」
- 主角持久状态（力竭层次/失明等）随剧情如实延续，不凭空消失也不无限拖延剧情

## 战斗面板输出格式

`<battle>` 标签的字面格式、字段说明、双持格式、强制执行要点见「输出规范-战斗」条目；本规则条目只讲战斗机制（命中/伤害/耐久/双持/先攻/回合/状态等），不重抄排版。

战斗期间按角色独立回合块输出；非战斗检定可在 `<battle>` 内嵌入 `<check>` 标签（见「输出规范-检定」）。

## 受击与结算

- 受击：伤害从主角生命值扣除；敌方伤害按生物总纲数值
- 战斗结束（一方消灭/逃跑/无力化）：战后更新主角生命与经验，战利品记入背包，移除敌人面板
- 战利品判定（投骰/稀有度/品相/势力收购）见「战利品检定」与「战利品系统」条目，不在本规则重复定义
- 装备耐久状态：战后如实记录；破损装备叙事描写带迟滞感，报废装备需先修理才能再用
- **MP 结算（与 HP 同级硬约束）**：
  - **回合维护**：每回合主角（及在场施法 NPC）回合块开头必须显式 `MP：{当前}/{上限}`；未施法写 `MP：{当前}/{上限}（未变化）`；智力<8 写 `MP：—/—` 占位但不省略 MP 行
  - **施法扣费顺序**：扣 MP → 消耗介质（卷轴）/ 无（书籍习得后）→ 施法检定（MP 不足则法术不可用，不进入检定阶段）
  - **施法同步**：施法的 MP 扣费行随施法 `<check>` 输出——置于检定过程行之前（先扣费后掷骰，字面格式见「输出规范-检定」），战斗内嵌入时该行即满足本同步要求，不在 `<check>` 外重复输出；持续法术每轮结算的再扣费在对应回合块内紧跟结算行输出 `MP：{原值}-{消耗}（{新值}）`；扣费等级 1 级 5 / 2 级 10 / 3 级 15（按「法术总纲·MP 消耗表」），延迟/合并/省略视为结算违规
  - **MP 不足提示**：MP 不足时显式标注 `MP：{当前}/{上限}（不足，无法施法）`，正文叙事体现「法力枯竭」
  - **MP 恢复路径**：仅长休全满 + 4 档药水（按「炼金配方表·法力类」），战斗中不允许任意 MP 恢复
  - **MP 上限来源**：主角从「法术总纲·智力档位速查表」取（智力 14 → MP 70），施法 NPC 从「NPC 生成规则·施法档」取；条目未指定则省略该 NPC 的 MP 行
  - **MP 双显是战斗面板字段**：与 HP / AC 并列维护，战斗结束前必须输出主角最终 MP（与最终 HP 双显同步）
- **战斗结束结算单（防漏检）**：双方最终 HP 双显 + 主角最终 MP 双显 + 武器/防具最终耐久双显，缺一即视为战斗结算不完整

## 硬边界

- 命中与伤害以骰子裁定为准，玩家不得直接叙述命中/伤害结果
- 先攻顺序优先于叙事：未轮到其回合的行动不成立；先攻前战斗已结束则该行动作废
- 敌人不留手，每轮尽量行动
- 战斗精英化：参战人数尽量压在 6 人及以下；集群（兽群/兵群）视为同一单位同时行动，不堆怪，要提升难度就提敌人属性或种类
- 武器/防具耐久度按上述规则扣除；破损/报废状态如实记录到战斗面板
- NPC 装备不计算耐久度（节省运算，与「装备总纲」一致）
