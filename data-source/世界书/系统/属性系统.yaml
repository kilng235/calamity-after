# 属性系统（DND 六维 + 成长）

## 六维总览

- 属性值基础 10，创建范围 3~18，普通人类上限 20；调整值 = (属性值 − 10) / 2 向下取整（可为负数）
- 检定公式与 DC 难度见「通用检定」（本条目不重复定义，引用其权威）

### 六维覆盖领域（检定选主属性速查）

- 力量：近战伤害、负重、体力检定
- 敏捷：近战/远程命中、AC、潜行、巧手（开锁/偷窃）、先手
- 体质：毒素/疾病/腐化抗性、耐力
- 感知：侦察、追踪、聆听、暗黑视觉
- 智力：魔法、炼金、药剂、鉴定、学问
- 魅力：说服、威吓、交易、领导

## 六维标度表（3~18）

| 属性值 | 档位 | 描述 |
|--------|------|------|
| 3~5 | 虚弱 | 常人极弱水平（幼童/重病） |
| 6~9 | 挣扎 | 低于常人，勉强维生 |
| 10 | 平均 | 普通成年人基准 |
| 11~14 | 强于平均 | 受过锻炼或有天赋 |
| 15~19 | 人类极限 | 行当顶尖（铁面贾维斯/马库斯·圣火同级） |
| 20 | 上限 | 普通人类理论极限 |

## 调整值速查表

| 属性值 | 调整值 | | 属性值 | 调整值 |
|--------|--------|---|--------|--------|
| 3 | −4 | | 12~13 | +1 |
| 4~5 | −3 | | 14~15 | +2 |
| 6~7 | −2 | | 16~17 | +3 |
| 8~9 | −1 | | 18~19 | +4 |
| 10~11 | +0 | | 20 | +5 |

## 命运点（汇总）

- 每游戏日恢复 1 点（上限 1 点，不积累）
- 花 1 点可重骰任意一次检定，取新结果
- <user> 明示使用时才生效
- 机制权威源：通用检定 §7·命运点

## 属性成长（核心规则）

### 经验与等级（指向）

- 经验来源总表、检定经验细则、社交目标经验与等级进度总表（升级/属性点/PB/等阶一行查全）的唯一权威源见「经验与成长」条目，本条目不再定义经验数值
- 升级收益（等级 +1 → 属性点 +1、最大生命值 +10）见下方「升级收益」节

### 创建期分配（开场白登记档案）

- 六维基础 8，共 18 点可分配（范围 3~18，上限 20）；超支自动回退（只回退正在拖动的滑块，不低于 3）
- 分配在开场白【登记档案】完成（见正则/开场白界面.html），AI 据此设定主角初始数值
- 与「属性点分配」（升级成长）区分：创建期 8+18 点一次性定初始，升级属性点只做成长
- 注：10 为普通人基准（标度表「平均」），8 为创建起点，两者语义不同

### 升级收益

- 等级进度（累计 XP/属性点/PB/等阶）唯一权威源为「经验与成长 §4·等级进度总表」：每级属性点 +1、最大生命值 +10，Lv4/8/12/16/20 额外 +1 属性点（ASI 节奏，表内已含），PB 每 4 级跳档
- 属性点可跨级攒存后集中投入同一属性（等效 5e 的 +2 提升），受属性上限 20 约束

### 属性点分配

- 1 点属性点换 1 点属性（任意六维），属性上限 20
- 溢出属性点可存储，存储上限 10 点
- 分配时机：升级后或任一行军/休整时刻
- 洗点：精锐等阶起可向公会申请重排已分配属性点，50 金/次（服务费锚「经济·服务与杂项」）；技能等级、等阶与已获经验不可重排

### 训练/特殊事件成长（指向）

- 训练成本、导师/设施来源、检定 DC 与频率限制的唯一权威源见「经验与成长 §6·属性成长通道」，本条目不再定义细则

### 属性上限硬约束

- 六维 3~20 是唯一合法数值域，创建不引入 2 以下或 21 以上
- 不引入临时 ±1/±2 数值堆叠（临时增益一律以「优势/劣势」呈现，与「词缀不加数值」纪律一致）

### 属性派生（属性变动的即时联动，数值权威源）

| 派生值 | 公式 | 重算触发 |
|--------|------|---------|
| 最大生命值上限 | 100 + 10×(等级−1)，与体质无关 | 升级时（按「经验与成长 §4」） |
| MP 上限 | 智力 × 5 | 智力变动时（「法术总纲·智力双职责」） |
| AC | 10 + 敏捷调整值 + 护甲 AC 加成 | 敏捷/护甲变动时（重甲不获敏调） |
| 负重上限 | 10 + 力量 × 2 公斤 | 力量变动时（「背包系统」） |
| 先攻加值 | 敏捷调整值 | 敏捷变动时 |

- 属性 +1 经任一通道（升级属性点/训练/特殊事件）落地后，**即时重算受影响派生值**（MP 上限/AC/负重/先攻）并在属性行后同步体现
- 重算不追回历史消耗：MP 只抬上限、当前值不变；负重变动后按「背包系统」复查是否超重

## 能力值汇总索引

| 能力值 | 计算/接口 | 权威源 |
|--------|-----------|--------|
| 命中 | `d20 + 敏捷调整值（近战与远程）+ 武器命中加成` vs 防御值 | 战斗规则 |
| 伤害 | 武器伤害骰 + 力量调整值（近战）；远程不加属性调整值；灵巧武器可用敏捷调整值替代 | 战斗规则 |
| AC | 10 + 敏捷调整值 + 护甲 AC 加成（重甲不获敏捷调整值） | 战斗规则/装备总纲 |
| 负重 | 10 + 力量 × 2 公斤 | 背包系统 |
| 先手 | `d20 + 敏捷调整值` | 战斗规则 |
| 锻造检定 | `d20 + 调整值（力量=钝器/护甲/重型/匕首，精细可智力；智力=药剂/法杖）+ 工具/种族特质优势` vs DC | 锻造规则 |
| 板甲/全罩盔门槛 | 力量 ≥ 15 | 装备总纲 |
| 重甲惩罚 | 锁甲/板甲/全罩盔穿戴者不获敏捷调整值 | 装备总纲 |
| 徒手伤害 | `d6 + 力量调整值` | NPC生成规则 |
| 对抗与挣脱 | 挣脱/对抗用力量调整值（如受擒，按状态列表）；毒素/疾病抗性用体质调整值（d20 + 调整值 vs DC，按生物条目） | 状态列表/生物条目 |
| NPC 四档 | 路人 6~10 / 从业者 10~14 / 行家 14~18 / 顶尖 16~20（专业维度） | NPC生成规则 |
| 种族专业维度 | 各族映射（矮人=力量、精灵=智力、犬人/灵耳族/猫人=敏捷、人类=魅力等） | 种族总纲 |
| 经验/等级/属性点 | 经验来源/检定经验/等级进度总表见「经验与成长」条目；升级收益与属性点分配见本条目 | 经验与成长/属性系统 |
| 熟练加值 PB | `1 + ⌈等级/4⌉`（Lv1~4=+2/Lv5~8=+3/Lv9~12=+4） | 技能总纲 |
