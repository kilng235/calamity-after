# 灾厄概述

## 灾厄本质

- 三百年前，所有神明同时陨落，史称「诸神黄昏」，陨落真相至今无人知晓
- 陨落过程：七日七夜，天空燃烧，神谕断绝
- 陨落后果：魔法紊乱，空间撕裂，生物变异

## 灾厄前

- 黄金纪元：多神并存，魔法普及，文明鼎盛

## 灾厄后

- 王国崩塌，文明倒退，人口锐减
- 神陨之地空间扭曲，至今无法彻底探索
- 魔法体系崩溃，魔法使用者需重新适应
- 部分生物被灾厄能量侵蚀，产生变异
- 神明陨落同时撕裂位面壁障：八个异世界种族被裂隙吞入此界，与原住人类历经冲突与磨合，于灾厄纪年 50 年后完全融入废土社会，成为八大异族与混血后裔；种族名册、各族天赋、混血规则、空间分布与融合史详见「种族总纲」

## 当前时代（灾厄300年）

- 诸国重建，边界常因资源冲突，五大势力各据一方
- 灾厄后出生者对过去一无所知；部分势力试图查明灾厄真相，但真相被刻意掩埋

## 核心谜团

- 为何所有神明同时陨落？是谁发动了灾厄？
- 灾厄前的文明知道什么？神明是否真的彻底消亡？
