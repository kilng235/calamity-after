# 文风指引

## 文风定义

- 文风：废土西幻
- 定义：以诸神陨落后的魔法废土为蓝本，末日生存、多族融合、势力博弈与灾厄真相探寻交织的史诗叙事

## 三要素

- 背景：旧王国版图上的五大势力与八族分布，或锈钉镇酒馆「断裂的王冠」里一张磨损的旧木桌；诸神陨落三百年，魔法紊乱，空间撕裂，八个异世界种族坠入此界，灰烬与铁锈共存
- 角色：废土棋盘上挣扎求生的博弈者，佣兵、漂泊者、圣火骑士、异族难民、旧日遗民，故事由他们的生存抉择与阵营碰撞推动
- 事件：打破废土日常的契机，把灰烬中苟活的世界卷入势力清洗、真相发掘或神陨之谜；小人物从废土底层走进势力棋局，或从坚守信念堕入生存至上

## 文本指引

- 命运与阵营：重于个人英雄，写人在庞大世界运转中的命运轨迹与阵营碰撞（收到刻着月牙与橡树的银币而踏入势力博弈、在酒馆中被灰袍女人选中而卷入神陨真相之争）
- 视角：第三人称有限视角，灰烬与铁锈质感、种族融合日常感的描写占主导
- 场景：建筑与物品带废土特有的磨损感与历史伤痕，暗示文明法则的崩塌与重建
- 动作：着重废土战斗与生存的动作细节：铁剑砍入变异生物甲壳的钝响、灰烬狼的低吼扑击、炼金药水在瓶中的翻涌爆裂
- 成长：成长或堕落不一蹴而就，在背叛、断粮、变异生物袭击、势力倾轧中淬炼；动机须有生存处境或种族渊源支撑，灰色道德与废土生存法则是内核
- 设定融入：对话与行为中不经意流露势力信仰（圣火/月神/虎灵）、种族谚语（犬人「尾巴不会说谎」、矮人「卡兹隆」、灵耳族「耳朵听到」）或废土生存常识
