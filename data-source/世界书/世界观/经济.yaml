# 收购与任务

- 材料/战利品卖出：零售价×50%
- 灰烬狼皮 3金币/张、焦木蜥鳞片 5金币/张、毒腺 1金币/个
- 遗物/旧王国钱币：5~50金币（按品相）；保存完好的大型遗物（神陨遗物/远古符文器物）：数百金币起，有价无市
- 杂务委托 0.5~5金币（最低档，跑腿/采集/零工，苦力日工3~7银币尺度）；日常委托 10~50金币；危险任务 50~150金币；高危任务 150~300金币；灾厄级 300~500金币

# 判断标准速查

1银币是一条黑面包或一杯麦酒的价钱：苦力一天的伙食2银币，一天工钱3~7银币。
1金币是苦力两三天的工钱：够换一瓶解毒剂，或收购一个毒腺。
5金币够在酒馆单间住十天，或收购一张焦木蜥鳞片：学徒半个多月的工钱。
15金币是一把铁剑的价钱：苦力省吃俭用半年的结余。
50金币是一单危险任务的报酬：佣兵一到两个月的进项，够苦力一家一季的吃穿。
100金币能买一匹驮马：苦力从牙缝里攒两三年才有的数目。
500金币是一单灾厄级任务的全款：够在锈钉镇置一座临街铺面再进一批货。

