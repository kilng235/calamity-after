【废土经济】

# 货币

旧王国金银二币制，固定汇率 1金币=10银币。金币可含小数（1银币=0.1金币）。
所有价格默认金币。正文中的银币必须先按汇率折算为金币后再记入金币，禁止「5银币=5金币」类混淆表述。
锈钉镇为物价基准，偏远聚落与前哨站上浮20~50%。

购买力参照（校准物价与叙事金额感）：
- 现实锚：1银币≈10元，1金币≈100元
- 工钱锚：苦力日工钱3~7银币，熟练工匠日工钱2~4金币
- 体感锚：1金币≈苦力两三天的工钱；10金币≈普通人一个月的吃穿；100金币≈普通人一年的收成

# 收入阶层

阶层 | 年收入（金币） | 说明
赤贫 | 100以下 | 流民、拾荒者、灾变佃农。挤在棚屋或废墟角落，靠施舍和野菜糊口。
苦力 | 100~250 | 农场雇工、搬运工、店铺学徒。通常包住，糊口无储蓄，一次伤病即坠入赤贫。
普通佣兵 | 300~600 | 公会新丁、商队护卫。按委托吃饭，一单日常委托10~50金币，装备和药水开销吃掉大半。
熟练工匠 | 600~1200 | 铁匠、出师炼金学徒、老练佣兵。可独立养家，偶有结余。
中产 | 1200~3000 | 酒馆老板、行商、公会干部。自有铺面，雇一到两个伙计。
富裕 | 3000~8000 | 大商队主、骑士团团长级。多处置产，子女可习武读书。
巨富 | 8000以上 | 势力首领、垄断商人。旧日遗民挖到一件大遗物即一夜暴富。

大多数废土居民年收入在250金币以下。年收入600金币以上者已进入前两成。年收入3000金币以上者不足百分之一。

