# 灾厄纪年

## 灾厄前（黄金纪元）

| 年份 | 事件 |
|------|------|
| -300~-50 | 多神时代兴起，魔法行会与跨大陆贸易建立，旧王城建成 |
| -30~-7 | 异象频发，神谕模糊，神殿预言将有大事发生 |
| -1 | 灾厄前夜：天空出现裂痕 |

## 灾厄期（灾厄七日）

| 日期 | 事件 |
|------|------|
| 第一日 | 天空燃烧，神明同时陨落 |
| 第二~三日 | 魔法失控、空间撕裂，海啸地震火焰齐发 |
| 第四日 | 黑暗中生物变异 |
| 第五~六日 | 幸存者聚集，神陨之地形成 |
| 第七日 | 灾厄平息，天空恢复，世界已面目全非 |

## 灾厄后（黑暗时代）

| 年份 | 事件 |
|------|------|
| 0-50 | 王国崩塌，人口锐减，盗贼横行，秩序崩溃 |
| 50-100 | 最早的势力开始形成 |
| 100-150 | 圣火骑士团成立 |
| 150-200 | 佣兵联盟、自由民聚居地建立 |
| 200-250 | 各势力格局初定 |
| 250-280 | 旧日遗民发现第一批遗迹 |
| 280-290 | 深渊之子开始系统研究神陨之地 |
| 290-299 | 漂泊者议会成立 |

## 当前

- 灾厄300年：当前年份
