# ============================================================
# 数值契约（引擎数值唯一权威源）
# 由 data-source/tools/convert-yaml-to-js.js 生成 module/numeric-contract.js
# 引擎（command-processor / spell-system / opening-system / game-state）
# 的一切钳制上限与公式系数从此取值；修改数值只改本文件后重跑转换器。
# 修改时须同步核查世界书相关表述：
#   属性系统.yaml（派生表/硬约束）、背包系统.yaml（负重）、
#   经验与成长.yaml（HP/等级）、通用检定.yaml（命运点）、关系系统.yaml（双轴）
# ============================================================

# 生命：HP 上限 = 基础上限 + 每级成长 ×（等级−1）（属性系统·属性派生）
生命.基础上限: 100
生命.每级成长: 10

# 法力：MP 上限 = 智力 × 每点智力（属性系统·属性派生 / 法术总纲）
法力.每点智力: 5

# 命运点：上限（通用检定 §7 / 属性系统；「身份时刻」可经结算增加）
命运点.上限: 3

# 属性：六维合法数值域（属性系统·属性上限硬约束「3~20 唯一合法数值域」）
属性.下限: 3
属性.上限: 20
属性.默认值: 10

# 属性点：溢出攒存上限（属性系统·属性点分配）
属性点.存储上限: 10

# 负重：上限 = 基础 + 每点力量 × 力量；极端超重 = 上限 × 超重倍率（背包系统）
负重.基础: 10
负重.每点力量: 2
负重.超重倍率: 1.5

# 状态层级钳制（状态列表.yaml）
力竭.最高层级: 3
侵蚀.最高层级: 2

# 关系双轴（关系系统：好感度有正负，人情值单向）
好感度.最低: -100
好感度.最高: 100
人情值.最低: 0
人情值.最高: 100

# 材料档位：武器伤害加成（武器 yaml 材料加成公式表：一阶 +0 / 二阶 +1 / 三阶 +1 且升骰 / 灾厄 +2 且升骰）
材料伤害加成.档1: 0
材料伤害加成.档2: 1
材料伤害加成.档3: 1
材料伤害加成.档4: 2

# 材料档位：骰面升级（三阶起骰面 +2，封顶 d12）
材料升骰.起始档: 3
材料升骰.面数加成: 2
材料升骰.骰面上限: 12
