# ============================================================
# 装备映射（引擎模板名 ↔ 世界书规范名）
# 由 data-source/tools/convert-yaml-to-js.js 消费，生成 module/equipment-contract.js
#
# 规则：
# - 「武器/护甲」段：引擎模板保留结构字段（槽位/双手/隐匿/描述等），
#   数值字段（伤害骰/耐久上限/基准价格/AC 加成/重量档）以世界书 yaml 为权威覆盖
# - 引擎模板现已 100% 有世界书对应（废土风味名 ↔ 规范名，或同名自映射）
# - 「注册武器/注册护甲」段：世界书独有条目，按 yaml 数值自动注册为引擎新模板
#   （值为引擎 category 英文标识）
# - 「不注册」段：局部防护件（归身体槽叠穿），引擎 AC 模型不支持，仅解析不落地
# ============================================================

